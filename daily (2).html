<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
<title>Flex Kanban — Columns, Lock, Age, Mobile</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0e0f11;--bg2:#141518;--bg3:#1c1e22;--bg4:#242629;
--border:#2a2c31;--border2:#363940;
--text:#e8e9eb;--text2:#9a9da6;--text3:#5a5d66;
--blue:#4f8ef7;--blue-dim:#1a2d52;
--green:#3ecf8e;--green-dim:#0d3326;
--amber:#f7c35a;--amber-dim:#3d2e0a;
--red:#f76f6f;--red-dim:#3d1010;
--purple:#a78bfa;--purple-dim:#251d45;
--radius:10px;--radius-lg:14px;
--shadow:0 2px 12px rgba(0,0,0,.4);
}
body.light{
--bg:#f5f5f7;--bg2:#ffffff;--bg3:#f0f0f3;--bg4:#e8e8ec;
--border:#dddde3;--border2:#c8c8d0;
--text:#1a1a1f;--text2:#5a5a6e;--text3:#9a9aaa;
--blue-dim:#e8f0ff;--green-dim:#e6faf3;--amber-dim:#fff8e6;
--red-dim:#fff0f0;--purple-dim:#f3efff;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:4px;height:4px}
.app{display:flex;flex-direction:column;height:100vh}
/* HEADER - responsive */
.header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.logo{font-size:20px;font-weight:600;letter-spacing:-.5px}
.logo span{color:var(--blue)}
.stats-bar{display:flex;gap:6px;flex-wrap:wrap}
.stat-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border)}
.stat-pill.red{color:var(--red);border-color:var(--red-dim);background:var(--red-dim)}
.header-actions{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.search-icon-btn{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg3);font-size:16px}
.search-expand{position:relative;transition:0.2s}
.search-expand input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 28px 6px 12px;font-size:13px;width:180px;outline:none}
.search-expand input:focus{border-color:var(--blue)}
.clear-search{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;font-size:14px;cursor:pointer;color:var(--text3)}
.hdr-btn{padding:6px 12px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--bg3);display:inline-flex;align-items:center;gap:5px}
.hdr-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
/* BOARD: horizontal scroll */
.board-container{flex:1;overflow-x:auto;overflow-y:hidden;padding:12px}
.board{display:flex;gap:16px;height:100%;min-width:min-content}
/* COLUMN dynamic */
.column{width:300px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;max-height:100%}
.column-header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--bg3);flex-shrink:0}
.column-drag-handle{cursor:grab;font-size:16px;opacity:0.7;padding:0 4px;transition:.1s;user-select:none}
.column-drag-handle:active{cursor:grabbing}
.column-name{font-size:14px;font-weight:600;flex:1;background:transparent;border:none;padding:4px 6px;border-radius:6px;color:var(--text)}
.column-name:focus{background:var(--bg4);outline:1px solid var(--blue)}
.col-count{margin-left:auto;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;background:var(--bg4)}
.lock-btn,.col-edit-btn,.col-del-btn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;color:var(--text3)}
.lock-btn.locked{color:var(--green);background:var(--green-dim);border-radius:6px}
.col-body{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.col-add-card{width:100%;padding:8px;border-radius:8px;font-size:12px;color:var(--text3);border:1px dashed var(--border);background:transparent;margin-top:4px}
.col-add-card:hover{border-color:var(--text3);background:var(--bg3)}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;cursor:grab;transition:.15s;position:relative}
.card.dragging{opacity:0.5}
.card.aged{border-left:3px solid var(--amber)}
.card-title{font-size:13px;font-weight:500;word-break:break-word;margin-bottom:4px;padding-right:20px}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-bottom:4px}
.priority{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px}
.p0{background:var(--red-dim);color:var(--red)}
.p1{background:var(--amber-dim);color:var(--amber)}
.p2{background:var(--blue-dim);color:var(--blue)}
.age-footer{display:flex;justify-content:flex-end;margin-top:6px;font-size:10px;color:var(--text3);align-items:center;gap:4px}
.card-blocker{margin-top:6px;padding:5px 8px;background:var(--red-dim);border-radius:6px;font-size:11px;color:var(--red)}
.empty{text-align:center;padding:28px 12px;color:var(--text3);font-size:13px}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column}
.modal-header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.form-input,.form-select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:14px;color:var(--text)}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.md-editor-toolbar{display:flex;gap:4px;flex-wrap:wrap;background:var(--bg4);padding:4px 8px;border-bottom:1px solid var(--border)}
.md-render{font-size:13px;line-height:1.6;padding:8px}
.md-render code{background:var(--bg4);padding:2px 5px;border-radius:4px}
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:6px}
.toast{padding:8px 14px;border-radius:8px;background:var(--bg3);border-left:3px solid var(--blue)}
.confetti-piece{position:fixed;top:-10px;pointer-events:none;z-index:400}
@media (max-width: 640px){
  .header-actions{width:100%;justify-content:flex-end;margin-top:6px}
  .search-expand input{width:140px}
  .column{width:270px}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

// helpers
function uid(){return Math.random().toString(36).slice(2,10)}
function daysDiff(date){if(!date)return null;return Math.floor((Date.now()-new Date(date).getTime())/(86400000));}
function parseBlocker(content){if(!content)return null;const lower=content.toLowerCase();if(lower.includes('blocker')){const lines=content.split('\n');const idx=lines.findIndex(l=>/blocker/i.test(l));if(idx!==-1)return lines.slice(idx+1).join(' ').slice(0,100);}return null;}
function renderMd(text){if(!text)return'';return text.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n/g,'<br/>');}
function esc(s){return s.replace(/[&<>]/g,function(m){if(m==='&')return'&amp;';if(m==='<')return'&lt;';return'&gt;';});}

// Migration from old fixed columns (TODO,INPROGRESS,DISCUSSION,DONE) to dynamic
function migrateOldData(saved){
  if(saved && saved.columns && saved.cardsByColumn) return saved;
  if(saved && (saved.TODO || saved.INPROGRESS)){
    const old = saved;
    const columns = [];
    const cardsByColumn = {};
    const orderMap = {TODO:0, INPROGRESS:1, DISCUSSION:2, DONE:3};
    Object.keys(old).forEach(key=>{
      if(['TODO','INPROGRESS','DISCUSSION','DONE'].includes(key)){
        const colId = `col_${key.toLowerCase()}`;
        columns.push({id:colId, name:key.charAt(0)+key.slice(1).toLowerCase(), locked:false, order:orderMap[key]});
        cardsByColumn[colId] = old[key] || [];
      }
    });
    return {columns:columns.sort((a,b)=>a.order-b.order), cardsByColumn};
  }
  return null;
}
function loadData(){
  try{const raw=localStorage.getItem('daily_v4');if(raw){const parsed=JSON.parse(raw);if(parsed.columns && parsed.cardsByColumn) return parsed;const migrated=migrateOldData(parsed);if(migrated) return migrated;}return null;}catch(e){return null;}
}
function saveData(state){try{localStorage.setItem('daily_v4',JSON.stringify({columns:state.columns, cardsByColumn:state.cardsByColumn}));}catch(e){}}

// Confetti effect
function ConfettiTrigger(){const[pieces,setPieces]=useState([]);useEffect(()=>{const colors=['#4f8ef7','#3ecf8e','#f7c35a','#a78bfa'];const newPieces=[];for(let i=0;i<50;i++){newPieces.push({id:uid(),left:Math.random()*100,color:colors[Math.floor(Math.random()*colors.length)],size:5+Math.random()*7,dur:1.2+Math.random()*1.2,delay:Math.random()*0.6});}setPieces(newPieces);const t=setTimeout(()=>setPieces([]),2800);return()=>clearTimeout(t);},[]);return pieces.map(p=>(<div key={p.id} className="confetti-piece" style={{left:p.left+'%',width:p.size,height:p.size,background:p.color,position:'fixed',top:'-10px',animation:`fall ${p.dur}s linear forwards`,animationDelay:p.delay+'s'}}/>));}

function ToastMsg({toasts,setToasts}){useEffect(()=>{if(toasts.length){const t=setTimeout(()=>setToasts(prev=>prev.slice(1)),2200);return()=>clearTimeout(t);}},[toasts,setToasts]);return(<div className="toasts">{toasts.map(t=><div key={t.id} className="toast">{t.msg}</div>)}</div>);}

// Simple markdown editor
const MdSimple=({value,onChange})=>{
  const [mode,setMode]=useState('write');
  return(<div style={{border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}><div style={{display:'flex',gap:4,background:'var(--bg4)',padding:'4px 8px',borderBottom:'1px solid var(--border)'}}><button onClick={()=>setMode('write')}>✏️ Write</button><button onClick={()=>setMode('preview')}>👁 Preview</button><span style={{flex:1}}/><span style={{fontSize:11,color:'var(--text3)'}}>markdown</span></div>{mode==='write'?<textarea style={{width:'100%',padding:10,background:'var(--bg3)',border:'none',fontFamily:"'DM Mono',monospace",fontSize:12,minHeight:140}} value={value} onChange={e=>onChange(e.target.value)} placeholder="Details, ## BLOCKER ..."/>:<div className="md-render" style={{minHeight:140,background:'var(--bg3)'}} dangerouslySetInnerHTML={{__html:renderMd(esc(value))}}/>}</div>);
};

// Card Modal
function CardModal({card,columnId,onClose,onSave,onDelete,columns}){
  const [task,setTask]=useState(card.task);
  const [priority,setPriority]=useState(card.priority||'None');
  const [content,setContent]=useState(card.content||'');
  const [expiryDays,setExpiryDays]=useState(card.expiryDays??null);
  const isDoneCol = columns.find(c=>c.id===columnId)?.name.toUpperCase()==='DONE';
  const save=()=>{onSave({...card,task,priority,content,expiryDays});onClose();};
  return(<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}><div className="modal"><div className="modal-header"><input className="form-input" style={{fontSize:16,fontWeight:600}} value={task} onChange={e=>setTask(e.target.value)} placeholder="Task title"/><div style={{display:'flex',gap:6}}><button className="card-btn" onClick={()=>{if(confirm('Delete?'))onDelete(card.id);}}>🗑️</button><button onClick={onClose}>✕</button></div></div><div className="modal-body"><div className="form-row" style={{marginBottom:16}}><select className="form-select" value={priority} onChange={e=>setPriority(e.target.value)}>{['P0','P1','P2','None'].map(p=><option key={p}>{p}</option>)}</select>{isDoneCol && <select className="form-select" value={expiryDays??''} onChange={e=>setExpiryDays(e.target.value?Number(e.target.value):null)}><option value="">Never delete</option><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option></select>}</div><MdSimple value={content} onChange={setContent}/></div><div className="modal-footer"><button className="hdr-btn" onClick={onClose}>Cancel</button><button className="hdr-btn primary" onClick={save}>Save</button></div></div></div>);
}

// Add Card Modal
function AddCardModal({columnId,columnName,onClose,onAdd}){
  const [task,setTask]=useState('');
  const [priority,setPriority]=useState('None');
  const [content,setContent]=useState('');
  const add=()=>{if(!task.trim())return;onAdd({id:uid(),task:task.trim(),priority,content,createdAt:new Date().toISOString(),expiryDays:null});onClose();};
  return(<div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="modal"><div className="modal-header"><div>➕ New card · {columnName}</div><button onClick={onClose}>✕</button></div><div className="modal-body"><input className="form-input" placeholder="Task title" value={task} onChange={e=>setTask(e.target.value)} autoFocus onKeyDown={e=>e.key==='Enter'&&add()}/><div style={{marginTop:12}}><label className="form-label">Priority</label><select className="form-select" value={priority} onChange={e=>setPriority(e.target.value)}>{['P0','P1','P2','None'].map(p=><option key={p}>{p}</option>)}</select></div><div style={{marginTop:12}}><MdSimple value={content} onChange={setContent}/></div></div><div className="modal-footer"><button onClick={onClose}>Cancel</button><button className="hdr-btn primary" onClick={add}>Add Card</button></div></div></div>);
}

// Single Column Component
function ColumnComp({column,cards,onDropCard,onAddCard,onOpenCard,onDragCardStart,onDragOverCol,setDragOverCol,onRenameCol,onToggleLock,onDeleteCol,onStartColumnDrag,onColumnDrop,isDraggingColumn}){
  const [editingName,setEditingName]=useState(false);
  const [newName,setNewName]=useState(column.name);
  const handleRename=()=>{if(newName.trim())onRenameCol(column.id,newName.trim());setEditingName(false);};
  const blockerCount=cards.filter(c=>parseBlocker(c.content)).length;
  return(<div className="column" style={{opacity:isDraggingColumn?0.3:1}} onDragOver={e=>{e.preventDefault();setDragOverCol(column.id);}} onDragLeave={()=>setDragOverCol(null)} onDrop={e=>{e.preventDefault();onDropCard(column.id);setDragOverCol(null);}}><div className="column-header"><div className="column-drag-handle" draggable={!column.locked} onDragStart={e=>{if(!column.locked){e.dataTransfer.setData('text/plain',column.id);onStartColumnDrag(column.id);}}} onDragEnd={()=>onColumnDrop(null)}>⋮⋮</div>{editingName?<input className="column-name" value={newName} onChange={e=>setNewName(e.target.value)} onBlur={handleRename} onKeyDown={e=>e.key==='Enter'&&handleRename()} autoFocus/>:<span className="column-name" onDoubleClick={()=>!column.locked&&setEditingName(true)}>{column.name}</span>}<span className="col-count">{cards.length}</span>{blockerCount>0&&<span style={{fontSize:11}}>🚫{blockerCount}</span>}<button className={`lock-btn ${column.locked?'locked':''}`} onClick={()=>onToggleLock(column.id)} title={column.locked?'Unlock column (allow drag)':'Lock column (prevent drag)'}>{column.locked?'🔒':'🔓'}</button><button className="col-edit-btn" onClick={()=>setEditingName(true)} title="Rename column">✏️</button><button className="col-del-btn" onClick={()=>{if(confirm(`Delete "${column.name}" and all its cards?`))onDeleteCol(column.id);}} title="Delete column">🗑️</button></div><div className="col-body">{cards.length===0&&<div className="empty">✨ Empty</div>}{cards.map(card=><CardItem key={card.id} card={card} onDragStart={(id)=>onDragCardStart(id,column.id)} onOpen={onOpenCard}/>)}<button className="col-add-card" onClick={()=>onAddCard(column.id)}>＋ Add card</button></div></div>);
}

// Card Item
function CardItem({card,onDragStart,onOpen}){
  const age=daysDiff(card.createdAt);
  const blocker=parseBlocker(card.content);
  return(<div className={`card ${age>2?'aged':''}`} draggable onDragStart={()=>onDragStart(card.id)} onClick={()=>onOpen(card)}><div className="card-title">{card.task}</div><div className="card-meta">{card.priority!=='None'&&<span className={`priority p${card.priority[1]}`}>{card.priority}</span>}</div>{blocker&&<div className="card-blocker">🚫 {blocker.slice(0,70)}</div>}<div className="age-footer"><span>📅 {age!==null?`${age} day${age!==1?'s':''} old`:'just now'}</span></div></div>);
}

// MAIN APP
function App(){
  const saved=loadData();
  const defaultColumns = [
    {id:'col_todo', name:'Todo', locked:false, order:0},
    {id:'col_progress', name:'In Progress', locked:false, order:1},
    {id:'col_done', name:'Done', locked:false, order:2}
  ];
  const defaultCards = {
    col_todo: [{id:uid(),task:'Add dynamic columns',priority:'P1',content:'You can add/delete/rename columns.',createdAt:new Date(Date.now()-3*86400000).toISOString()}],
    col_progress: [{id:uid(),task:'Drag & drop columns',priority:'P0',content:'## BLOCKER\nLock button prevents column drag',createdAt:new Date(Date.now()-1*86400000).toISOString()}],
    col_done: [{id:uid(),task:'Initial setup',priority:'P2',content:'',createdAt:new Date(Date.now()-8*86400000).toISOString(),doneAt:new Date(Date.now()-2*86400000).toISOString(),expiryDays:7}]
  };
  const [columns,setColumns]=useState(saved? saved.columns : defaultColumns);
  const [cardsByColumn,setCardsByColumn]=useState(saved? saved.cardsByColumn : defaultCards);
  const [dragCardInfo,setDragCardInfo]=useState(null);
  const [dragOverColId,setDragOverColId]=useState(null);
  const [draggingColumnId,setDraggingColumnId]=useState(null);
  const [openCard,setOpenCard]=useState(null);
  const [openCardColId,setOpenCardColId]=useState(null);
  const [addColumnModal,setAddColumnModal]=useState(false);
  const [newColumnName,setNewColumnName]=useState('');
  const [searchQuery,setSearchQuery]=useState('');
  const [showSearch,setShowSearch]=useState(false);
  const [toasts,setToasts]=useState([]);
  const [confetti,setConfetti]=useState(false);
  const [lightTheme,setLightTheme]=useState(false);
  const [refreshKey,setRefreshKey]=useState(0); // forces re-render to update ages

  useEffect(()=>{document.body.classList.toggle('light',lightTheme);},[lightTheme]);
  useEffect(()=>{saveData({columns,cardsByColumn});},[columns,cardsByColumn]);
  // Auto-delete expired done cards based on doneAt + expiryDays
  useEffect(()=>{
    setCardsByColumn(prev=>{
      let changed=false;
      const newCards={...prev};
      columns.forEach(col=>{
        if(col.name.toUpperCase()==='DONE'){
          const filtered = prev[col.id]?.filter(card=>{
            if(!card.expiryDays || !card.doneAt) return true;
            const ageSinceDone = daysDiff(card.doneAt);
            return ageSinceDone < card.expiryDays;
          })||[];
          if(filtered.length !== (prev[col.id]?.length||0)){
            newCards[col.id]=filtered;
            changed=true;
          }
        }
      });
      if(changed) addToast('🗑️ Expired done tasks removed');
      return changed?newCards:prev;
    });
  },[refreshKey,columns]);

  const addToast=(msg)=>{const id=uid();setToasts(prev=>[...prev,{id,msg}]);};
  
  // Column reordering
  const reorderColumns=(srcId,targetId)=>{
    if(!srcId||!targetId||srcId===targetId)return;
    const srcIdx=columns.findIndex(c=>c.id===srcId);
    const tgtIdx=columns.findIndex(c=>c.id===targetId);
    if(srcIdx===-1||tgtIdx===-1)return;
    if(columns[srcIdx].locked || columns[tgtIdx].locked) return;
    const newCols=[...columns];
    const [moved]=newCols.splice(srcIdx,1);
    newCols.splice(tgtIdx,0,moved);
    setColumns(newCols.map((c,i)=>({...c,order:i})));
  };
  const handleColumnDragStart=(colId)=>{setDraggingColumnId(colId);};
  const handleColumnDrop=(targetId)=>{if(draggingColumnId && targetId && draggingColumnId!==targetId) reorderColumns(draggingColumnId,targetId);setDraggingColumnId(null);};
  
  // Card drag drop
  const onDragCardStart=(cardId,fromColId)=>{setDragCardInfo({cardId,fromColId});};
  const onDropCard=(toColId)=>{
    if(!dragCardInfo) return;
    if(dragCardInfo.fromColId===toColId){setDragCardInfo(null);return;}
    const card = cardsByColumn[dragCardInfo.fromColId]?.find(c=>c.id===dragCardInfo.cardId);
    if(!card) {setDragCardInfo(null);return;}
    const updatedCard = {...card};
    const targetCol = columns.find(c=>c.id===toColId);
    if(targetCol && targetCol.name.toUpperCase()==='DONE' && !updatedCard.doneAt){
      updatedCard.doneAt = new Date().toISOString();
      setConfetti(true); setTimeout(()=>setConfetti(false),2000);
      addToast('🎉 Moved to Done!');
    }
    setCardsByColumn(prev=>({
      ...prev,
      [dragCardInfo.fromColId]: prev[dragCardInfo.fromColId].filter(c=>c.id!==dragCardInfo.cardId),
      [toColId]: [...(prev[toColId]||[]), updatedCard]
    }));
    setDragCardInfo(null);
  };
  
  const addCard=(colId,cardData)=>{setCardsByColumn(prev=>({...prev,[colId]:[...(prev[colId]||[]),cardData]}));addToast('Card added');};
  const updateCard=(updated)=>{setCardsByColumn(prev=>{const colId=Object.keys(prev).find(c=>prev[c]?.some(x=>x.id===updated.id));if(!colId)return prev;return{...prev,[colId]:prev[colId].map(c=>c.id===updated.id?updated:c)};});addToast('Card saved');};
  const deleteCard=(cardId)=>{setCardsByColumn(prev=>{const colId=Object.keys(prev).find(c=>prev[c]?.some(x=>x.id===cardId));if(!colId)return prev;return{...prev,[colId]:prev[colId].filter(c=>c.id!==cardId)};});setOpenCard(null);addToast('Card deleted');};
  
  const addNewColumn=()=>{if(!newColumnName.trim())return;const newId=`col_${uid()}`;const newCol={id:newId,name:newColumnName.trim(),locked:false,order:columns.length};setColumns([...columns,newCol]);setCardsByColumn(prev=>({...prev,[newId]:[]}));setNewColumnName('');setAddColumnModal(false);addToast(`➕ Column "${newColumnName}" added`);};
  const renameColumn=(colId,newName)=>{setColumns(cols=>cols.map(c=>c.id===colId?{...c,name:newName}:c));addToast(`Renamed column`);};
  const toggleLock=(colId)=>{setColumns(cols=>cols.map(c=>c.id===colId?{...c,locked:!c.locked}:c));addToast(columns.find(c=>c.id===colId)?.locked?'Column unlocked':'Column locked');};
  const deleteColumn=(colId)=>{if(columns.length<=1){addToast('❌ At least one column required');return;}setColumns(cols=>cols.filter(c=>c.id!==colId));setCardsByColumn(prev=>{const{[colId]:_,...rest}=prev;return rest;});addToast('Column deleted');};
  
  const filteredColumns = [...columns].sort((a,b)=>a.order-b.order);
  const getFilteredCards=(colId)=>{let cards=cardsByColumn[colId]||[];if(searchQuery.trim()){const q=searchQuery.toLowerCase();cards=cards.filter(c=>c.task.toLowerCase().includes(q)||(c.content||'').toLowerCase().includes(q));}return cards;};
  const totalTasks=Object.values(cardsByColumn).flat().length;
  const totalBlockers=Object.values(cardsByColumn).flat().filter(c=>parseBlocker(c.content)).length;
  
  return(<div className="app"><div className="header"><div className="logo">Daily<span>.</span></div><div className="stats-bar"><div className="stat-pill">📋 {totalTasks}</div>{totalBlockers>0&&<div className="stat-pill red">🚫 {totalBlockers}</div>}</div><div className="header-actions"><button className="hdr-btn" onClick={()=>setLightTheme(v=>!v)} title="Light/Dark theme">{lightTheme?'🌙 Dark':'☀️ Light'}</button><button className="hdr-btn" onClick={()=>setRefreshKey(k=>k+1)} title="Refresh card ages (recalculate days)">⟳ Refresh</button><button className="hdr-btn" onClick={()=>setAddColumnModal(true)} title="Add new status column">+ Column</button><button className="search-icon-btn" onClick={()=>setShowSearch(!showSearch)} title="Search cards">🔍</button>{showSearch && <div className="search-expand"><input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Search tasks..." autoFocus/><button className="clear-search" onClick={()=>setSearchQuery('')}>✕</button></div>}<button className="hdr-btn" onClick={()=>{const data=JSON.stringify({columns,cardsByColumn},null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download='kanban-dynamic.json';a.click();addToast('Exported');}} title="Export board">📤 Export</button><button className="hdr-btn" onClick={()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(p.columns&&p.cardsByColumn){setColumns(p.columns);setCardsByColumn(p.cardsByColumn);addToast('Import success');}else throw'';}catch{addToast('Invalid file');}};reader.readAsText(f);};inp.click();}} title="Import backup">📥 Import</button></div></div><div className="board-container"><div className="board">{filteredColumns.map(col=>(<ColumnComp key={col.id} column={col} cards={getFilteredCards(col.id)} onDropCard={onDropCard} onAddCard={addCard} onOpenCard={(card)=>{setOpenCard(card);setOpenCardColId(col.id);}} onDragCardStart={onDragCardStart} onDragOverCol={setDragOverColId} setDragOverCol={setDragOverColId} onRenameCol={renameColumn} onToggleLock={toggleLock} onDeleteCol={deleteColumn} onStartColumnDrag={handleColumnDragStart} onColumnDrop={handleColumnDrop} isDraggingColumn={draggingColumnId===col.id}/>))}</div></div>{openCard && <CardModal card={openCard} columnId={openCardColId} columns={columns} onClose={()=>setOpenCard(null)} onSave={updateCard} onDelete={deleteCard}/>}{addColumnModal && <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)setAddColumnModal(false);}}><div className="modal" style={{maxWidth:400}}><div className="modal-header"><span>➕ New Status Column</span><button onClick={()=>setAddColumnModal(false)}>✕</button></div><div className="modal-body"><input className="form-input" placeholder="Column name (e.g. Review, Backlog)" value={newColumnName} onChange={e=>setNewColumnName(e.target.value)} autoFocus onKeyDown={e=>e.key==='Enter'&&addNewColumn()}/></div><div className="modal-footer"><button onClick={()=>setAddColumnModal(false)}>Cancel</button><button className="hdr-btn primary" onClick={addNewColumn}>Create</button></div></div></div>}<ToastMsg toasts={toasts} setToasts={setToasts}/>{confetti && <ConfettiTrigger/>}</div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
