            }

            const q = search.trim().toLowerCase();
            const filteredCards = useMemo(() => {
                if (!q) return cards; const out = {}; Object.keys(cards).forEach(
                    k => {
                        out[k] = (cards[k] || []).filter(c => c.task.toLowerCase().includes(q) || (c.content || '')
                            .toLowerCase().includes(q));
                    }); return out;
            }, [cards, q]);
            const totalAll = cols.reduce((a, c) => a + (cards[c.id] || []).length, 0);
            const totalBlockers = cols.reduce((a, c) => a + (cards[c.id] || []).filter(x => parseBlocker(x.content))
                .length, 0);
            const totalDone = cols.reduce((a, c) => a + (cards[c.id] || []).filter(x => x.doneAt).length, 0);
            const activeTimers = Object.values(timers).filter(t => t.running && t.remaining > 0).length;

            const overflowItems = [
                {
                    icon: '🔍', label: 'Search', action: () => {
                        setSearchOpen(o => !o); if (!searchOpen)
                            setTimeout(() => searchRef.current?.focus(), 80);
                    }
                },
                { icon: '📝', label: 'Scratch Pad', action: () => setShowEditor(o => !o) },
                { icon: '✏️', label: 'Drawing Board', action: () => setShowDraw(true) },
                { icon: '🤖', label: 'AI Assistants', action: () => setShowAi(o => !o) },
                null,
                { icon: '🔎', label: 'Image → Text', action: () => setShowOcr(true) },
                { icon: '⚖️', label: 'Diff Checker', action: () => setShowDiff(true) },
                { icon: '🔄', label: 'Base64 Converter', action: () => setShowBase64(true) },
                { icon: '📐', label: 'Diagrams', action: () => setShowKroki(true) },
                { icon: '✨', label: 'JSON Prettifier', action: () => setShowJson(true) },
                { icon: '🏷️', label: 'ZPL', action: () => setShowZpl(true) },

                null,
                { icon: '📅', label: 'Calendar', action: () => runFeature('calendar') },
                { icon: 'History', label: 'Time Machine', action: () => runFeature('history') },
                { icon: '🔄', label: 'Refresh Ages', spinning, action: () => refreshAge() },
                {
                    icon: light ? '🌙' : '☀️', label: light ? 'Dark Mode' : 'Light Mode', action: () => setLight(l =>
                        !l)
                },
                {
                    icon: getNotificationPermission() === 'granted' ? '🔔' : '🔕',
                    label: getNotificationPermission() === 'granted'
                        ? 'Notifications: On'
                        : getNotificationPermission() === 'denied'
                            ? 'Notifications: Blocked'
                            : 'Enable Notifications',
                    action: enableNotifications,
                    badge: getNotificationPermission() === 'granted'
                        ? { text: 'ON', bg: 'var(--green-dim)', color: 'var(--green)' }
                        : getNotificationPermission() === 'denied'
                            ? { text: 'OFF', bg: 'var(--red-dim)', color: 'var(--red)' }
                            : null,
                },
                null,
                { icon: '⌨️', label: 'Shortcuts', action: () => setShowShortcuts(true) },
                { icon: 'CircleHelp', label: 'Replay Tour', action: () => runFeature('tour') },
                { icon: 'Columns3', label: 'New column', action: () => runFeature('column') },
                { icon: 'GitMerge', label: 'Review sync conflicts', action: () => runFeature('conflicts') },
                null,
                { icon: '⬇️', label: 'Import JSON', action: () => importJSON() },
                { icon: '⬆️', label: 'Export JSON', action: () => exportJSON() },
                null,
                {
                    icon: '📱', label: 'Install App', action: () => installPwa(), badge: {
                        text: 'Install',
                        bg: 'var(--blue-dim)', color: 'var(--blue)'
                    }
                },
            ].map(item => {
                if (!item) return item;
                const feature = APP_FEATURES.find(feature => feature.label === item.label
                    || (item.label === 'Calendar' && feature.id === 'calendar')
                    || (/^(Light|Dark) Mode$/.test(item.label) && feature.id === 'theme')
                    || (item.label.startsWith('Notifications:') && feature.id === 'notifications'));
                return { ...item, shortcut: feature?.key, featureId: feature?.id };
            });

            const renderFeatureShortcuts = () => (
                <>
                    <HeaderTool icon="ScanText" label="Image → Text" active={showOcr}
                        onClick={() => setShowOcr(o => !o)} />
                    <HeaderTool icon="Files" label="Diff Checker" active={showDiff}
                        onClick={() => setShowDiff(o => !o)} />
                    <HeaderTool icon="Binary" label="Base64 Converter" active={showBase64}
                        onClick={() => setShowBase64(o => !o)} />
                    <HeaderTool icon="Workflow" label="Diagrams" active={showKroki}
                        onClick={() => setShowKroki(o => !o)} />
                    <HeaderTool icon="Braces" label="JSON Prettifier" active={showJson}
                        onClick={() => setShowJson(o => !o)} />
                    <HeaderTool icon="Barcode" label="ZPL" active={showZpl}
                        onClick={() => setShowZpl(o => !o)} />
                </>
            );

            const renderDesktopHeader = () => (
                <>
                    <div className="stats-desktop" style={{ display: 'flex', gap: 5, flexShrink: 0 }}>
                        <div className="stat-pill">{totalAll} tasks</div>
                        {totalBlockers > 0 && <div className="stat-pill red"><Icon name="CircleAlert" size="1em" /> {totalBlockers}</div>}
                        {totalDone > 0 && <div className="stat-pill green"><Icon name="Check" size="1em" /> {totalDone}</div>}
                        {activeTimers > 0 && <div className="stat-pill" style={{
                            color: 'var(--blue)',
                            borderColor: 'var(--blue-dim)', background: 'var(--blue-dim)'
                        }}><Icon name="Timer" size="1em" /> {activeTimers}</div>}
                    </div>
                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 3, alignItems: 'center' }}>
                        <div className="search-wrap">
                            {searchOpen && (<div style={{
                                position: 'relative', display: 'flex',
                                alignItems: 'center'
                            }}><span style={{
                                position: 'absolute', left: 9,
                                top: '50%', transform: 'translateY(-50%)', color: 'var(--text3)',
                                pointerEvents: 'none'
                            }}><Icon name="Search" /></span><input
                                    ref={searchRef} className="search-inp" value={search} onChange={e =>
                                        setSearch(e.target.value)} placeholder="Search…" onKeyDown={e => {
                                            if (
                                                e.key === 'Escape') {
                                                setSearch('');
                                                setSearchOpen(false);
                                            }
                                        }} /></div>)}
                            <button className={`ibtn${searchOpen ? ' active' : ''}`} data-tip="Search" onClick={() => {
                                setSearchOpen(o => !o); if (!searchOpen) setTimeout(() => searchRef
                                    .current?.focus(), 80);
                            }} aria-label="Search" title="Search (/)" data-tour="search"><Icon name="Search" /></button>
                        </div>
                        <HeaderTool icon="NotebookPen" label="Scratch Pad" tour="scratch" active={showEditor}
                            onClick={() => setShowEditor(o => !o)} />
                        <HeaderTool icon="Paintbrush" label="Drawing" onClick={() => setShowDraw(true)} />
                        {renderFeatureShortcuts()}
                        <HeaderTool icon="CalendarDays" label="Calendar" tour="calendar" active={showCalendar}
                            onClick={() => { if (showCalendar) setShowCalendar(false); else runFeature('calendar'); }} />
                        <HeaderTool icon="Users" label="Collaborate" tour="sync" active={peerStatus === 'connected'}
                            onClick={() => setShowSyncModal(true)} />
                        <div style={{ position: 'relative' }}>
                            <HeaderTool icon="Wrench" label="Tools" active={showOverflow}
                                onClick={() => setShowOverflow(o => !o)} />
                            {showOverflow && <OverflowMenu items={overflowItems} tourActive={showTour} onClose={() => setShowOverflow(false)} />}
                        </div>
                        <button className="ibtn" data-tip={light ? 'Dark mode' : 'Light mode'} onClick={() => setLight(
                            l => !l)} aria-label={light ? 'Dark mode' : 'Light mode'}>{light
                                ? <Icon name="Moon" />
                                : <Icon name="Sun" />}</button>
                    </div>
                </>
            );

            const renderMobileTabletHeader = () => (
                <>
                    <div className="header-stats" style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                        <div className="stat-pill" style={{ fontSize: 10, padding: '2px 6px' }}>{totalAll}</div>
                        {totalBlockers > 0 && <div className="stat-pill red" style={{ fontSize: 10, padding: '2px 6px' }}>
                            <Icon name="CircleAlert" size="1em" />{totalBlockers}</div>}
                        {activeTimers > 0 && <div className="stat-pill" style={{
                            fontSize: 10, padding: '2px 6px',
                            color: 'var(--blue)', borderColor: 'var(--blue-dim)',
                            background: 'var(--blue-dim)'
                        }}><Icon name="Timer" size="1em" />{activeTimers}</div>}
                    </div>
                    <div className="compact-header-actions" style={{ marginLeft: 'auto', display: 'flex', gap: 3, alignItems: 'center' }}>
                        {searchOpen && (<div className="header-search" style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
                            <span style={{
                                position: 'absolute', left: 8, top: '50%', transform: 'translateY(-50%)',
                                color: 'var(--text3)', pointerEvents: 'none'
                            }}><Icon name="Search" size={12} /></span>
                            <input ref={searchRef} className="search-inp" value={search} onChange={e =>
                                setSearch(e.target.value)} placeholder="Search…" onKeyDown={e => {
                                    if (e
                                        .key === 'Escape') {
                                        setSearch('');
                                        setSearchOpen(false);
                                    }
                                }} style={{ paddingLeft: 28 }} /></div>)}
                        <button className={`ibtn${searchOpen ? ' active' : ''}`} aria-label="Search" title="Search cards (/)" data-tour="search" onClick={() => {
                            setSearchOpen(o =>
                                !o); if (!searchOpen) setTimeout(() => searchRef.current?.focus(), 80);
                        }}><Icon name="Search" /></button>
                        {!mobile && renderFeatureShortcuts()}
                        <button className={`ibtn${(peerStatus === 'connected' || peerStatus === 'hosting') ? ' active' : ''}`}
                            aria-label="Collaborate" title="Collaborate and sync (S)" data-tour="sync" onClick={() => setShowSyncModal(true)} style={{ position: 'relative' }}><Icon name="Users" size={14} />{(peerStatus ===
                                            'connected' || peerStatus === 'hosting') && <div className={`sync-dot ${peerStatus === 'connected' ? 'connected' : 'connecting'}`}
                                                style={{ position: 'absolute', bottom: -2, right: -2, width: 8, height: 8 }} />}</button>
                        <div data-tour="mobile-menu" style={{ position: 'relative' }}><button className={`ibtn header-tool${showOverflow ? ' active' : ''}`}
                            aria-label="Tools" title="Tools (K)" data-tour="tools" onClick={() => setShowOverflow(o => !o)}><Icon name="Wrench" /></button>{showOverflow &&
                                        <OverflowMenu items={overflowItems} tourActive={showTour} onClose={() => setShowOverflow(false)} />}</div>
                    </div>
                </>
            );

            if (showDraw) {
                return (
                    <>
                        <DrawPanel onClose={() => setShowDraw(false)} light={light} />
                        <Toast toasts={toasts} />
                        <AlarmOverlay alarms={alarms} onDismiss={dismissAlarms} />
                    </>
                );
            }

            return (
                <div className="app">
                    <div className="header">
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0, marginRight: 4 }}>
                            <img
                                src="./daily-icon.png"
                                alt="Daily"
                                style={{ width: 26, height: 26, borderRadius: 6, display: 'block', flexShrink: 0 }}
                                onError={e => { e.currentTarget.style.display = 'none'; }}
                            />
                            <div className="logo" style={{ marginRight: 0 }}>Daily<span>.</span></div>
                        </div>
                        {!online && (
                            <div className="offline-pill"
                                title="No internet connection — all data stays on this device">
                                <Icon name="WifiOff" />
                                <span className="offline-text">Offline</span>
                            </div>
                        )}
                        {(mobile || tablet) ? renderMobileTabletHeader() : renderDesktopHeader()}
                        {activeRoom && conflicts.length > 0 && <button className="ibtn" title={conflicts.length + ' sync conflicts'}
                            aria-label="Review sync conflicts" style={{ color: 'var(--amber)' }} onClick={() => setShowConflicts(true)}>
                            <Icon name="GitMerge" />
                        </button>}
                    </div>
                    {collaborative && <div role="status" style={{ display: 'flex', alignItems: 'center', gap: 8,
                        flexWrap: 'wrap', padding: '8px 14px', background: 'var(--green-dim)', fontSize: 12 }}>
                        <Icon name="Users" size={16} />
                        <strong>{hostRef.current ? 'Hosting shared board' : 'Shared board'}</strong>
                        <span>{peerStatus === 'connected' ? 'Live' : 'Reconnecting - edits saved locally'} - {participants.length} online</span>
                        <span style={{ flex: 1 }}>{participants.map(person => person.name + (person.host ? ' (Host)' : '')).join(', ')}</span>
                        {!hostRef.current && <button className={`btn${followHost ? ' primary' : ''}`}
                            onClick={() => setFollowHost(value => !value)}>{followHost ? 'Stop following host' : 'Follow host card'}</button>}
                        <button className="btn" onClick={() => setShowSyncModal(true)}>Invite / Leave</button>
                    </div>}
                    <div className="board-wrap">
                        <div className="board" ref={boardRef} data-tour="board" onDragEnd={() => {

                            setDragCardId(null);
                            setDragCardFrom(null);
                            setDragColId(null);
                            setColDropTarget(null);
                        }}>
                            {cols.map(col => (
                                <Column key={col.id} colData={col} cards={filteredCards[col.id] || []} allCols={cols}
                                    now={now} timers={timers}
                                    dragCardId={dragCardId} isColDragging={dragColId === col.id} isColDropTarget={
                                        colDropTarget === col.id}
                                    onCardDrop={onCardDrop} onCardReorder={onCardReorder}
                                    onColDragStart={onColDragStart} onColDragOver={onColDragOver} onColDrop={onColDrop}
                                    onOpen={card => {
                                        setFollowHost(false);
                                        setOpenCard(card);
                                        setOpenCardCol(col.id);
                                    }}
                                    onAddCard={setAddCardCol} onDeleteCol={onDeleteCol} onToggleLock={onToggleLock}
                                    onRenameCol={onRenameCol}
                                    onClearCards={onClearCards}
                                />
                            ))}
                            <button className="add-col-btn" title="Add column" onClick={() => setShowAddCol(true)} aria-label="Add column">
                                <span data-tour="add-column" style={{ display: 'inline-flex' }}><Icon name="Plus" size={18} /></span>
                            </button>
                        </div>
                        {collaborative && peerStatus === 'connected' && <CollaborationCursors boardRef={boardRef}
                            cursors={remoteCursors} participants={participants} sessionId={SESSION_ID.current} />}
                    </div>
                    <button className="fab" data-tour="fab" onClick={() => runFeature('card')} title="New card (N)" aria-label="New card (N)">
                        <Icon name="Plus" size={18} />
                    </button>

                    {openCard && openCardCol && (<CardModal card={openCard} col={openCardCol} cols={cols} now={now}
                        timers={timers} setTimers={setTimers} addToast={addToast} onClose={() => {
                            setOpenCard(null);
                            setFollowHost(false);
                        }} onSave={onSaveCard} onDelete={onDeleteCard} onMove={onMoveCard}
                        onLiveChange={collaborative ? onLiveCardChange : undefined} />)}
                    {addCardCol && <AddCardModal defaultCol={addCardCol} cols={cols} onClose={() => setAddCardCol(
                        null)} onAdd={onAddCard} />}
                    {showAddCol && <AddColModal onClose={() => setShowAddCol(false)} onAdd={onAddCol} />}
                    {showShortcuts && <ShortcutsPanel onClose={() => setShowShortcuts(false)} onAction={id => {
                        closeFeaturePanels(); runFeature(id);
                    }} />}
                    {showEditor && <ScratchPad content={scratch} onChange={setScratch} onClose={() => setShowEditor(
                        false)} />}
                    {showAi && <AiPanel onClose={() => setShowAi(false)} />}
                    {showKroki && <KrokiPanel onClose={() => setShowKroki(false)} />}
                    {showZpl && <ZplPanel onClose={() => setShowZpl(false)} />}
                    {showJson && <JsonPanel onClose={() => setShowJson(false)} />}
                    {showCalendar && <CalendarPanel onClose={() => setShowCalendar(false)} addToast={addToast}
                        initialTab={calendarInitialTab} />}
                    {showOcr && <OcrPanel onClose={() => setShowOcr(false)} addToast={addToast} />}
                    {showDiff && <DiffPanel onClose={() => setShowDiff(false)} addToast={addToast} />}

                    {showBase64 && <Base64Converter onClose={() => setShowBase64(false)} />}
                    {showSyncModal && <SyncModal
                        onClose={() => setShowSyncModal(false)} peerStatus={peerStatus} peerCount={peerCount}
                        roomId={roomId} setRoomId={setRoomId} createRoom={createRoom} joinRoom={joinRoom}
                        disconnectRoom={disconnectRoom} myPeerId={myPeerId} activeRoom={activeRoom}
                        broadcastWebSocket={broadcastWebSocket} hostBoard={hostBoard} joinBoard={joinBoard}
                        collaborative={collaborative} participants={participants} displayName={displayName}
                        setDisplayName={setDisplayName} serverUrl={serverUrl} setServerUrl={setServerUrl} addToast={addToast} />}
                    {activeRoom && conflicts.length > 0 && showConflicts && <ConflictModal conflicts={conflicts} onResolve={resolveConflict}
                        onClose={() => setShowConflicts(false)} />}
                    {confetti && <Confetti key={confettiKey.current} />}
                    <Toast toasts={toasts} />
                    {showNotifPrompt && (
                        <NotificationPrompt addToast={addToast} onClose={() => setShowNotifPrompt(false)} />
                    )}
                    <AlarmOverlay alarms={alarms} onDismiss={dismissAlarms} />
                    <EventAlarmOverlay alarms={eventAlarms} onDismiss={dismissEventAlarms} onSnooze={snoozeEventAlarms} />

                    {pwaPrompt && !mobile && (
                        <div className="pwa-banner">
                            <div><div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}><Icon name="Smartphone" size="1em" /> Install Daily.</div>
                                <div style={{ fontSize: 11, color: 'var(--text3)' }}>Use as a standalone app</div></div>
                            <button className="pwa-install" onClick={installPwa}>Install</button>
                            <button className="pwa-dismiss" onClick={() => setPwaPrompt(null)} aria-label="Close" title="Close"><Icon name="X" size="1em" /></button>
                        </div>
                    )}
                    {showTour && (
                        <Tour steps={TOUR_STEPS} onFinish={finishTour} onSkip={skipTour} onRevealMenu={setShowOverflow} />
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <ConfirmProvider><App /></ConfirmProvider>
        );
    </script>
</body>

</html>
