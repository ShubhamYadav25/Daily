        /* ── FLOATING PANEL ── */
        function FloatingPanel({ title, icon, onClose, children, initW = 560, initH = 420, initX = null, initY = null,
            storageKey, extraHeaderContent, panelRef, className = '', dragSurface = false, minHeight = 180 }) {
            const mobile = useIsMobile();
            const defX = initX !== null ? initX : Math.max(20, window.innerWidth - initW - 20);
            const defY = initY !== null ? initY : Math.max(60, window.innerHeight - initH - 80);
            const { sz, preferredSize, setSz, startResize } = useResize(initW, initH, defX, defY, minHeight);
            const drag = useRef(null);
            const ownRef = useRef();
            const ref = panelRef || ownRef;
            const [maximized, setMaximized] = useState(false);
            const prevSzRef = useRef(null);

            // Clamp loaded position to viewport on mount
            useEffect(() => {
                if (!storageKey) return;
                try {
                    const saved = JSON.parse(localStorage.getItem(storageKey + '_pos') || 'null');
                    if (saved) {
                        setSz(saved);
                    }
                } catch { }
                // eslint-disable-next-line
            }, []);

            useEffect(() => {
                if (!storageKey) return;
                try { localStorage.setItem(storageKey + '_pos', JSON.stringify(preferredSize)); } catch { }
            }, [preferredSize, storageKey]);

            useEffect(() => () => drag.current?.cleanup(), []);

            function startPanelDrag(e) {
                if (mobile || e.button !== 0 || e.isPrimary === false || maximized) return;
                if (e.target.closest('button,input,textarea,select,a,.md-render,.fp-resize')) return;
                const el = ref.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                const start = { ox: e.clientX - r.left, oy: e.clientY - r.top, pointerId: e.pointerId };
                const onMove = ev => {
                    if (ev.pointerId !== start.pointerId) return;
                    const next = fitPanel({ w: r.width, h: r.height, x: ev.clientX - start.ox, y: ev.clientY - start.oy });
                    setSz(s => ({ ...s, x: next.x, y: next.y }));
                };
                const onUp = () => {
                    drag.current = null;
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    window.removeEventListener('blur', onUp);
                };
                drag.current = { cleanup: onUp };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
                window.addEventListener('blur', onUp);
                e.preventDefault();
            }

            function toggleMaximize() {
                if (maximized) {
                    if (prevSzRef.current) setSz(prevSzRef.current);
                    setMaximized(false);
                } else {
                    prevSzRef.current = { ...sz };
                    setSz({ x: 10, y: 60, w: window.innerWidth - 20, h: window.innerHeight - 80 });
                    setMaximized(true);
                }
            }

            function minimizeToHalf() {
                if (maximized) {
                    if (prevSzRef.current) setSz(prevSzRef.current);
                    setMaximized(false);
                    return;
                }
                const w = Math.round(window.innerWidth * 0.5);
                const h = Math.round(window.innerHeight * 0.5);
                const x = Math.round((window.innerWidth - w) / 2);
                const y = Math.round((window.innerHeight - h) / 2);
                setSz({ x, y, w, h });
            }

            if (mobile) return (
                <div ref={ref} className={'fp ' + className}>
                    <div className="fp-hdr">
                        <Icon name={FEATURE_ICONS[title] || icon} /><span className="fp-title">{title}</span>
                        {extraHeaderContent}
                        <button onClick={onClose} aria-label="Close panel" style={{
                            fontSize: 14, color: 'var(--text3)', background: 'none',
                            border: 'none', cursor: 'pointer', padding: '2px 6px',
                            marginLeft: extraHeaderContent ? 0 : 'auto'
                        }}><Icon name="X" size="1em" /></button>
                    </div>
                    <div className="fp-content" style={{ flex: 1, overflow: 'auto', minHeight: 0, display: 'flex', flexDirection: 'column' }}>
                        {children}</div>
                </div>
            );

            return (
                <div ref={ref} className={'fp ' + className} onPointerDown={dragSurface ? startPanelDrag : undefined} style={{
                    left: sz.x, top: sz.y, width: sz.w, height: sz.h,
                    position: 'fixed'
                }}>
                    {!maximized && ['n', 's', 'e', 'w', 'nw', 'ne', 'sw', 'se'].map(d => (
                        <div key={d} className={`fp-resize ${d}`} style={{ touchAction: 'none' }}
                            onPointerDown={e => startResize(d, e)} />
                    ))}
                    <div className="fp-hdr" onPointerDown={dragSurface ? undefined : startPanelDrag}
                        style={{ cursor: maximized ? 'default' : 'move', touchAction: 'none' }}>
                        <Icon name={FEATURE_ICONS[title] || icon} /><span className="fp-title">{title}</span>
                        {extraHeaderContent}
                        <button onClick={minimizeToHalf} title="Minimize to 50 %" style={{
                            fontSize: 13, color: 'var(--text3)', background: 'none',
                            border: 'none', cursor: 'pointer', padding: '2px 8px',
                            display: 'flex', alignItems: 'center'
                        }} aria-label="Minimize to 50 %">
                            <Icon name="PanelBottom" size={11} />
                        </button>
                        <button onClick={toggleMaximize} title={maximized ? 'Restore' : 'Maximize'}
                            style={{
                                fontSize: 13, color: 'var(--text3)', background: 'none',
                                border: 'none', cursor: 'pointer', padding: '2px 8px',
                                marginLeft: extraHeaderContent ? 0 : 'auto',
                                display: 'flex', alignItems: 'center'
                            }} aria-label={maximized ? 'Restore' : 'Maximize'}>
                            {maximized ? (
                                <Icon name="Minimize2" size={11} />
                            ) : (
                                <Icon name="Maximize2" size={11} />
                            )}
                        </button>
                        <button onClick={onClose} aria-label="Close panel" style={{
                            fontSize: 14, color: 'var(--text3)', background: 'none',
                            border: 'none', cursor: 'pointer', padding: '2px 6px'
                        }}><Icon name="X" size="1em" /></button>

                    </div>
                    <div className="fp-content" style={{ flex: 1, overflow: 'auto', minHeight: 0, display: 'flex', flexDirection: 'column' }}>
                        {children}</div>
                </div>
            );
        }
        /* ── SCRATCH PAD ── */
        function ScratchPad({ content, onChange, onClose }) {
            const confirm = useConfirm();

            return (
                <div id="scratch-fp">
                    <FloatingPanel title="Scratch Pad" icon="📝" onClose={onClose} initW={560} initH={440}

                        extraHeaderContent={
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginRight: 4 }}>
                                <button title="Clear scratch pad" aria-label="Clear scratch pad" disabled={!content.trim()} onClick={async () => {

        /* ══════════════════════════════════════════════════════════
           OCR — IMAGE  →  TEXT  (Tesseract.js)
           ══════════════════════════════════════════════════════════ */
        const OCR_LANGS = [
            { code: 'eng', label: 'English' },
            { code: 'hin', label: 'Hindi (हिन्दी)' },
            { code: 'tam', label: 'Tamil (தமிழ்)' },
            { code: 'tel', label: 'Telugu (తెలుగు)' },
            { code: 'ben', label: 'Bengali (বাংলা)' },
            { code: 'ara', label: 'Arabic (العربية)' },
            { code: 'chi_sim', label: 'Chinese Simplified (中文)' },
            { code: 'jpn', label: 'Japanese (日本語)' },
            { code: 'kor', label: 'Korean (한국어)' },
            { code: 'rus', label: 'Russian (Русский)' },
            { code: 'spa', label: 'Spanish (Español)' },
            { code: 'fra', label: 'French (Français)' },
            { code: 'deu', label: 'German (Deutsch)' },
            { code: 'por', label: 'Portuguese (Português)' },
            { code: 'ita', label: 'Italian (Italiano)' },
        ];

        /* Downscale very large images so OCR doesn't crawl. */
        function prepOcrImage(dataUrl) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    const MAX = 2400;
                    const s = Math.min(1, MAX / Math.max(img.width, img.height));
                    if (s >= 1) { resolve(dataUrl); return; }
                    try {
                        const c = document.createElement('canvas');
                        c.width = Math.round(img.width * s);
                        c.height = Math.round(img.height * s);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        resolve(c.toDataURL('image/png'));
                    } catch { resolve(dataUrl); }
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        function OcrPanel({ onClose, addToast }) {
            const { compact: mobile, panelRef } = usePanelLayout();
            const online = useOnline();

            const [imgSrc, setImgSrc] = useState('');
            const [imgName, setImgName] = useState('');
            const [lang, setLang] = useState('eng');
            const [busy, setBusy] = useState(false);
            const [progress, setProgress] = useState(0);
            const [status, setStatus] = useState('');
            const [text, setText] = useState('');
            const [error, setError] = useState('');
            const [confidence, setConfidence] = useState(null);
            const [copied, setCopied] = useState(false);
            const [dragOver, setDragOver] = useState(false);

            const fileRef = useRef();
            const loggerRef = useRef(() => { });
            const workerCache = useRef({});

            useEffect(() => {
                return () => {
                    try {
                        Object.values(workerCache.current).forEach(w => {
                            try { w.terminate(); } catch { }
                        });
                    } catch { }
                    workerCache.current = {};
                };
            }, []);

            async function getWorker(langCode) {
                if (workerCache.current[langCode]) return workerCache.current[langCode];
                const w = await Tesseract.createWorker(langCode, 1, {
                    logger: m => loggerRef.current(m)
                });
                workerCache.current[langCode] = w;
                return w;
            }

            function pickFile(f) {
                if (!f) return;
                if (!f.type.startsWith('image/')) { addToast('Please pick an image file', 'error'); return; }
                const r = new FileReader();
                r.onload = e => {
                    setImgSrc(e.target.result);
                    setImgName(f.name || 'image');
                    setText(''); setError(''); setConfidence(null);
                };
                r.readAsDataURL(f);
            }

            function onPaste(e) {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const it of items) {
                    if (it.type.startsWith('image/')) {
                        e.preventDefault();
                        pickFile(it.getAsFile());
                        return;
                    }
                }
            }

            async function run() {
                if (!imgSrc) { addToast('Load an image first', 'error'); return; }
                if (typeof Tesseract === 'undefined') {
                    setError('OCR engine not loaded. Connect to the internet once so it can be cached, then reload.');
                    return;
                }
                setBusy(true); setError(''); setText(''); setProgress(0);
                setStatus('preparing'); setConfidence(null);

                loggerRef.current = m => {
                    if (m && m.status) setStatus(String(m.status));
                    if (m && typeof m.progress === 'number') setProgress(m.progress);
                };

                try {
                    const prepared = await prepOcrImage(imgSrc);
                    const worker = await getWorker(lang);
                    const { data } = await worker.recognize(prepared);
                    const out = (data && data.text) ? data.text : '';
                    setText(out);
                    setConfidence(data && typeof data.confidence === 'number' ? data.confidence : null);
                    if (!out.trim()) addToast('No readable text found in that image');
                    else addToast('OCR complete ✓', 'success');
                } catch (e) {
                    console.error('[OCR]', e);
                    setError('OCR failed: ' + ((e && e.message) || e));
                }
                setBusy(false); setStatus('');
                setProgress(1);
            }

            function copyText() {
                if (!text) return;
                try {
                    navigator.clipboard.writeText(text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1600);
                } catch {
                    const ta = document.createElement('textarea');
                    ta.value = text; document.body.appendChild(ta);
                    ta.select(); document.execCommand('copy');
                    document.body.removeChild(ta);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 1600);
                }
            }

            function downloadTxt() {
                if (!text) return;

            function insertToScratch() {

            const pct = Math.round(progress * 100);

            return (
                <FloatingPanel title="Image → Text" icon="🔎" onClose={onClose}

                    {/* toolbar */}
                    <div style={{

                        {imgSrc && (

                                <Icon name="X" size="1em" /> Clear
                            </button>
                        )}

                        <div style={{ marginLeft: 'auto', display: 'flex', gap: 4, alignItems: 'center', flexWrap: 'wrap' }}>
                            {confidence !== null && (
                                <span style={{
                                    fontSize: 10, padding: '3px 9px', borderRadius: 12, fontWeight: 700,
                                    background: confidence > 80 ? 'var(--green-dim)' : confidence > 60 ? 'var(--amber-dim)' : 'var(--red-dim)',
                                    color: confidence > 80 ? 'var(--green)' : confidence > 60 ? 'var(--amber)' : 'var(--red)',
                                    border: '1px solid ' + (confidence > 80 ? 'rgba(62,207,142,.3)' : confidence > 60 ? 'rgba(247,195,90,.3)' : 'rgba(247,111,111,.3)')
                                }}>
                                    {Math.round(confidence)}% confidence
                                </span>
                            )}
                        </div>
                    </div>

                    {!online && (
                        <div style={{ padding: '8px 12px', flexShrink: 0 }}>
                            <div className="offline-note">
                                <span><Icon name="WifiOff" size="1em" /></span>
                                <span>
                                    Offline. OCR engine + language data need one online load first. After that they're cached.
                                </span>
                            </div>
                        </div>
                    )}

                    {busy && (
                        <div style={{ padding: '10px 14px', flexShrink: 0 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11, color: 'var(--text3)', marginBottom: 4 }}>

                    {/* body */}
                    <div
                        className="panel-body"
                        onPaste={onPaste}
                        style={{
                            flex: 1, display: 'flex',
                            flexDirection: mobile ? 'column' : 'row',
                            minHeight: 0, overflow: 'hidden'
                        }}>
                        {/* LEFT — image */}
                        <div style={{
                            flex: mobile ? '0 0 auto' : '0 0 42%',
                            display: 'flex', flexDirection: 'column', minHeight: 0,
                            borderRight: mobile ? 'none' : '1px solid var(--border)',

                        }}>
                            <div style={{ padding: '4px 10px', background: 'var(--bg3)', borderBottom: '1px solid var(--border)', fontSize: 10, color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0 }}>
                                <span style={{ fontWeight: 600, color: 'var(--text2)' }}>Image</span>

                            <div style={{ flex: 1, overflow: 'auto', padding: 12, minHeight: mobile ? 140 : 0 }}>
                                {!imgSrc ? (
                                    <div
                                        className={'ocr-drop' + (dragOver ? ' over' : '')}

                                        onDragLeave={() => setDragOver(false)}

                                        </div>

                                        </div>
                                    </div>
                                ) : (
                                    <div className="ocr-img-wrap">
                                        <img src={imgSrc} alt="source" />
                                    </div>
                                )}
                                <input
                                    ref={fileRef}
                                    type="file"
                                    accept="image/*"
                                    style={{ display: 'none' }}
                                    onChange={e => { pickFile(e.target.files && e.target.files[0]); e.target.value = ''; }}
                                />
                            </div>
                        </div>

                        {/* RIGHT — text */}
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                            <div style={{ padding: '4px 10px', background: 'var(--bg3)', borderBottom: '1px solid var(--border)', fontSize: 10, color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0, flexWrap: 'wrap' }}>
                                <span style={{ fontWeight: 600, color: 'var(--text2)' }}>Extracted text</span>
                                <span>{text.length}ch · {text ? text.split('\n').length : 0}ln</span>

                                    <button className="btn" style={{ padding: '3px 10px', fontSize: 11 }}
                                        onClick={copyText} disabled={!text}>
                                        {copied ? <IconLabel text={"✓ Copied"} /> : <IconLabel text={"📋 Copy"} />}
                                    </button>
                                    <button className="btn" style={{ padding: '3px 10px', fontSize: 11 }}
                                        onClick={downloadTxt} disabled={!text}>
                                        <Icon name="Download" size="1em" /> .txt

                                    <button className="btn" style={{ padding: '3px 10px', fontSize: 11 }}
                                        onClick={insertToScratch} disabled={!text}>
                                        <Icon name="NotebookPen" size="1em" /> Scratch
                                    </button>
                                </div>
                            </div>
                            <textarea
                                value={text}
                                onChange={e => setText(e.target.value)}
                                placeholder="Recognised text will appear here — you can edit it before copying…"
                                spellCheck={false}
                                style={{
                                    flex: 1, background: 'var(--bg3)', border: 'none', padding: '10px 12px',
                                    fontSize: 13, fontFamily: "'DM Mono',monospace", color: 'var(--text)',
                                    resize: 'none', outline: 'none', lineHeight: 1.7, overflowY: 'auto',
                                    minHeight: mobile ? 160 : 0
                                }}
                            />
                        </div>
                    </div>
                </FloatingPanel>
            );
        }

        /* ══════════════════════════════════════════════════════════
           FILE DIFF — line + word level, green / red highlighting
           ══════════════════════════════════════════════════════════ */

        function tokenizeLine(s) {
            if (!s) return [];
            const out = [];
            const re = /(\s+|\S+)/g;
            let m;
            while ((m = re.exec(s)) !== null) out.push(m[0]);
            return out;
        }

        /* LCS-based word diff for a single pair of changed lines. */
        function wordLevelDiff(a, b) {
            const at = tokenizeLine(a);
            const bt = tokenizeLine(b);
            const m = at.length, n = bt.length;
            if (m === 0 && n === 0) return { aParts: [], bParts: [] };
            if (m * n > 80000) return null;
            const W = n + 1;
            const dp = new Uint32Array((m + 1) * W);
            for (let i = m - 1; i >= 0; i--) {
                for (let j = n - 1; j >= 0; j--) {
                    dp[i * W + j] = at[i] === bt[j]
                        ? dp[(i + 1) * W + (j + 1)] + 1
                        : Math.max(dp[(i + 1) * W + j], dp[i * W + (j + 1)]);
                }
            }
            const aParts = [], bParts = [];
            let i = 0, j = 0;
            while (i < m && j < n) {
                if (at[i] === bt[j]) {
                    aParts.push({ t: 'same', text: at[i] });
                    bParts.push({ t: 'same', text: bt[j] });
                    i++; j++;
                } else if (dp[(i + 1) * W + j] >= dp[i * W + (j + 1)]) {
                    aParts.push({ t: 'del', text: at[i] }); i++;
                } else {
                    bParts.push({ t: 'add', text: bt[j] }); j++;
                }
            }
            while (i < m) aParts.push({ t: 'del', text: at[i++] });
            while (j < n) bParts.push({ t: 'add', text: bt[j++] });
            return { aParts, bParts };
        }

        /* Build a row-per-line diff. type: same | add | del | mod */
        /* ---------- LCS (accurate, O(m·n)) ---------- */
        function lcsOps(an, bn) {
            const m = an.length, n = bn.length;
            const W = n + 1;
            const dp = new Uint32Array((m + 1) * W);
            for (let i = m - 1; i >= 0; i--) {
                for (let j = n - 1; j >= 0; j--) {
                    dp[i * W + j] = an[i] === bn[j]
                        ? dp[(i + 1) * W + (j + 1)] + 1
                        : Math.max(dp[(i + 1) * W + j], dp[i * W + (j + 1)]);
                }
            }
            const ops = [];
            let i = 0, j = 0;
            while (i < m && j < n) {
                if (an[i] === bn[j]) { ops.push(['same', i, j]); i++; j++; }
                else if (dp[(i + 1) * W + j] >= dp[i * W + (j + 1)]) { ops.push(['del', i, -1]); i++; }
                else { ops.push(['add', -1, j]); j++; }
            }
            while (i < m) { ops.push(['del', i, -1]); i++; }
            while (j < n) { ops.push(['add', -1, j]); j++; }
            return ops;
        }

        /* ---------- Greedy (fallback, ~O((m+n)·log)) ---------- */
        function greedyOps(an, bn) {
            const m = an.length, n = bn.length;
            const indexB = new Map(), indexA = new Map();
            for (let j = 0; j < n; j++) {
                let a = indexB.get(bn[j]); if (!a) { a = []; indexB.set(bn[j], a); } a.push(j);
            }
            for (let i = 0; i < m; i++) {
                let a = indexA.get(an[i]); if (!a) { a = []; indexA.set(an[i], a); } a.push(i);
            }
            const nextIn = (idx, key, from) => {
                const arr = idx.get(key);
                if (!arr) return -1;
                let lo = 0, hi = arr.length;
                while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] < from) lo = mid + 1; else hi = mid; }
                return lo < arr.length ? arr[lo] : -1;
            };

            const ops = [];
            let i = 0, j = 0;
            while (i < m && j < n) {
                if (an[i] === bn[j]) { ops.push(['same', i, j]); i++; j++; continue; }
                const nJ = nextIn(indexB, an[i], j);   // where does an[i] show up next in b?
                const nI = nextIn(indexA, bn[j], i);   // where does bn[j] show up next in a?
                if (nJ !== -1 && (nI === -1 || (nJ - j) <= (nI - i))) {
                    while (j < nJ) { ops.push(['add', -1, j]); j++; }
                } else if (nI !== -1) {
                    while (i < nI) { ops.push(['del', i, -1]); i++; }
                } else {
                    ops.push(['del', i, -1]); i++;
                    ops.push(['add', -1, j]); j++;
                }
            }
            while (i < m) { ops.push(['del', i, -1]); i++; }
            while (j < n) { ops.push(['add', -1, j]); j++; }
            return ops;
        }

        /* ---------- New buildDiffRows ---------- */
        function buildDiffRows(aText, bText, opts) {
            const norm = (s) => {
                let r = s;
                if (opts.ignoreWs) r = r.replace(/\s+/g, ' ').trim();
                if (opts.ignoreCase) r = r.toLowerCase();
                return r;
            };
            const al = aText.split('\n');
            const bl = bText.split('\n');
            const an = al.map(norm);
            const bn = bl.map(norm);
            const m = al.length, n = bl.length;

            // fast path — identical
            if (m === n && an.every((x, i) => x === bn[i])) {
                return al.map((_, i) => ({
                    type: 'same', leftNo: i + 1, rightNo: i + 1,
                    leftText: al[i], rightText: bl[i],
                }));
            }

            // 1. strip common prefix
            let pre = 0;
            while (pre < m && pre < n && an[pre] === bn[pre]) pre++;
            // 2. strip common suffix
            let suf = 0;
            while (suf < m - pre && suf < n - pre && an[m - 1 - suf] === bn[n - 1 - suf]) suf++;

            const midA = an.slice(pre, m - suf);
            const midB = bn.slice(pre, n - suf);
            const midAL = al.slice(pre, m - suf);
            const midBL = bl.slice(pre, n - suf);
            const mm = midA.length, nn = midB.length;

            // pick algorithm on the trimmed middle only
            let ops;
            if (mm === 0 || nn === 0) {
                ops = [];
                for (let k = 0; k < mm; k++) ops.push(['del', k, -1]);
                for (let k = 0; k < nn; k++) ops.push(['add', -1, k]);
            } else if (mm * nn <= 4_000_000) {
                ops = lcsOps(midA, midB);       // accurate
            } else {
                ops = greedyOps(midA, midB);    // fast fallback — never throws
            }

            const rows = [];

            // prefix rows
            for (let k = 0; k < pre; k++) {
                rows.push({
                    type: 'same', leftNo: k + 1, rightNo: k + 1,
                    leftText: al[k], rightText: bl[k],
                });
            }

            // middle rows
            let k = 0;
            while (k < ops.length) {
                const t = ops[k][0];
                if (t === 'same') {
                    const i = ops[k][1], j = ops[k][2];
                    rows.push({
                        type: 'same',
                        leftNo: pre + i + 1, rightNo: pre + j + 1,
                        leftText: midAL[i], rightText: midBL[j],
                    });
                    k++;
                } else if (t === 'del') {
                    const dels = [];
                    while (k < ops.length && ops[k][0] === 'del') { dels.push(ops[k][1]); k++; }
                    const adds = [];
                    while (k < ops.length && ops[k][0] === 'add') { adds.push(ops[k][2]); k++; }
                    const pairs = Math.min(dels.length, adds.length);
                    for (let p = 0; p < pairs; p++) {
                        const lt = midAL[dels[p]];
                        const rt = midBL[adds[p]];
                        const wd = wordLevelDiff(lt, rt);
                        rows.push({
                            type: 'mod',
                            leftNo: pre + dels[p] + 1, rightNo: pre + adds[p] + 1,
                            leftText: lt, rightText: rt,
                            leftParts: wd ? wd.aParts : null,
                            rightParts: wd ? wd.bParts : null,
                        });
                    }
                    for (let p = pairs; p < dels.length; p++) {
                        rows.push({
                            type: 'del', leftNo: pre + dels[p] + 1, rightNo: null,
                            leftText: midAL[dels[p]], rightText: '',
                        });
                    }
                    for (let p = pairs; p < adds.length; p++) {
                        rows.push({
                            type: 'add', leftNo: null, rightNo: pre + adds[p] + 1,
                            leftText: '', rightText: midBL[adds[p]],
                        });
                    }
                } else {
                    const adds = [];
                    while (k < ops.length && ops[k][0] === 'add') { adds.push(ops[k][2]); k++; }
                    for (const ai of adds) {
                        rows.push({
                            type: 'add', leftNo: null, rightNo: pre + ai + 1,
                            leftText: '', rightText: midBL[ai],
                        });
                    }
                }
            }

            // suffix rows
            for (let s = 0; s < suf; s++) {
                rows.push({
                    type: 'same',
                    leftNo: m - suf + s + 1, rightNo: n - suf + s + 1,
                    leftText: al[m - suf + s], rightText: bl[n - suf + s],
                });
            }

            return rows;
        }

        function diffRowsToText(rows) {
            const out = [];
            rows.forEach(r => {
                if (r.type === 'same') out.push('  ' + r.leftText);
                else if (r.type === 'del') out.push('- ' + r.leftText);
                else if (r.type === 'add') out.push('+ ' + r.rightText);
                else { out.push('- ' + r.leftText); out.push('+ ' + r.rightText); }
            });
            return out.join('\n');
        }

        function renderDiffParts(parts, side) {
            if (!parts) return null;
            return parts.map((p, i) => {
                if (p.t === 'same') return <span key={i}>{p.text}</span>;
                if (side === 'left' && p.t === 'del') {
                    return <span key={i} className="diff-mark-del">{p.text}</span>;
                }
                if (side === 'right' && p.t === 'add') {
                    return <span key={i} className="diff-mark-add">{p.text}</span>;
                }
                return null;
            });
        }

        function DiffPanel({ onClose, addToast }) {
            const { compact: isMob, panelRef } = usePanelLayout();
            const [left, setLeft] = useState(() => loadLS('daily_diff_left', ''));
            const [right, setRight] = useState(() => loadLS('daily_diff_right', ''));
            const [leftName, setLeftName] = useState('Original');
            const [rightName, setRightName] = useState('Modified');
            const [ignoreCase, setIgnoreCase] = useState(false);
            const [ignoreWs, setIgnoreWs] = useState(false);
            const [mode, setMode] = useState(isMob ? 'unified' : 'split');
            const [mTab, setMTab] = useState('diff'); // mobile only: 'left' | 'right' | 'diff'
            const [showInputs, setShowInputs] = useState(true);

            const [rows, setRows] = useState(null);
            const [stats, setStats] = useState({ added: 0, removed: 0, same: 0, mod: 0 });
            const [busy, setBusy] = useState(false);
            const [err, setErr] = useState('');

            const timerRef = useRef(null);
            const leftFileRef = useRef();
            const rightFileRef = useRef();
            const scrollRef = useRef(null);
            const [changeIdx, setChangeIdx] = useState(-1);

            useEffect(() => { saveLS('daily_diff_left', left); }, [left]);
            useEffect(() => { saveLS('daily_diff_right', right); }, [right]);

            useEffect(() => {
                if (!left && !right) { setRows(null); setErr(''); return; }
                clearTimeout(timerRef.current);
                setBusy(true);
                timerRef.current = setTimeout(() => {
                    try {
                        const r = buildDiffRows(left, right, { ignoreCase, ignoreWs });
                        let added = 0, removed = 0, same = 0, mod = 0;
                        r.forEach(x => {
                            if (x.type === 'add') added++;
                            else if (x.type === 'del') removed++;
                            else if (x.type === 'mod') { mod++; added++; removed++; }
                            else same++;
                        });
                        setRows(r);
                        setStats({ added, removed, same, mod });
                        setErr('');
                    } catch (e) {
                        setErr(e.message || String(e));
                        setRows(null);
                    }
                    setBusy(false);
                }, 240);
                return () => clearTimeout(timerRef.current);
            }, [left, right, ignoreCase, ignoreWs]);

            /* ── change list + visual row map ── */
            const changeRows = useMemo(() => {
                if (!rows) return [];
                return rows.map((r, i) => r.type !== 'same' ? i : -1).filter(i => i !== -1);
            }, [rows]);

            const visualInfo = useMemo(() => {
                if (!rows || rows.length === 0) return { positions: [], total: 0 };
                const unified = isMob || mode !== 'split';
                const positions = new Array(rows.length);
                let v = 0;
                for (let i = 0; i < rows.length; i++) {
                    positions[i] = v;
                    v += (unified && rows[i].type === 'mod') ? 2 : 1;
                }
                return { positions, total: v };
            }, [rows, mode, isMob]);

            useEffect(() => {
                setChangeIdx(changeRows.length > 0 ? 0 : -1);
            }, [changeRows.length]);

            const gotoChange = useCallback((idx) => {
                if (changeRows.length === 0) return;
                const len = changeRows.length;
                const clamped = ((idx % len) + len) % len;
                setChangeIdx(clamped);
                if (isMob) setMTab('diff');
                setTimeout(() => {
                    const rowIdx = changeRows[clamped];
                    const el = scrollRef.current &&
                        scrollRef.current.querySelector('[data-row-idx="' + rowIdx + '"]');
                    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 40);
            }, [changeRows, isMob]);

            /* keyboard: F7 / Shift+F7 */
            useEffect(() => {
                function onKey(e) {
                    const tag = e.target.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA' || e.target.isContentEditable) return;
                    if (e.key === 'F7' && !e.shiftKey) { e.preventDefault(); gotoChange(changeIdx + 1); }
                    else if (e.key === 'F7' && e.shiftKey) { e.preventDefault(); gotoChange(changeIdx - 1); }
                }
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [changeIdx, gotoChange]);

            function readFile(f, setter, setName) {
                if (!f) return;
                const r = new FileReader();
                r.onload = e => { setter(String(e.target.result || '')); setName(f.name || 'file'); };
                r.readAsText(f);
            }

            function swap() {
                setLeft(right); setRight(left);
                setLeftName(rightName); setRightName(leftName);
            }

            function copyDiff() {
                if (!rows) return;
                try { navigator.clipboard.writeText(diffRowsToText(rows)); addToast('Unified diff copied ✓', 'success'); }
                catch { addToast('Copy failed', 'error'); }
            }

            function copyAsJson() {
                if (!rows) return;
                const payload = {
                    generatedAt: new Date().toISOString(),
                    stats: { added: stats.added, removed: stats.removed, unchanged: stats.same, modified: stats.mod },
                    changes: rows.filter(r => r.type !== 'same').map(r => ({
                        type: r.type,
                        leftLine: r.leftNo, rightLine: r.rightNo,
                        left: r.leftText, right: r.rightText,
                    })),
                };
                try { navigator.clipboard.writeText(JSON.stringify(payload, null, 2)); addToast('JSON copied ✓', 'success'); }
                catch { addToast('Copy failed', 'error'); }
            }

            /* ── ROW RENDERERS ── */
            const renderSplit = () => (
                <div className="diff-scroll">
                    {rows.map((r, i) => {
                        const isChange = r.type !== 'same';
                        const isActive = isChange && changeIdx >= 0 && changeRows[changeIdx] === i;
                        return (
                            <div className={'diff-row' + (isActive ? ' diff-active' : '')}
                                key={i}
                                {...(isChange ? { 'data-row-idx': i } : {})}>
                                <div className="diff-num">{r.leftNo || ''}</div>
                                <div className={'diff-cell' + (r.type === 'del' || r.type === 'mod' ? ' del' : r.type === 'add' ? ' empty' : '')}>
                                    {r.type === 'add' ? '' : (r.leftParts ? renderDiffParts(r.leftParts, 'left') : r.leftText)}
                                </div>
                                <div className="diff-num">{r.rightNo || ''}</div>
                                <div className={'diff-cell' + (r.type === 'add' || r.type === 'mod' ? ' add' : r.type === 'del' ? ' empty' : '')}>
                                    {r.type === 'del' ? '' : (r.rightParts ? renderDiffParts(r.rightParts, 'right') : r.rightText)}
                                </div>
                            </div>
                        );
                    })}
                </div>
            );

            const renderUnified = () => (
                <div className="diff-scroll">
                    {rows.map((r, i) => {
                        const isChange = r.type !== 'same';
                        const isActive = isChange && changeIdx >= 0 && changeRows[changeIdx] === i;
                        const activeCls = isActive ? ' diff-active' : '';
                        const rowAttr = isChange ? { 'data-row-idx': i } : {};
                        return (
                            <React.Fragment key={i}>
                                {(r.type === 'del' || r.type === 'mod') && (
                                    <div className={'diff-row' + activeCls} {...rowAttr}>
                                        <div className="diff-num">{r.leftNo}</div>
                                        <div className="diff-mid del">−</div>
                                        <div className="diff-cell del">
                                            {r.leftParts ? renderDiffParts(r.leftParts, 'left') : r.leftText}
                                        </div>
                                    </div>
                                )}
                                {(r.type === 'add' || r.type === 'mod') && (
                                    <div className={'diff-row' + activeCls} {...rowAttr}>
                                        <div className="diff-num">{r.rightNo}</div>
                                        <div className="diff-mid add">+</div>
                                        <div className="diff-cell add">
                                            {r.rightParts ? renderDiffParts(r.rightParts, 'right') : r.rightText}
                                        </div>
                                    </div>
                                )}
                                {r.type === 'same' && (
                                    <div className="diff-row">
                                        <div className="diff-num">{r.leftNo}</div>
                                        <div className="diff-mid" />
                                        <div className="diff-cell">{r.leftText}</div>
                                    </div>
                                )}
                            </React.Fragment>
                        );
                    })}
                </div>
            );

            /* ── EMPTY / ERROR STATES ── */
            const emptyState = (
                <div style={{
                    display: 'flex', flexDirection: 'column', alignItems: 'center',
                    justifyContent: 'center', height: '100%', padding: 28,
                    color: 'var(--text3)', textAlign: 'center', gap: 8
                }}>
                    <div style={{ fontSize: 42, opacity: .35 }}><Icon name="Files" size="1em" /></div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: 'var(--text2)' }}>
                        Paste or upload two versions
                    </div>
                    <div style={{ fontSize: 12, lineHeight: 1.7, maxWidth: 340 }}>
                        Added lines are shown in <b style={{ color: 'var(--green)' }}>green</b>, removed lines in{' '}
                        <b style={{ color: 'var(--red)' }}>red</b> <Icon name="Minus" size="1em" /> changed lines are highlighted word-by-word.
                    </div>
                </div>
            );

            const errorState = (
                <div style={{ padding: 16 }}>
                    <div style={{
                        background: 'var(--red-dim)', border: '1px solid rgba(247,111,111,.3)',
                        borderRadius: 10, padding: '12px 16px', color: 'var(--red)',
                        fontSize: 12, lineHeight: 1.6
                    }}>
                        <b>Diff failed</b><br />{err}
                    </div>
                </div>
            );

            /* ── SHARED SUB-UI ── */
            const leftEditor = (
                <div style={{ display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1 }}>
                    <div style={{
                        padding: '4px 10px', background: 'var(--bg3)',
                        borderBottom: '1px solid var(--border)', fontSize: 10,
                        color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 6,
                        flexShrink: 0, flexWrap: 'wrap'
                    }}>
                        <span style={{ width: 8, height: 8, borderRadius: 2, background: 'var(--red)', flexShrink: 0 }} />
                        <span style={{ fontWeight: 600, color: 'var(--text2)' }}>Original</span>
                        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 140 }}>
                            {leftName}
                        </span>
                        <span style={{ marginLeft: 'auto' }}>{left.length}ch</span>
                        <button className="btn" style={{ padding: '2px 8px', fontSize: 10 }}
                            onClick={() => leftFileRef.current && leftFileRef.current.click()}>
                            <Icon name="FolderOpen" size="1em" /> Upload
                        </button>
                        <button className="btn" style={{ padding: '2px 8px', fontSize: 10, color: 'var(--red)' }}
                            onClick={() => { setLeft(''); setLeftName('Original'); }}>
                            Clear
                        </button>
                    </div>
                    <textarea
                        value={left}
                        onChange={e => setLeft(e.target.value)}
                        placeholder="Paste the original / first version here…"
                        spellCheck={false}
                        style={{
                            flex: 1, minHeight: 0, background: 'var(--bg3)', border: 'none',
                            padding: '10px 12px', fontSize: 12,
                            fontFamily: "'DM Mono',monospace", color: 'var(--text)',
                            resize: 'none', outline: 'none', lineHeight: 1.7, overflowY: 'auto'
                        }} />
                </div>
            );

            const rightEditor = (
                <div style={{ display: 'flex', flexDirection: 'column', minHeight: 0, flex: 1 }}>
                    <div style={{
                        padding: '4px 10px', background: 'var(--bg3)',
                        borderBottom: '1px solid var(--border)', fontSize: 10,
                        color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 6,
                        flexShrink: 0, flexWrap: 'wrap'
                    }}>
                        <span style={{ width: 8, height: 8, borderRadius: 2, background: 'var(--green)', flexShrink: 0 }} />
                        <span style={{ fontWeight: 600, color: 'var(--text2)' }}>Modified</span>
                        <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: 140 }}>
                            {rightName}
                        </span>
                        <span style={{ marginLeft: 'auto' }}>{right.length}ch</span>
                        <button className="btn" style={{ padding: '2px 8px', fontSize: 10 }}
                            onClick={() => rightFileRef.current && rightFileRef.current.click()}>
                            <Icon name="FolderOpen" size="1em" /> Upload
                        </button>
                        <button className="btn" style={{ padding: '2px 8px', fontSize: 10, color: 'var(--red)' }}
                            onClick={() => { setRight(''); setRightName('Modified'); }}>
                            Clear
                        </button>
                    </div>
                    <textarea
                        value={right}
                        onChange={e => setRight(e.target.value)}
                        placeholder="Paste the modified / second version here…"
                        spellCheck={false}
                        style={{
                            flex: 1, minHeight: 0, background: 'var(--bg3)', border: 'none',
                            padding: '10px 12px', fontSize: 12,
                            fontFamily: "'DM Mono',monospace", color: 'var(--text)',
                            resize: 'none', outline: 'none', lineHeight: 1.7, overflowY: 'auto'
                        }} />
                </div>
            );

            const diffView = (
                <div style={{
                    flex: 1, minHeight: 0, display: 'flex',
                    background: 'var(--bg3)', position: 'relative'
                }}>
                    <div ref={scrollRef} style={{ flex: 1, minHeight: 0, overflow: 'auto', position: 'relative' }}>
                        {busy && (
                            <div style={{
                                position: 'absolute', top: 8, right: 12, fontSize: 10,
                                color: 'var(--blue)', fontWeight: 600, zIndex: 3,
                                background: 'var(--bg2)', padding: '2px 8px', borderRadius: 8,
                                border: '1px solid var(--border)'
                            }}>
                                computing…
                            </div>
                        )}
                        {err ? errorState
                            : !rows ? emptyState
                                : rows.length === 0 ? emptyState
                                    : (mode === 'split' && !isMob ? renderSplit() : renderUnified())}
                    </div>

                    {/* ── right-hand change gutter ── */}
                    {rows && rows.length > 0 && changeRows.length > 0 && (
                        <div
                            className="diff-minimap"
                            title="Click to jump to a change"
                            onClick={e => {
                                const rect = e.currentTarget.getBoundingClientRect();
                                const pct = (e.clientY - rect.top) / rect.height;
                                const targetV = pct * visualInfo.total;
                                let best = 0, bestDist = Infinity;
                                changeRows.forEach((ri, ci) => {
                                    const d = Math.abs(visualInfo.positions[ri] - targetV);
                                    if (d < bestDist) { bestDist = d; best = ci; }
                                });
                                gotoChange(best);
                            }}>
                            {changeRows.map((rowIdx, ci) => {
                                const row = rows[rowIdx];
                                const topPct = (visualInfo.positions[rowIdx] / visualInfo.total) * 100;
                                const span = (isMob || mode !== 'split') && row.type === 'mod' ? 2 : 1;
                                const hPct = Math.max(0.2, (span / visualInfo.total) * 100);
                                const isActive = changeIdx === ci;
                                return (
                                    <div key={ci}
                                        className={'diff-minimap-mark ' +
                                            (row.type === 'add' ? 'add' : row.type === 'del' ? 'del' : 'mod')}

                                            top: topPct + '%',
                                            height: hPct + '%',

                                            padding: '5px 12px', fontSize: 11, border: 'none', cursor: 'pointer',
                                            fontWeight: 600,
                                            background: mTab === id ? 'var(--blue)' : 'transparent',
                                            color: mTab === id ? '#fff' : 'var(--text3)', whiteSpace: 'nowrap'
                                        }}><IconLabel text={lbl} /></button>
                                ))}
                            </>
                        )}
                    </div>

                    {!isMob && (
                        <label style={{
                            display: 'flex', alignItems: 'center', gap: 4, fontSize: 11,
                            color: 'var(--text2)', cursor: 'pointer', userSelect: 'none'
                        }}>

                                onChange={e => setIgnoreCase(e.target.checked)}
                                style={{ accentColor: 'var(--blue)' }} />
                            Aa
                        </label>
                    )}
                    {!isMob && (
                        <label style={{
                            display: 'flex', alignItems: 'center', gap: 4, fontSize: 11,
                            color: 'var(--text2)', cursor: 'pointer', userSelect: 'none'
                        }}>
                            <input type="checkbox" checked={ignoreWs}
                                onChange={e => setIgnoreWs(e.target.checked)}
                                style={{ accentColor: 'var(--blue)' }} />
                            whitespace
                        </label>
                    )}

                    {!isMob && (
                        <button className="btn" style={{ padding: '4px 11px', fontSize: 11 }}
                            onClick={() => setShowInputs(v => !v)}>
                            {showInputs ? <IconLabel text={"▲ Hide inputs"} /> : <IconLabel text={"▼ Show inputs"} />}
                        </button>
                    )}

                    {/* ── change navigation ── */}
                    <div style={{
                        display: 'flex', alignItems: 'center',
                        background: 'var(--bg3)', border: '1px solid var(--border)',
                        borderRadius: 7, overflow: 'hidden', flexShrink: 0
                    }}>
                        <button
                            onClick={() => gotoChange(changeIdx - 1)}
                            disabled={changeRows.length === 0}
                            title="Previous change (Shift+F7)"
                            style={{
                                padding: '4px 9px', fontSize: 11, border: 'none', cursor: 'pointer',
                                background: 'transparent', color: 'var(--text2)', fontWeight: 700,
                                opacity: changeRows.length === 0 ? 0.4 : 1
                            }} aria-label="Previous change (Shift+F7)"><Icon name="ChevronUp" size="1em" /></button>
                        <span style={{
                            fontSize: 11, color: 'var(--text3)', minWidth: 44, textAlign: 'center',
                            fontFamily: "'DM Mono',monospace", padding: '0 4px',
                            borderLeft: '1px solid var(--border)', borderRight: '1px solid var(--border)'
                        }}>
                            {changeRows.length === 0 ? '0 / 0' : `${changeIdx + 1} / ${changeRows.length}`}
                        </span>
                        <button
                            onClick={() => gotoChange(changeIdx + 1)}
                            disabled={changeRows.length === 0}
                            title="Next change (F7)"
                            style={{
                                padding: '4px 9px', fontSize: 11, border: 'none', cursor: 'pointer',
                                background: 'transparent', color: 'var(--text2)', fontWeight: 700,
                                opacity: changeRows.length === 0 ? 0.4 : 1
                            }} aria-label="Next change (F7)"><Icon name="ChevronDown" size="1em" /></button>
                    </div>

                    <button className="btn" style={{ padding: '4px 11px', fontSize: 11 }} onClick={swap}>
                        <Icon name="ArrowDownUp" size="1em" /> Swap
                    </button>

                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 5, alignItems: 'center', flexWrap: 'wrap' }}>
                        <span style={{
                            fontSize: 11, fontWeight: 700, padding: '2px 9px', borderRadius: 12,
                            background: 'var(--green-dim)', color: 'var(--green)',
                            border: '1px solid rgba(62,207,142,.3)'
                        }}>+{stats.added}</span>
                        <span style={{
                            fontSize: 11, fontWeight: 700, padding: '2px 9px', borderRadius: 12,
                            background: 'var(--red-dim)', color: 'var(--red)',
                            border: '1px solid rgba(247,111,111,.3)'
                        }}>−{stats.removed}</span>
                        <span style={{
                            fontSize: 11, fontWeight: 600, padding: '2px 9px', borderRadius: 12,
                            background: 'var(--bg3)', color: 'var(--text3)',
                            border: '1px solid var(--border)'
                        }}>={stats.same}</span>
                        <button className="btn" style={{ padding: '4px 11px', fontSize: 11 }}
                            onClick={copyDiff} disabled={!rows}>
                            <Icon name="Clipboard" size="1em" /> Unified
                        </button>
                        <button className="btn" style={{ padding: '4px 11px', fontSize: 11 }}
                            onClick={copyAsJson} disabled={!rows}>
                            <Icon name="Braces" /> JSON
                        </button>
                    </div>
                </div>
            );

            return (
                <FloatingPanel title="Diff Checker" icon="⚖️" onClose={onClose}
                    initW={1140} initH={700} storageKey="diff" panelRef={panelRef}>

                    {/* hidden file inputs */}
                    <input ref={leftFileRef} type="file" accept=".txt,.md,.json,.js,.jsx,.ts,.tsx,.css,.html,.xml,.csv,.log,.yml,.yaml,.py,.java,.c,.cpp,.h,.go,.rb,.php,.sql,text/*"
                        style={{ display: 'none' }}
                        onChange={e => { readFile(e.target.files && e.target.files[0], setLeft, setLeftName); e.target.value = ''; }} />
                    <input ref={rightFileRef} type="file" accept=".txt,.md,.json,.js,.jsx,.ts,.tsx,.css,.html,.xml,.csv,.log,.yml,.yaml,.py,.java,.c,.cpp,.h,.go,.rb,.php,.sql,text/*"

                        onChange={e => { readFile(e.target.files && e.target.files[0], setRight, setRightName); e.target.value = ''; }} />

                    {toolbar}

                    {/* ── MOBILE LAYOUT ── */}
                    {isMob ? (

                            {mTab === 'left' && (
                                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                                    {leftEditor}

                                    {rightEditor}
                                </div>
                            )}
                            {mTab === 'diff' && (
                                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                                    {diffView}
                                </div>
                            )}
                        </div>
                    ) : (
                        /* ── DESKTOP LAYOUT ── */
                        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                            {showInputs && (
                                <div style={{
                                    display: 'grid', gridTemplateColumns: '1fr 1fr',
                                    height: 'min(200px, 35%)', flexShrink: 0,
                                    borderBottom: '1px solid var(--border)'

                                        display: 'flex', flexDirection: 'column', minHeight: 0,

                                    <div style={{ display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                                        {rightEditor}

                            {diffView}

        }

            { id: 'tour', key: 'h', label: 'Replay Tour', icon: 'CircleHelp', body: 'Replay this walkthrough whenever you need a refresher. It explains features without creating cards, changing your board or opening external services.' },
            { id: 'shortcuts', key: '?', label: 'Shortcuts', icon: 'Keyboard', body: 'Open the complete shortcut guide or tap a feature there to launch it. Letter shortcuts work from the board, not while typing or editing a dialog. Escape closes tools; arrow keys navigate this tour.' },
        ];

        function useGuideFocus(ref) {
            useEffect(() => {
                const previous = document.activeElement;
                const panel = ref.current;
                panel?.focus();
                function trap(e) {
                    if (e.key !== 'Tab' || !panel) return;
                    const buttons = [...panel.querySelectorAll('button:not(:disabled), input, [tabindex="0"]')];
                    const first = buttons[0], last = buttons[buttons.length - 1];
                    if (!first) { e.preventDefault(); return; }
                    if (e.shiftKey && (document.activeElement === first || document.activeElement === panel)) {
                        e.preventDefault(); last.focus();
                    } else if (!e.shiftKey && (document.activeElement === last || document.activeElement === panel)) {
                        e.preventDefault(); first.focus();
                    }
                }
                panel?.addEventListener('keydown', trap);
                return () => {
                    panel?.removeEventListener('keydown', trap);
                    if (previous?.isConnected) previous.focus();
                };
            }, []);
        }

        function ShortcutsPanel({ onClose, onAction }) {
            const panelRef = useRef(null);
            useGuideFocus(panelRef);
            const rows = [
                ['Esc', 'Close tools / dialogs'],
                ['Drag card', 'Move / reorder'],
                ['Drag grip', 'Reorder column'],
                ['$x^2$', 'Inline math'],
                ['$$…$$', 'Block math'],
                ['Ctrl+M', 'Insert inline math'],
                ['Ctrl+Shift+M', 'Insert block math'],
                ['☐ checkbox', 'Click in preview to toggle'],
                ['Swipe', 'Scroll between columns (mobile)']
            ];
            return (
                <div className="sc-overlay" onClick={e => { if (e.target === e.currentTarget) onClose() }}>
                    <div className="sc-box" ref={panelRef} tabIndex={-1} role="dialog" aria-modal="true"
                        aria-label="Shortcuts" style={{ maxHeight: 'calc(var(--viewport-height, 100vh) - 32px)', overflowY: 'auto' }}>
                        <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 14 }}><Icon name="Keyboard" size="1em" /> Shortcuts</div>
                        <p style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 12 }}>
                            Press a key from the board, or tap a feature below. Shortcuts are paused while typing or editing a dialog.
                        </p>
                        {APP_FEATURES.map(feature => <button key={feature.id} className="sc-row"
                            onClick={() => { onClose(); onAction(feature.id); }}
                            style={{ width: '100%', background: 'none', border: 'none', borderBottom: '1px solid var(--border)',
                                color: 'var(--text)', cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit' }}>
                            <span style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                                <Icon name={feature.icon} size={14} />{feature.label}
                            </span><span className="kbd">{feature.key.toUpperCase()}</span>
                        </button>)}
                        {rows.map(([k, v]) => <div key={k} className="sc-row"><span>{v}</span><span className="kbd">{k}</span>
                        </div>)}
