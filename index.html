                                                        {evt.repeat && evt.repeat !== 'none' && <span style={{ marginLeft: 4 }} title="Repeating event"><Icon name="Repeat" /></span>}
                                                    </div>
                                                </div>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {/* Storage info for TM tab */}
                        {tab === 'timemachine' && (
                            <div style={{ padding: '0 12px 12px' }}>
                                <div style={{ padding: '8px 10px', background: 'var(--bg3)', borderRadius: 8, border: '1px solid var(--border)' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text3)', marginBottom: 4 }}>
                                        <span>Storage: {usage.kb} KB</span>
                                        <span>{usage.count} snapshots</span>
                                    </div>
                                    <div style={{ height: 4, background: 'var(--bg4)', borderRadius: 2, overflow: 'hidden' }}>
                                        <div style={{
                                            height: '100%',
                                            width: Math.min(100, (usage.kb / 5120) * 100) + '%',
                                            background: usage.kb > 4000 ? 'var(--red)' : usage.kb > 2500 ? 'var(--amber)' : 'var(--green)',
                                            borderRadius: 2
                                        }} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Day detail — bottom */}
                    <div className="cal-m-day">
                        <div className="cal-m-dayhdr">
                            <span style={{ fontSize: 20 }}><Icon name="CalendarDays" size="1em" /></span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                                <div className="cal-m-daytitle">{fmtDate(selectedDate)}</div>
                                <div className="cal-m-daysub">
                                    {tab === 'events'
                                        ? `${dayEvents.length} event${dayEvents.length !== 1 ? 's' : ''}`
                                        : `${daySnaps.length} snapshot${daySnaps.length !== 1 ? 's' : ''}`}
                                    {selectedDate === todayStr() && (
                                        <span className="cal-today-badge">TODAY</span>
                                    )}
                                </div>
                            </div>
                            {tab === 'events' && (
                                <button className="btn primary" style={{ fontSize: 11, padding: '6px 14px', flexShrink: 0 }}
                                    onClick={onCreateEvent}>
                                    + Add
                                </button>
                            )}
                        </div>

                        <div className="cal-m-list">
                            {/* EVENTS */}
                            {tab === 'events' && (
                                <>
                                    {dayEvents.length === 0 && (
                                        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text3)' }}>
                                            <div style={{ fontSize: 44, marginBottom: 12, opacity: .3 }}><Icon name="Inbox" size="1em" /></div>
                                            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6, color: 'var(--text2)' }}>
                                                No events on this day
                                            </div>
                                            <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 16, lineHeight: 1.6 }}>
                                                Tap below to add an event <Icon name="Minus" size="1em" /> you'll get a browser notification when it's time.
                                            </div>
                                            <button className="btn primary" style={{ fontSize: 13, padding: '8px 20px' }}
                                                onClick={onCreateEvent}>
                                                + Add Event
                                            </button>
                                        </div>
                                    )}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                        {dayEvents.map(evt => {
                                            const isToday2 = selectedDate === todayStr();
                                            const evtTs = new Date(selectedDate + 'T' + (evt.time || '00:00')).getTime();
                                            const isPast = isToday2 && evtTs < Date.now();
                                            const isNow = isToday2 && evtTs <= Date.now() && evtTs + 3600000 > Date.now();
                                            return (
                                                <div key={evt.id}
                                                    onClick={() => onEditEvent(evt)}
                                                    style={{
                                                        background: 'var(--bg3)', border: '1px solid var(--border)',
                                                        borderRadius: 12, padding: '12px 14px', cursor: 'pointer',
                                                        borderLeft: `4px solid ${evt.color || 'var(--blue)'}`,
                                                        opacity: isPast ? 0.6 : 1,
                                                        boxShadow: isNow ? `0 0 0 2px ${evt.color || 'var(--blue)'}44` : 'none',
                                                    }}>
                                                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, flexWrap: 'wrap' }}>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 3 }}>
                                                                <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)' }}>
                                                                    {evt.title}
                                                                </span>
                                                                {isNow && (
                                                                    <span style={{
                                                                        fontSize: 9, padding: '1px 7px', borderRadius: 10,
                                                                        background: evt.color + '33', color: evt.color || 'var(--blue)',
                                                                        fontWeight: 700, border: `1px solid ${evt.color || 'var(--blue)'}55`,
                                                                    }}>
                                                                        NOW
                                                                    </span>
                                                                )}
                                                                {isPast && (
                                                                    <span style={{
                                                                        fontSize: 9, padding: '1px 7px', borderRadius: 10,
                                                                        background: 'var(--bg4)', color: 'var(--text3)', fontWeight: 600
                                                                    }}>
                                                                        Past
                                                                    </span>
                                                                )}
                                                                {evt.repeat && evt.repeat !== 'none' && (
                                                                    <span style={{ fontSize: 10, color: 'var(--text3)' }}><Icon name="Repeat" /> {evt.repeat}</span>
                                                                )}
                                                            </div>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                                                                {evt.time && (
                                                                    <span style={{
                                                                        fontSize: 12, color: 'var(--text2)', fontWeight: 500,
                                                                        display: 'flex', alignItems: 'center', gap: 4
                                                                    }}>
                                                                        <Icon name="Clock" size={11} />
                                                                        {fmtTime(evt.time)}{evt.endTime && ' → ' + fmtTime(evt.endTime)}
                                                                    </span>
                                                                )}
                                                                {evt.notifyBefore > 0 && (
                                                                    <span style={{ fontSize: 11, color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 3 }}>
                                                                        <Icon name="Bell" size={11} />
                                                                        {evt.notifyBefore < 60 ? evt.notifyBefore + 'min' : evt.notifyBefore / 60 + 'hr'} before
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {evt.notes && (
                                                                <div style={{
                                                                    marginTop: 7, fontSize: 12, color: 'var(--text3)',
                                                                    lineHeight: 1.5, borderTop: '1px solid var(--border)', paddingTop: 7
                                                                }}>
                                                                    {evt.notes}
                                                                </div>
                                                            )}
                                                        </div>
                                                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4, flexShrink: 0 }}>
                                                            <div style={{ width: 10, height: 10, borderRadius: 3, background: evt.color || 'var(--blue)' }} />
                                                            <span style={{ fontSize: 10, color: 'var(--text3)' }}>Edit <Icon name="ArrowRight" size="1em" /></span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}

                            {/* TIME MACHINE */}
                            {tab === 'timemachine' && (
                                <>
                                    {daySnaps.length === 0 && (
                                        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text3)' }}>
                                            <div style={{ fontSize: 44, marginBottom: 12, opacity: .3 }}><Icon name="Inbox" size="1em" /></div>
                                            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6, color: 'var(--text2)' }}>
                                                No snapshots for this date
                                            </div>
                                            <div style={{ fontSize: 12, lineHeight: 1.6, maxWidth: 300, margin: '0 auto' }}>
                                                Snapshots are saved automatically when you change cards.<br />
                                                Select a date with a <span style={{ color: 'var(--green)', fontWeight: 700 }}>● dot</span> to view history.
                                            </div>
                                            <button className="btn" style={{ marginTop: 16 }} onClick={goToday}>Go to Today</button>
                                        </div>
                                    )}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                                        {daySnaps.map((snap, idx) => {
                                            const t = new Date(snap.ts);
                                            const timeStr = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                            const cardCount = Object.keys(snap.cards || {}).reduce((a, k) => a + (snap.cards[k] || []).length, 0);
                                            const prevSnap = daySnaps[idx - 1];
                                            const diff = prevSnap ? getSnapshotDiff(prevSnap, snap) : null;
                                            const isLatest = idx === daySnaps.length - 1;
                                            const isEarliest = idx === 0;
                                            const triggerLabel = {
                                                'manual': 'Manual', 'card_added': 'Card added', 'card_deleted': 'Card deleted',
                                                'card_moved': 'Card moved', 'card_edited': 'Card edited',
                                                'col_added': 'Col added', 'col_deleted': 'Col deleted',
                                                'col_renamed': 'Col renamed', 'auto': 'Auto',
                                            };
                                            return (
                                                <div key={snap.id}
                                                    onClick={() => onViewSnap(snap)}
                                                    style={{
                                                        background: 'var(--bg3)', border: '1px solid var(--border)',
                                                        borderRadius: 10, padding: '10px 12px', cursor: 'pointer'
                                                    }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                                                        <div style={{
                                                            background: isEarliest ? 'var(--green-dim)' : isLatest ? 'var(--blue-dim)' : 'var(--bg4)',
                                                            color: isEarliest ? 'var(--green)' : isLatest ? 'var(--blue)' : 'var(--text2)',
                                                            border: `1px solid ${isEarliest ? 'rgba(62,207,142,.3)' : isLatest ? 'rgba(79,142,247,.3)' : 'var(--border)'}`,
                                                            borderRadius: 8, padding: '3px 10px', fontSize: 12, fontWeight: 700,
                                                            fontFamily: "'DM Mono',monospace", flexShrink: 0
                                                        }}>
                                                            {timeStr}
                                                        </div>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexWrap: 'wrap' }}>
                                                                <span style={{ fontSize: 12, color: 'var(--text2)' }}>
                                                                    {(snap.cols || []).length} cols · {cardCount} cards
                                                                </span>
                                                                <span style={{
                                                                    fontSize: 9, padding: '1px 6px', borderRadius: 8,
                                                                    background: 'var(--bg4)', color: 'var(--text3)',
                                                                    textTransform: 'uppercase', letterSpacing: .3
                                                                }}>
                                                                    {triggerLabel[snap.trigger] || snap.trigger}
                                                                </span>
                                                                {isLatest && <span style={{ fontSize: 9, padding: '1px 6px', borderRadius: 8, background: 'var(--blue-dim)', color: 'var(--blue)', fontWeight: 700 }}>Latest</span>}
                                                                {isEarliest && daySnaps.length > 1 && <span style={{ fontSize: 9, padding: '1px 6px', borderRadius: 8, background: 'var(--green-dim)', color: 'var(--green)', fontWeight: 700 }}>Earliest</span>}
                                                            </div>
                                                            {diff && (diff.added > 0 || diff.removed > 0 || diff.moved > 0) && (
                                                                <div style={{ display: 'flex', gap: 8, marginTop: 3 }}>
                                                                    {diff.added > 0 && <span style={{ fontSize: 10, color: 'var(--green)' }}>+{diff.added}</span>}
                                                                    {diff.removed > 0 && <span style={{ fontSize: 10, color: 'var(--red)' }}>−{diff.removed}</span>}
                                                                    {diff.moved > 0 && <span style={{ fontSize: 10, color: 'var(--amber)' }}><Icon name="ArrowRight" size="1em" />{diff.moved}</span>}
                                                                </div>
                                                            )}
                                                        </div>
                                                        <span style={{ fontSize: 11, color: 'var(--blue)', fontWeight: 600, flexShrink: 0 }}>View <Icon name="ArrowRight" size="1em" /></span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        /* ── CALENDAR PANEL — Time Machine + Events (responsive) ── */
        function CalendarPanel({ onClose, addToast, initialTab = 'events' }) {
            const confirm = useConfirm();
            const { compact: isMobile, panelRef } = usePanelLayout(740);
            const nowD = new Date();
            const [tab, setTab] = useState(initialTab);
            useEffect(() => setTab(initialTab), [initialTab]);
            const [calYear, setCalYear] = useState(nowD.getFullYear());
            const [calMonth, setCalMonth] = useState(nowD.getMonth());
            const [selectedDate, setSelectedDate] = useState(() => {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            });
            const [viewingSnap, setViewingSnap] = useState(null);
            const [snapshots, setSnapshots] = useState(() => loadSnapshots());
            const [events, setEvents] = useState(() => loadEvents());
            const [editingEvt, setEditingEvt] = useState(null);
            const [showEvtModal, setShowEvtModal] = useState(false);

            function todayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
            function fmtDate(ds) {
                const d = new Date(ds + 'T00:00');
                return d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }
            function fmtTime(t) {
                if (!t) return '';
                const [h, m] = t.split(':');
                const hr = parseInt(h);
                return (hr % 12 || 12) + ':' + m + (hr < 12 ? 'am' : 'pm');
            }

            function prevMonth() { if (calMonth === 0) { setCalMonth(11); setCalYear(y => y - 1); } else setCalMonth(m => m - 1); }
            function nextMonth() { if (calMonth === 11) { setCalMonth(0); setCalYear(y => y + 1); } else setCalMonth(m => m + 1); }
            function goToday() { const ds = todayStr(); setCalYear(new Date().getFullYear()); setCalMonth(new Date().getMonth()); setSelectedDate(ds); }

            // expose for mobile upcoming click
            useEffect(() => {
                window.__calSetYM = (y, m) => { setCalYear(y); setCalMonth(m); };
                return () => { delete window.__calSetYM; };
            }, []);

            const snapshotDateSet = useMemo(() => new Set(snapshots.map(s => s.date)), [snapshots]);
            function hasSnapDot(ds) { return snapshotDateSet.has(ds); }
            function hasEventDot(ds) { return events.some(e => isEventOnDate(e, ds)); }
            function getEventDotColor(ds) {
                const evts = events.filter(e => isEventOnDate(e, ds));
                return evts[0]?.color || 'var(--blue)';
            }
            function hasDots(ds) {
                if (tab === 'timemachine') return hasSnapDot(ds) || hasEventDot(ds);
                return hasEventDot(ds) || hasSnapDot(ds);
            }
            function getDotColor(ds) {
                if (tab === 'timemachine') return hasSnapDot(ds) ? 'var(--green)' : getEventDotColor(ds);
                return hasEventDot(ds) ? getEventDotColor(ds) : 'var(--green)';
            }

            const daySnaps = useMemo(() => snapshots.filter(s => s.date === selectedDate).sort((a, b) => a.ts - b.ts), [snapshots, selectedDate]);
            const dayEvents = useMemo(() => {
                return events.filter(e => isEventOnDate(e, selectedDate)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            }, [events, selectedDate]);

            const usage = useMemo(() => getStorageUsage(), [snapshots]);
            const oldest = useMemo(() => snapshots.length ? snapshots[snapshots.length - 1] : null, [snapshots]);
            const snapshotDates = useMemo(() => [...snapshotDateSet].sort((a, b) => b.localeCompare(a)), [snapshotDateSet]);

            function handleExport() { exportSnapshots(); addToast('History exported ✓', 'success'); }
            async function handleImport() {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
                inp.onchange = async e => {
                    const f = e.target.files[0]; if (!f) return;
                    try { const count = await importSnapshots(f); setSnapshots(loadSnapshots()); addToast(`Imported ${count} snapshots ✓`, 'success'); }
                    catch (err) { addToast('Import failed: ' + err.message, 'error'); }
                }; inp.click();
            }
            async function handleClearOld() {
                const ok = await confirm({
                    title: 'Clear old snapshots?',
                    message: 'Snapshots older than 30 days will be permanently deleted from this device.',
                    confirmText: 'Clear',
                    icon: '🗑️',
                });
                if (!ok) return;
                const cutoff = Date.now() - 30 * 864e5;
                saveSnapshots(snapshots.filter(s => s.ts > cutoff));
                setSnapshots(loadSnapshots()); addToast('Cleared', 'success');
            }

            function saveEvent(evt) {
                const existing = loadEvents();
                const idx = existing.findIndex(e => e.id === evt.id);
                if (idx !== -1) existing[idx] = evt;
                else existing.push(evt);
                saveEvents(existing);
                setEvents(loadEvents());
                setShowEvtModal(false);
                setEditingEvt(null);
                addToast(idx !== -1 ? 'Event updated ✓' : 'Event created ✓', 'success');
                ensureNotificationPermission();
            }
            function deleteEvent(id) {
                const updated = loadEvents().filter(e => e.id !== id);
                saveEvents(updated); setEvents(updated);
                setShowEvtModal(false); setEditingEvt(null);
                addToast('Event deleted');
            }

            const upcoming = useMemo(() => {
                const now = Date.now();
                const all = loadEvents();
                const result = [];
                for (let i = 0; i < 14; i++) {
                    const d = new Date(now + i * 864e5);
                    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                    all.forEach(evt => {
                        if (!isEventOnDate(evt, ds)) return;
                        const evtTs = new Date(ds + 'T' + (evt.time || '00:00')).getTime();
                        if (i === 0 && evtTs < now) return;
                        result.push({ ...evt, onDate: ds, evtTs });
                    });
                }
                return result.sort((a, b) => a.evtTs - b.evtTs).slice(0, 20);
            }, [events]);

            if (viewingSnap) {
                return <SnapshotBoard snap={viewingSnap} onClose={() => setViewingSnap(null)} />;
            }

            return (
                <>
                    <FloatingPanel title="Calendar" icon="📅" onClose={onClose}
                        initW={900} initH={620} storageKey="cal" panelRef={panelRef}>

                        {isMobile ? (
                            <CalendarMobile
                                tab={tab} setTab={setTab}
                                calYear={calYear} calMonth={calMonth}
                                prevMonth={prevMonth} nextMonth={nextMonth} goToday={goToday}
                                selectedDate={selectedDate} setSelectedDate={setSelectedDate}
                                hasDots={hasDots} getDotColor={getDotColor}
                                dayEvents={dayEvents} daySnaps={daySnaps}
                                onCreateEvent={() => { setEditingEvt({ date: selectedDate }); setShowEvtModal(true); }}
                                onEditEvent={evt => { setEditingEvt(evt); setShowEvtModal(true); }}
                                onViewSnap={snap => setViewingSnap(snap)}
                                addToast={addToast}
                                fmtDate={fmtDate} fmtTime={fmtTime} todayStr={todayStr}
                                usage={usage} snapshotDates={snapshotDates}
                                handleExport={handleExport} handleImport={handleImport} handleClearOld={handleClearOld}
                                upcoming={upcoming}
                            />
                        ) : (
                            <>
                                {/* Tab bar */}
                                <div style={{
                                    display: 'flex', borderBottom: '1px solid var(--border)',
                                    background: 'var(--bg3)', flexShrink: 0
                                }}>
                                    {[['events', '📅 Events'], ['timemachine', '📸 Time Machine']].map(([id, lbl]) => (
                                        <button key={id} onClick={() => setTab(id)}
                                            style={{
                                                padding: '9px 18px', fontSize: 12, fontWeight: 600, border: 'none',
                                                cursor: 'pointer', background: 'transparent',
                                                color: tab === id ? 'var(--blue)' : 'var(--text3)',
                                                borderBottom: tab === id ? '2px solid var(--blue)' : '2px solid transparent',
                                                transition: 'all .12s', whiteSpace: 'nowrap'
                                            }}>
                                            <IconLabel text={lbl} />
                                        </button>
                                    ))}
                                </div>

                                <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>
                                    {/* LEFT */}
                                    <div style={{
                                        flex: '0 0 300px', borderRight: '1px solid var(--border)',
                                        display: 'flex', flexDirection: 'column', minHeight: 0, overflowY: 'auto',
                                        background: 'var(--bg2)'
                                    }}>
                                        <div style={{ padding: '10px 12px 0' }}>
                                            <MonthGrid
                                                year={calYear} month={calMonth}
                                                onPrev={prevMonth} onNext={nextMonth}
                                                onDateClick={ds => setSelectedDate(ds)}
                                                selectedDate={selectedDate}
                                                hasDots={hasDots}
                                                getDotColor={getDotColor}
                                            />
                                        </div>

                                        <div style={{ padding: '8px 12px', display: 'flex', gap: 5 }}>
                                            <button className="btn" style={{ fontSize: 11, padding: '4px 10px', flex: 1 }}
                                                onClick={goToday}>Today</button>
                                            {tab === 'events' && (
                                                <button className="btn primary" style={{ fontSize: 11, padding: '4px 12px', flex: 2 }}
                                                    onClick={() => { setEditingEvt({ date: selectedDate }); setShowEvtModal(true); }}>
                                                    + Add Event
                                                </button>
                                            )}
                                        </div>

                                        {tab === 'events' && upcoming.length > 0 && (
                                            <div style={{ padding: '0 12px 10px' }}>
                                                <div style={{
                                                    fontSize: 9, color: 'var(--text3)', textTransform: 'uppercase',
                                                    letterSpacing: .5, marginBottom: 5, fontWeight: 700
                                                }}>
                                                    Upcoming ({upcoming.length})
                                                </div>
                                                <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                                                    {upcoming.slice(0, 8).map((evt, i) => {
                                                        const isToday2 = evt.onDate === todayStr();
                                                        const d = new Date(evt.onDate + 'T00:00');
                                                        const label = isToday2 ? 'Today' : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
                                                        return (
                                                            <button key={evt.id + evt.onDate + i}
                                                                onClick={() => {
                                                                    setSelectedDate(evt.onDate);
                                                                    const dd = new Date(evt.onDate + 'T00:00');
                                                                    setCalYear(dd.getFullYear()); setCalMonth(dd.getMonth());
                                                                }}
                                                                style={{
                                                                    display: 'flex', alignItems: 'center', gap: 6, padding: '4px 7px',
                                                                    borderRadius: 7, border: '1px solid var(--border)', background: 'var(--bg3)',
                                                                    cursor: 'pointer', textAlign: 'left', width: '100%', transition: '.1s'
                                                                }}
                                                                onMouseEnter={e => e.currentTarget.style.borderColor = 'var(--blue)'}
                                                                onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border)'}>
                                                                <div style={{ width: 8, height: 8, borderRadius: 2, background: evt.color || 'var(--blue)', flexShrink: 0 }} />
                                                                <div style={{ flex: 1, minWidth: 0 }}>
                                                                    <div style={{
                                                                        fontSize: 10, fontWeight: 600, color: 'var(--text)',
                                                                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'
                                                                    }}>
                                                                        {evt.title}
                                                                    </div>
                                                                    <div style={{ fontSize: 9, color: 'var(--text3)' }}>
                                                                        {label} {evt.time && '· ' + fmtTime(evt.time)}
                                                                        {evt.repeat && evt.repeat !== 'none' && <span style={{ marginLeft: 4 }} title="Repeating event"><Icon name="Repeat" /></span>}
                                                                    </div>
                                                                </div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}

        function getSnapshotDiff(prev, current) {
            const prevIds = new Set();
            const currIds = new Set();
            const prevMap = {};
            const currMap = {};
            Object.entries(prev.cards || {}).forEach(([col, arr]) => {
                (arr || []).forEach(c => { prevIds.add(c.id); prevMap[c.id] = col; });
            });
            Object.entries(current.cards || {}).forEach(([col, arr]) => {
                (arr || []).forEach(c => { currIds.add(c.id); currMap[c.id] = col; });
            });
            let added = 0, removed = 0, moved = 0;
            currIds.forEach(id => { if (!prevIds.has(id)) added++; });
            prevIds.forEach(id => { if (!currIds.has(id)) removed++; });
            currIds.forEach(id => {
                if (prevIds.has(id) && prevMap[id] !== currMap[id]) moved++;
            });
            return { added, removed, moved };
        }

        function loadEvents() {
            try { const d = localStorage.getItem('daily_events'); if (!d) return []; return JSON.parse(d); }
            catch { return []; }
        }
        function saveEvents(evts) {
            try { localStorage.setItem('daily_events', JSON.stringify(evts)); }
            catch { }
        }
        function getEventsForDate(dateStr) {
            return loadEvents().filter(e => e.date === dateStr || isEventOnDate(e, dateStr));
        }
        function isEventOnDate(evt, dateStr) {
            if (evt.date === dateStr) return true;
            if (!evt.repeat || evt.repeat === 'none') return false;
            const evtDate = new Date(evt.date + 'T00:00');
            const checkDate = new Date(dateStr + 'T00:00');
            if (checkDate < evtDate) return false;
            if (evt.repeat === 'daily') return true;
            if (evt.repeat === 'weekly') return evtDate.getDay() === checkDate.getDay();
            if (evt.repeat === 'monthly') return evtDate.getDate() === checkDate.getDate();
            return false;
        }
        function getUpcomingEvents(limitMins = 1440) {
            const now = Date.now();
            const limit = now + limitMins * 60 * 1000;
            const events = loadEvents();
            const upcoming = [];
            for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                const d = new Date(now + dayOffset * 864e5);
                const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                events.forEach(evt => {
                    if (!isEventOnDate(evt, ds)) return;
                    const evtTs = new Date(ds + 'T' + (evt.time || '00:00')).getTime();
                    const notifyTs = evtTs - (evt.notifyBefore || 0) * 60 * 1000;
                    if (notifyTs >= now && notifyTs <= limit) {
                        upcoming.push({ ...evt, fireAt: notifyTs, eventAt: evtTs, onDate: ds });
                    }
                });
            }
            return upcoming.sort((a, b) => a.fireAt - b.fireAt);
        }

        function CollaborationCursors({ boardRef, cursors, participants, sessionId }) {
            const [layoutTick, setLayoutTick] = useState(0);
            useEffect(() => {
                const update = () => setLayoutTick(tick => tick + 1);
                const board = boardRef.current;
                const observer = new ResizeObserver(update);
                if (board) observer.observe(board);
                document.addEventListener('scroll', update, true);
                window.addEventListener('resize', update);
                const expiry = setInterval(update, 1000);
                return () => {
                    observer.disconnect();
                    document.removeEventListener('scroll', update, true);
                    window.removeEventListener('resize', update);
                    clearInterval(expiry);
                };
            }, []);
            const board = boardRef.current;
            if (!board) return null;
            const wrap = board.parentElement.getBoundingClientRect();
            const anchors = [...board.querySelectorAll('[data-cursor-anchor]')];
            const colors = ['#2563eb', '#b45309', '#be185d', '#047857', '#7c3aed', '#c2410c'];
            return <div className="collaboration-cursors" aria-hidden="true" data-layout-tick={layoutTick}>
                {participants.filter(person => person.id !== sessionId).map(person => {
                    const remote = cursors[person.id];
                    if (!remote?.cursor || Date.now() - remote.updatedAt > 15000) return null;
                    const { anchor, x, y } = remote.cursor;
                    const target = anchor === 'board' ? board : anchors.find(element => element.dataset.cursorAnchor === anchor);
                    if (!target) return null;
                    const rect = target.getBoundingClientRect();
                    const px = rect.left + rect.width * x, py = rect.top + rect.height * y;
                    const clip = target.closest('.col-body')?.getBoundingClientRect() || wrap;
                    if (px < wrap.left || px > wrap.right || py < wrap.top || py > wrap.bottom
                        || py < clip.top || py > clip.bottom) return null;
                    const hash = [...person.id].reduce((value, char) => (value * 31 + char.charCodeAt(0)) >>> 0, 0);
                    const color = colors[hash % colors.length];
                    return <div key={person.id} className="collaboration-cursor" data-participant-id={person.id}
                        style={{ transform: `translate(${px - wrap.left}px, ${py - wrap.top}px)`, color }}>
                        <svg width="18" height="23" viewBox="0 0 18 23" style={{ display: 'block' }}>
                            <path d="M1 1L16 14L9 15L6 21Z" fill="currentColor" stroke="#fff" strokeWidth="1.5" />
                        </svg>
                        <span style={{ background: color }}>{person.name}{person.host ? ' (Host)' : ''}</span>
                    </div>;
                })}
            </div>;
        }

        /* ── APP ── */
        function App() {
            const [serverUrl, setServerUrl] = useState(() => new URLSearchParams(location.search).get('syncServer')
                || window.DAILY_RELAY
                || (/^https?:$/.test(location.protocol) && ['localhost', '127.0.0.1'].includes(location.hostname)
                    ? location.origin.replace(/^http/, 'ws') : 'wss://daily-2.onrender.com'));
            const [displayName, setDisplayName] = useState(() => loadLS('daily_collab_name', 'Guest'));
            const relayRef = useRef(serverUrl);
            useEffect(() => { relayRef.current = serverUrl; }, [serverUrl]);
            const [collaborative, setCollaborative] = useState(false);
            const [participants, setParticipants] = useState([]);
            const [remoteCursors, setRemoteCursors] = useState({});
            const boardRef = useRef(null);
            const [followHost, setFollowHost] = useState(false);
            const collaborationRef = useRef(false);
            const hostRef = useRef(false);
            const joiningRef = useRef(false);
            const personalRecords = useRef(null);

            const savedLocal = loadData();
            const hasLocal = !!(savedLocal
                && Array.isArray(savedLocal.cols)
                && savedLocal.cards && typeof savedLocal.cards === 'object');


            // One-time migration of the old save into the op-log (sync metadata)
            (function migrate() {
                const done = localStorage.getItem('daily_oplog_migrated');
                if (done) return;
                if (hasLocal) {
                    SYNC.mutateMany(SYNC.bootstrapOps(savedLocal.cols, savedLocal.cards));
                }
                localStorage.setItem('daily_oplog_migrated', '1');
            })();

            const initial = SYNC.materialize();
            const def = defaultData();
            const startCols = hasLocal ? savedLocal.cols
                : (initial.cols.length ? initial.cols : def.cols);
            const startCards = hasLocal ? savedLocal.cards
                : (initial.cols.length ? initial.cards : def.cards);

            const SESSION_ID = useRef(syncUid());
            const [syncEngine] = useState(() => {
                let records = {};
                try {
                    const cached = JSON.parse(localStorage.getItem('daily_sync_v2') || '{}');
                    if (DailySync.validRecords(cached.records)) records = cached.records;
                } catch { }
                const engine = DailySync.createEngine({ actor: SESSION_ID.current, records, diffChars: Diff.diffChars });
                if (!Object.keys(records).length) engine.capture({ cols: [], cards: {}, scratch: '' }, {
                    cols: startCols, cards: startCards, scratch: loadLS('daily_scratch', '')
                });
                return engine;
            });
            const [cols, setCols] = useState(() => syncEngine.materialize().cols);
            const [cards, setCards] = useState(() => syncEngine.materialize().cards);

            const [now, setNow] = useState(Date.now());

            const TOUR_STEPS = useMemo(() => [

            function persistSync() {

            function captureSyncChanges() {
                const next = { cols: colsRef.current, cards: cardsRef.current, scratch: scratchRef.current };
                if (joiningRef.current && JSON.stringify(next) === JSON.stringify(syncBaseline.current)) return;
                const changed = syncEngine.capture(syncBaseline.current, next);

            function handleIncoming(message) {
                if (message._protocol !== 2 || !message._sync) return;
                if (joiningRef.current && message.initial) {
                    if (!DailySync.validRecords(message._sync.records)) throw new Error('Invalid shared board');
                    captureSyncChanges();
                    const local = syncEngine.getRecords();
                    syncEngine.replace(message._sync.records, true);
                    syncEngine.merge(local);
                    joiningRef.current = false;
                    wsConnected.current = true;
                    setPeerStatus('connected');
                    syncDirty.current = true;
                    applySyncView();
                    broadcastWebSocket(activeRoomRef.current);

                captureSyncChanges();
                const changed = syncEngine.merge(message._sync.records);
                if (message._ack === inFlightMessage.current && message._ack) {
                    syncDirty.current = Object.entries(syncEngine.getRecords()).some(([key, register]) => register.heads.some(version =>
                        version.sequence > (message._sync.records[key]?.clock[version.actor] || 0)));

                if (changed) applySyncView();

            function resolveConflict(conflict, value) {

            function broadcastWebSocket(room) {
                const targetRoom = room || activeRoomRef.current;
                if (joiningRef.current || !wsConnected.current || !wsClient.current || wsClient.current.readyState !== WebSocket.OPEN || !targetRoom) return;
                captureSyncChanges();
                const messageId = syncUid();
                inFlightMessage.current = messageId;
                wsClient.current.send(JSON.stringify({
                    _type: 'sync_state', _protocol: 2, _sync: { records: syncEngine.getRecords() },
                    _messageId: messageId, _sid: SESSION_ID.current
                }));
            }

            function wsConnect(room, relay = relayRef.current) {
                const r = (room || '').trim();
                if (!r) return;
                captureSyncChanges();
                clearTimeout(reconnectTimer.current);
                const generation = ++connectionGeneration.current;
                activeRoomRef.current = r;
                setActiveRoom(r);
                if (typeof navigator !== 'undefined' && navigator.onLine === false) {
                    setPeerStatus('disconnected');
                    addToast('Offline — sync unavailable', 'error');
                    return;
                }
                if (wsClient.current) {
                    wsClient.current.close();
                    wsClient.current = null;
                }
                setPeerStatus('connecting');
                wsConnected.current = false;
                let url;
                try {
                    url = new URL(relay);
                    if (!['http:', 'https:', 'ws:', 'wss:'].includes(url.protocol)) throw new Error('Invalid relay protocol');
                    if (location.protocol === 'https:' && ['ws:', 'http:'].includes(url.protocol)) throw new Error('HTTPS pages require a secure wss:// relay');
                } catch (error) {
                    addToast(error.message || 'Enter a valid WebSocket relay URL.', 'error');
                    setPeerStatus('disconnected');
                    return;
                }
                url.protocol = url.protocol === 'http:' || url.protocol === 'ws:' ? 'ws:' : 'wss:';
                url.searchParams.set('room', r);
                if (collaborationRef.current) {
                    url.searchParams.set('mode', 'collaborate');
                    if (hostRef.current) url.searchParams.set('host', '1');
                }
                joiningRef.current = collaborationRef.current;
                const ws = new WebSocket(url.href);
                wsClient.current = ws;

                ws.onopen = () => {
                    if (generation !== connectionGeneration.current) return;
                    setMyPeerId(SESSION_ID.current);
                    ws.send(JSON.stringify({ _type: 'request_state', _protocol: 2, _sid: SESSION_ID.current,
                        name: displayName, ...(collaborationRef.current && hostRef.current
                            ? { _sync: { records: syncEngine.getRecords() } } : {}) }));
                };

                ws.onmessage = (event) => {
                    if (generation !== connectionGeneration.current) return;
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg._type === 'sync_capabilities' && msg.protocol === 2) {
                            if (collaborationRef.current) {
                                if (!msg.collaborative) {
                                    addToast('Update the relay backend to support shared boards.', 'error');
                                    disconnectRoom();
                                }
                                return;
                            }
                            wsConnected.current = true;
                            reconnectAttempt.current = 0;
                            setPeerStatus('connected');
                            syncDirty.current = true;
                            applySyncView();
                            broadcastWebSocket(r);
                            return;
                        }
                        if (msg._type === 'request_state') {
                            if (wsConnected.current) broadcastWebSocket(r);
                            return;
                        }
                        if (msg._type === 'peers') {
                            setPeerCount(Array.isArray(msg.peers) ? msg.peers.length : 0);
                            setParticipants(Array.isArray(msg.participants) ? msg.participants : []);
                            setRemoteCursors(current => Object.fromEntries(Object.entries(current)
                                .filter(([id]) => msg.peers?.includes(id))));
                            if (msg._protocol !== 2 && !wsConnected.current) {
                                setPeerStatus('unsupported');
                                addToast('Update the sync server to enable conflict-safe syncing.', 'error');
                            }
                            return;
                        }
                        if (msg._type === 'cursor' && collaborationRef.current && typeof msg.id === 'string') {
                            setRemoteCursors(current => ({ ...current,
                                [msg.id]: { cursor: msg.cursor, updatedAt: Date.now() } }));
                            return;
                        }
                        if (msg._type === 'sync_error') {
                            addToast(msg.message, 'error');
                            if (msg.fatal) disconnectRoom();
                            return;
                        }
                        if (msg._protocol === 2 && msg._sync) handleIncoming(msg);
                        else if (msg._cols || msg._cards || msg._scratch !== undefined) {
                            addToast('An older device is connected. Update all devices and the sync server before syncing.', 'error');
                            setPeerStatus('unsupported');
                            wsConnected.current = false;
                        }
                    } catch (e) {
                        console.warn('WS sync error', e);
                        addToast('Could not apply a shared update. Your local history is preserved.', 'error');
                    }
                };

                ws.onerror = (err) => {
                    if (generation !== connectionGeneration.current) return;
                    console.warn('WebSocket error', err);
                    setPeerStatus('disconnected');
                    if (navigator.onLine !== false) addToast('Sync error', 'error');
                };

                ws.onclose = () => {
                    if (generation !== connectionGeneration.current) return;
                    wsConnected.current = false;
                    setPeerStatus('disconnected');
                    setPeerCount(0);
                    setParticipants([]);
                    if (activeRoomRef.current && navigator.onLine !== false) {
                        const delay = Math.min(30000, 1000 * 2 ** Math.min(reconnectAttempt.current++, 5));
                        reconnectTimer.current = setTimeout(() => wsConnect(activeRoomRef.current), delay);
                    }
                };
            }

            function createRoom() {
                const r = 'daily-' + Math.random().toString(36).slice(2, 8);
                setRoomId(r);
                wsConnect(r);
            }

            function joinRoom() {
                if (!roomId.trim()) return;
                wsConnect(roomId);
            }

            function enterSharedBoard(room, host, relay = serverUrl) {
                if (activeRoomRef.current) disconnectRoom();
                captureSyncChanges();
                personalRecords.current = syncEngine.getRecords();
                let records = host ? personalRecords.current : {};
                {
                    try {
                        const cached = JSON.parse(localStorage.getItem('daily_collab_' + room) || '{}');
                        if (DailySync.validRecords(cached.records)) records = cached.records;
                    } catch (error) {
                        console.warn('Shared board cache error', error);
                        addToast('Shared board cache could not be read; loading from the host.', 'error');
                    }
                }
                collaborationRef.current = true;
                relayRef.current = relay;
                setServerUrl(relay);
                hostRef.current = host;
                setCollaborative(true);

                setOpenCard(null);
                setFollowHost(false);
                syncEngine.replace(records, true);
                applySyncView();
                setRoomId(room);
                try {
                    localStorage.setItem('daily_collab_session', JSON.stringify({ room, host, relay }));
                } catch (error) {
                    console.warn('Shared session could not be saved', error);
                    addToast('Could not save the shared session. Keep the invite link to rejoin.', 'error');
                }
                wsConnect(room, relay);

            function hostBoard() {
                enterSharedBoard('board-' + crypto.randomUUID(), true);
            }

            function joinBoard() {
                let room = roomId.trim(), relay = serverUrl;
                if (!room) return;
                if (/^https?:|^file:/.test(room)) {
                    try {
                        const invite = new URL(room);
                        room = invite.searchParams.get('room') || '';
                        relay = invite.searchParams.get('syncServer') || relay;
                        if (!room) throw new Error('Invite link does not include a board ID.');
                    } catch (error) {
                        addToast(error.message, 'error');
                        return;
                    }
                }
                if (room.length > 128) {
                    addToast('Board ID is too long.', 'error');
                    return;

                setServerUrl(relay);
                enterSharedBoard(room, false, relay);
            }

            function disconnectRoom() {
                captureSyncChanges();
                if (syncDirty.current && wsConnected.current) broadcastWebSocket(activeRoomRef.current);
                clearTimeout(broadcastTimer.current);
                broadcastTimer.current = null;
                const wasCollaborative = collaborationRef.current;
                activeRoomRef.current = '';
                joiningRef.current = false;
                connectionGeneration.current++;
                clearTimeout(reconnectTimer.current);
                if (wsClient.current) {
                    wsClient.current.close();
                    wsClient.current = null;
                }
                wsConnected.current = false;
                setActiveRoom('');
                setMyPeerId('');
                setPeerStatus('disconnected');
                setPeerCount(0);
                setParticipants([]);
                setFollowHost(false);
                if (wasCollaborative) {
                    collaborationRef.current = false;
                    hostRef.current = false;
                    setCollaborative(false);
                    localStorage.removeItem('daily_collab_session');
                    setOpenCard(null);
                    syncEngine.replace(personalRecords.current || {}, false);
                    syncDirty.current = true;
                    applySyncView();
                }
                const url = new URL(location.href);
                url.searchParams.delete('room');
                url.searchParams.delete('collaborate');
                history.replaceState(null, '', url.href);
                addToast(wasCollaborative ? 'Left shared board. Personal board restored.' : 'Disconnected from sync');
            }

            /* ── connection awareness ── */
            useEffect(() => {
                const onUp = () => {
                    addToast('Back online ✓ — local data intact', 'success');
                    if (activeRoomRef.current && !wsConnected.current) wsConnect(activeRoomRef.current);

                    window.removeEventListener('online', onUp);
                    window.removeEventListener('offline', onDown);

            useEffect(() => {
                const params = new URLSearchParams(location.search);

                    session = JSON.parse(localStorage.getItem('daily_collab_session') || 'null');

                    console.warn('Shared session could not be read', error);

            const mobile = windowW <= 640;
            const tablet = windowW > 640 && windowW <= 1200;

            const [timers, setTimers] = useState(() => {
                const saved = loadTimers();
                const now = Date.now();
                const updated = {};
                Object.entries(saved).forEach(([id, t]) => {
                    if (t.running && t.endAt) {
                        const remaining = Math.max(0, Math.round((t.endAt - now) / 1000));
                        updated[id] = { ...t, remaining, running: remaining > 0 };
                    } else {
                        updated[id] = t;
                    }
                });
                return updated;
            });
            const [alarms, setAlarms] = useState([]);
            useEffect(() => { saveTimers(timers); }, [timers]);

            useEffect(() => {
                const id = setInterval(() => {
                    setTimers(prev => {
                        const now = Date.now();
                        let changed = false;
                        const next = { ...prev };
                        const newAlarms = [];
                        Object.entries(next).forEach(([cardId, t]) => {
                            if (t.running && t.remaining > 0) {
                                const rem = t.endAt ? Math.max(0, Math.round((t.endAt - now) / 1000)) : t.remaining - 1;
                                if (rem !== t.remaining) {
                                    changed = true;
                                    next[cardId] = { ...t, remaining: rem }; if (rem <= 0) {
                                        next[cardId].running = false; let taskName = 'Task';
                                        Object.values(cards).forEach(arr => {
                                            const c = arr.find(x => x.id === cardId); if (c) taskName = c.task;
                                        });
                                        newAlarms.push({ id: cardId, task: taskName });
                                    }
                                }
                            }
                        });
                        if (newAlarms.length > 0) {
                            playAlarmSound();
                            setAlarms(a => [...a, ...newAlarms]);
                            newAlarms.forEach(na =>
                                showLocalNotification('⏱ Timer Done!', na.task, 'timer-' + na.id)
                            );
                        }
                        return changed ? next : prev;
                    });
                }, 1000);
                return () => clearInterval(id);
            }, [cards]);

            const [dragCardId, setDragCardId] = useState(null);
            const [dragCardFrom, setDragCardFrom] = useState(null);
            const [dragColId, setDragColId] = useState(null);
            const [colDropTarget, setColDropTarget] = useState(null);
            const [openCard, setOpenCard] = useState(null);
            const [openCardCol, setOpenCardCol] = useState(null);
            useEffect(() => { openCardRef.current = openCard; }, [openCard]);
            useEffect(() => {
                if (!collaborative || peerStatus !== 'connected' || wsClient.current?.readyState !== WebSocket.OPEN) return;
                wsClient.current.send(JSON.stringify({ _type: 'presence', _sid: SESSION_ID.current,
                    name: displayName, cardId: openCard?.id || null }));
            }, [collaborative, peerStatus, openCard?.id, displayName]);
            useEffect(() => {
                setRemoteCursors({});
                if (!collaborative || peerStatus !== 'connected') return;
                let pointer = null, pending = null, timer = null;
                const send = () => {
                    timer = null;
                    if (wsClient.current?.readyState === WebSocket.OPEN) {
                        wsClient.current.send(JSON.stringify({ _type: 'cursor', cursor: pending }));
                    }
                };
                const update = () => {
                    const board = boardRef.current;
                    const hit = pointer && document.elementFromPoint(pointer.x, pointer.y);
                    pending = null;
                    if (board && hit && board.contains(hit)) {
                        const anchor = hit.closest('[data-cursor-anchor]') || board;
                        const rect = anchor.getBoundingClientRect();
                        if (rect.width && rect.height) pending = {
                            anchor: anchor.dataset.cursorAnchor || 'board',
                            x: Math.max(0, Math.min(1, (pointer.x - rect.left) / rect.width)),
                            y: Math.max(0, Math.min(1, (pointer.y - rect.top) / rect.height))
                        };
                    }
                    if (!timer) timer = setTimeout(send, 40);
                };
                const move = event => {
                    if (event.pointerType === 'touch') return;
                    pointer = { x: event.clientX, y: event.clientY };
                    update();
                };
                const hide = () => { pointer = null; update(); };
                const leave = event => { if (!event.relatedTarget) hide(); };
                const visibility = () => { if (document.hidden) hide(); };
                document.addEventListener('pointermove', move);
                document.addEventListener('pointerout', leave);
                document.addEventListener('scroll', update, true);
                document.addEventListener('visibilitychange', visibility);
                window.addEventListener('blur', hide);
                window.addEventListener('resize', update);
                const heartbeat = setInterval(update, 5000);
                return () => {
                    clearTimeout(timer);
                    clearInterval(heartbeat);
                    document.removeEventListener('pointermove', move);
                    document.removeEventListener('pointerout', leave);
                    document.removeEventListener('scroll', update, true);
                    document.removeEventListener('visibilitychange', visibility);
                    window.removeEventListener('blur', hide);
                    window.removeEventListener('resize', update);
                    pending = null;
                    send();
                };
            }, [collaborative, peerStatus]);
            useEffect(() => {
                if (!collaborative || !followHost || hostRef.current) return;
                const host = participants.find(person => person.host);
                if (!host) return;
                if (!host.cardId) {
                    setOpenCard(null);
                    return;
                }
                const column = Object.keys(cardsRef.current).find(key => cardsRef.current[key].some(card => card.id === host.cardId));
                if (column) {
                    setOpenCard(cardsRef.current[column].find(card => card.id === host.cardId));
                    setOpenCardCol(column);
                }

                    const current = cardsRef.current || {};

                    Object.keys(next).forEach(colId => {
                        const list = next[colId] || [];
                        const kept = list.filter(card => {
                            // keep anything that isn't scheduled for auto-delete
                            if (!card.expiryDays || !card.doneAt) return true;
                            const days = Math.floor(
                                (Date.now() - new Date(card.doneAt).getTime()) / 864e5
                            );
                            return days < card.expiryDays;
                        });
                        if (kept.length !== list.length) {
                            removed += (list.length - kept.length);
                            next[colId] = kept;
                        }
                    });

                    if (removed > 0) {
                        setCards(next);
                        addToast(
                            `${removed} expired task${removed !== 1 ? 's' : ''} auto-removed`,
                            'success'
                        );

                const firstRun = setTimeout(purgeExpired, 1000);
                const interval = setInterval(purgeExpired, 60000);
