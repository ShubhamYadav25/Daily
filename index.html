                    }
                }, 0);
            }

            function onKD(e) {
                const el = e.target;
                const s = el.selectionStart;
                const ctrl = e.ctrlKey || e.metaKey;
                if (ctrl && !e.shiftKey && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    const h = historyRef.current;
                    if (h.stack[h.idx] !== value) pushHistory(value);
                    if (h.idx > 0) {
                        h.idx--;
                        onChange(h.stack[h.idx]);
                    }
                    return;
                }
                if (ctrl && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
                    e.preventDefault();
                    const h = historyRef.current;
                    if (h.idx < h.stack.length - 1) {
                        h.idx++;
                        onChange(h.stack[h.idx]);
                    }
                    return;
                }
                if (ctrl && !e.shiftKey) {
                    const k = e.key.toLowerCase();
                    if (k === 'b') {
                        e.preventDefault();
                        applyFmt('bold'); return;
                    }
                    if (k === 'i') {
                        e.preventDefault();
                        applyFmt('italic'); return;
                    }
                    if (k === 'k') {
                        e.preventDefault();
                        applyFmt('link'); return;
                    }
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const nv = value.slice(0, s) + '  ' + value.slice(el.selectionEnd);
                    pushHistory(nv);
                    onChange(nv);
                    setTimeout(() => { el.selectionStart = el.selectionEnd = s + 2; }, 0); return;
                }
                if (e.key === 'Enter') {
                    const lineStart = value.lastIndexOf('\n', s - 1) + 1;
                    const line = value.slice(lineStart, s);
                    const um = line.match(/^(\s*)([-*+])\s(.+)/),
                        om = line.match(/^(\s*)(\d+)\.\s(.+)/),
                        cm = line.match(/^(\s*)\[[ x]\]\s(.+)/);
                    if (um) {
                        e.preventDefault();
                        const ins = '\n' + um[1] + um[2] + ' ';
                        const nv = value.slice(0, s) + ins + value.slice(s);
                        pushHistory(nv);
                        onChange(nv);
                        setTimeout(() => { el.selectionStart = el.selectionEnd = s + ins.length; }, 0);
                    } else if (om) {
                        e.preventDefault();
                        const ins = '\n' + om[1] + (parseInt(om[2]) + 1) + '. ';
                        const nv = value.slice(0, s) + ins + value.slice(s);
                        pushHistory(nv);
                        onChange(nv);
                        setTimeout(() => { el.selectionStart = el.selectionEnd = s + ins.length; }, 0);
                    } else if (cm) {
                        e.preventDefault();
                        const ins = '\n' + cm[1] + '[ ] ';
                        const nv = value.slice(0, s) + ins + value.slice(s);
                        pushHistory(nv);
                        onChange(nv);
                        setTimeout(() => { el.selectionStart = el.selectionEnd = s + ins.length; }, 0);
                    }
                }
            }

            function onPaste(e) {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const f = item.getAsFile();
                        if (!f) return;
                        compressImage(f).then(data => {

                                .selectionStart,

                                    .slice(e2);
                            pushHistory(nv);
                            onChange(nv);

            const mobile = isMobile();

                            }} />
                            <div style={{ position: 'relative' }}>

        /* ── INTERACTIVE MD VIEW ── */
        function MdView({ value, onChange, imageSizes, onImageResize }) {
            const ref = useRef();
            useEffect(() => {
                const el = ref.current;
                if (!el) return;

                function onClick(e) {
                    const ti = e.target.closest('[data-toggle-line]'); if (ti) {
                        const li =
                            parseInt(ti.dataset.toggleLine); const lines = value.split('\n'); if (li >= lines
                                .length) return; const ln = lines[li]; if (/^\[ \]\s/.test(ln)) lines[li] = ln
                                    .replace('[ ]', '[x]');
                        else if (/^\[x\]\s/.test(ln)) lines[li] = ln.replace('[x]', '[ ]');
                        onChange(lines.join('\n'));
                    }
                }
                el.addEventListener('click', onClick);
                return () => el.removeEventListener('click', onClick);
            }, [value, onChange]);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                let resizing = null;

                function onDown(e) {
                    const handle = e.target.closest('.resize-handle'); if (!handle) return;
                    e.preventDefault();
                    e.stopPropagation(); const imgId = handle.dataset.imgId; const container = handle
                        .closest('.resizable-img-container'); if (!container) return; const startX = e
                            .clientX; const startW = container.offsetWidth; resizing = {
                                imgId, startX, startW,
                                container
                            };

                    function onMove(ev) {
                        if (!resizing) return; const dx = ev.clientX - resizing.startX;
                        const newW = Math.max(50, resizing.startW + dx);
                        resizing.container.style.width = newW + 'px';
                    }

                    function onUp() {
                        if (resizing) {
                            const finalW = resizing.container.offsetWidth;
                            onImageResize(resizing.imgId, finalW);
                        } resizing = null;
                        window.removeEventListener('mousemove', onMove);
                        window.removeEventListener('mouseup', onUp);
                    }
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                }
                el.addEventListener('mousedown', onDown);
                return () => el.removeEventListener('mousedown', onDown);
            }, [onImageResize]);
            if (!value) return <div style={{
                textAlign: 'center', padding: '32px 0', color: 'var(--text3)',
                fontSize: 13
            }}><div style={{ fontSize: 28, marginBottom: 8 }}>📝</div><div>No notes yet</div></div>;
            return <div ref={ref} className="md-render" dangerouslySetInnerHTML={{
                __html: renderMd(value, true,
                    imageSizes)
            }} />;
        }

        /* ── CARD MODAL ── */
        function CardModal({ card, col, cols, onClose, onSave, onDelete, onMove, now, timers, setTimers, addToast }) {
            const [editing, setEditing] = useState(!card.content);
            const [task, setTask] = useState(card.task);
            const [priority, setPriority] = useState(card.priority || 'None');
            const [content, setContent] = useState(card.content || '');
            const [expiryDays, setExpiryDays] = useState(card.expiryDays ?? null);
            const [color, setColor] = useState(card.color || '');
            const [imageSizes, setImageSizes] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem(
                        'daily_imgsz_' + card.id) || '{}');
                } catch { return {}; }
            });
            const colData = cols.find(c => c.id === col) || cols[0];
            const age = fmtAge(card.createdAt, now);
            const timer = timers[card.id] || null;
            const mobile = isMobile();
            const modalRef = useRef();
            const dragRef = useRef(null);
            const [pos, setPos] = useState(null);

            function handleImageResize(imgId, w) {
                setImageSizes(s => {
                    const n = { ...s, [imgId]: { w } }; try {
                        localStorage.setItem('daily_imgsz_' + card.id, JSON.stringify(n));
                    } catch { } return n;
                });
            }

            function saveCard() {
                onSave({
                    ...card, task, priority, content, expiryDays, color, updatedAt: new Date()
                        .toISOString()
                });
                setEditing(false);
            }

            function setTimer(mins) {
                const endAt = Date.now() + mins * 60 * 1000;
                setTimers(t => {
                    const n = {
                        ...t, [card.id]: {
                            total: mins * 60, remaining: mins * 60, running: false,
                            endAt
                        }
                    };
                    saveTimers(n); return n;
                });
                if (window.Notification && Notification.permission === 'default') Notification.requestPermission();
            }

            function onHdrMouseDown(e) {
                if (e.button !== 0) return;
                if (e.target.closest('button') || e.target.closest('input')) return;
                const el = modalRef.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                if (!pos) setPos({ x: r.left, y: r.top, w: r.width, h: r.height });
                dragRef.current = { ox: e.clientX - r.left, oy: e.clientY - r.top, w: r.width, h: r.height };
                const onMove = ev => {
                    if (!dragRef.current) return;
                    setPos(p => ({
                        ...(p || dragRef.current), x: ev.clientX - dragRef.current.ox, y: ev.clientY -
                            dragRef.current.oy
                    }));
                };
                const onUp = () => {
                    dragRef.current = null;
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                e.preventDefault();
            }

            const eResizeRef = useRef(null);

            function onEResize(e) {
                e.preventDefault();
                e.stopPropagation();
                const el = modalRef.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                if (!pos) setPos({ x: r.left, y: r.top, w: r.width, h: r.height });
                const startX = e.clientX,
                    startW = r.width,
                    startX0 = r.left;
                const onMove = ev => {
                    const dw = ev.clientX - startX;
                    setPos(p => ({ ...(p || { x: startX0, y: r.top, h: r.height }), w: Math.max(380, startW + dw) }));
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = ''; };
            }, []);

            const modalStyle = pos ?
                {
                    position: 'fixed', left: pos.x, top: pos.y, width: pos.w, maxHeight: '90vh', margin: 0,
                    maxWidth: 'none'
                } :
                { position: 'relative', width: '100%', maxWidth: 740, margin: 'auto' };

            return (
                <div className="overlay" style={pos ? { alignItems: 'flex-start' } : {}} onMouseDown={e => {
                    if (e
                        .target === e.currentTarget) onClose()
                }}>
                    <div ref={modalRef} className="modal" style={{ ...modalStyle, overflow: 'visible' }} onClick={e =>
                        e.stopPropagation()}>
                        <div onMouseDown={onEResize} style={{
                            position: 'absolute', top: 12, right: -4, bottom: 12,
                            width: 8, cursor: 'e-resize', zIndex: 10
                        }} />
                        <div className="modal-hdr" style={{ cursor: pos ? 'move' : 'default' }} onMouseDown={
                            onHdrMouseDown}>
                            <div style={{
                                width: 8, height: 8, borderRadius: '50%', background: colData.color,
                                flexShrink: 0
                            }} />
                            {color && <div style={{
                                width: 8, height: 8, borderRadius: '50%', background: color,
                                flexShrink: 0
                            }} />}
                            {editing ? <input className="finput" style={{
                                fontSize: 14, fontWeight: 600, flex: 1,
                                background: 'transparent', border: 'none', padding: 0, minWidth: 0
                            }}
                                value={task} onChange={e => setTask(e.target.value)}
                                placeholder="Task title…" autoFocus /> :
                                <div className="modal-title">{task}</div>}
                            <div style={{
                                display: 'flex', gap: 4, marginLeft: 'auto', alignItems: 'center',
                                flexShrink: 0
                            }}>
                                {!mobile && <span style={{
                                    fontSize: 10, color: 'var(--text3)',
                                    marginRight: 2
                                }}>🕐 {age}</span>}
                                <TimerWidgetInline timer={timer} onSet={setTimer} onClear={() => setTimers(t => {
                                    const n = { ...t };
                                    delete n[card.id];
                                    saveTimers(n); return n;
                                })} onStart={() => setTimers(t => {
                                    const cur =
                                        t[card.id]; if (!cur) return t; const endAt = Date.now() + cur
                                            .remaining * 1000; const n = {
                                                ...t, [card.id]: {
                                                    ...cur,
                                                    running: true, endAt
                                                }
                                            };
                                    saveTimers(n); return n;
                                })} onStop={() => setTimers(t => {
                                    const cur =
                                        t[card.id]; if (!cur) return t; const n = {
                                            ...t, [card.id]: {
                                                ...cur, running: false
                                            }
                                        };
                                    saveTimers(n); return n;
                                })} />
                                {!editing && priority !== 'None' && <span className={`priority p${priority[1]}`}>
                                    {priority}</span>}
                                {!editing && <button className="ibtn" title="Edit" onClick={() => setEditing(true)}
                                    style={{ width: 28, height: 28, border: 'none', fontSize: 13 }}>✏️</button>}
                                <button className="ibtn" title="Delete" onClick={() => {
                                    if (confirm('Delete?'))
                                        onDelete(card.id)
                                }} style={{
                                    width: 28, height: 28, border: 'none',
                                    fontSize: 13, color: 'var(--red)'
                                }}>🗑️</button>
                                {pos && <button className="ibtn" title="Reset position" onClick={() => setPos(null)}
                                    style={{ width: 28, height: 28, border: 'none', fontSize: 12 }}>⊡</button>}
                                <button className="ibtn" title="Close" onClick={onClose} style={{
                                    width: 28,
                                    height: 28, border: 'none', fontSize: 14
                                }}>✕</button>
                            </div>
                        </div>
                        <div className="modal-body" style={{
                            overflowY: 'auto', maxHeight: pos ?
                                'calc(90vh - 100px)' : 'calc(90vh - 110px)'
                        }}>
                            {editing ? (
                                <>
                                    <div className="frow" style={mobile ? { gridTemplateColumns: '1fr 1fr' } :
                                        {}}>
                                        <div><label className="flabel">Priority</label><select className="fselect"
                                            value={priority} onChange={e => setPriority(e.target.value)}>
                                            {PRIORITY_LIST.map(p => <option key={p}>{p}</option>)}</select></div>
                                        <div><label className="flabel">Move to</label><select className="fselect"
                                            value={col} onChange={e => onMove(card.id, col, e.target.value)}>
                                            {cols.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                        </select></div>
                                        {!mobile && <div><label className="flabel">Auto-delete</label><select
                                            className="fselect" value={expiryDays ?? ''} onChange={e =>
                                                setExpiryDays(e.target.value ? Number(e.target
                                                    .value) : null)}><option value=''>Never</option><option
                                                        value='3'>3d</option><option value='7'>7d</option><option
                                                            value='14'>14d</option></select></div>}
                                    </div>
                                    {mobile && <div className="fgroup"><label className="flabel">Auto-delete</label>
                                        <select className="fselect" value={expiryDays ?? ''} onChange={e =>
                                            setExpiryDays(e.target.value ? Number(e.target.value) :
                                                null)}><option value=''>Never</option><option value='3'>3d</option>
                                            <option value='7'>7d</option><option value='14'>14d</option></select>
                                    </div>}
                                    <div className="fgroup"><label className="flabel">Card Color</label><
                                        CardColorPicker color={color} onChange={setColor} /></div>
                                    <div className="fgroup"><label className="flabel">Notes</label><MdEditor
                                        value={content} onChange={setContent} /></div>
                                </>
                            ) : (
                                <MdView value={content} onChange={v => {
                                    setContent(v);
                                    onSave({
                                        ...card, task, priority, content: v, expiryDays, color,
                                        updatedAt: new Date().toISOString()
                                    });
                                }} imageSizes={imageSizes}
                                    onImageResize={handleImageResize} />
                            )}
                        </div>
                        {editing && <div className="modal-foot"><button className="btn" onClick={() => {
                            setEditing(
                                false);
                            setTask(card.task);
                            setContent(card.content);
                            setPriority(card.priority);
                            setColor(card.color || '');
                        }}>Cancel</button><button className="btn primary"
                            onClick={saveCard}>Save</button></div>}
                    </div>
                </div>
            );
        }

        /* ── ADD CARD MODAL ── */
        function AddCardModal({ defaultCol, cols, onClose, onAdd }) {
            const [col, setCol] = useState(defaultCol);
            const [task, setTask] = useState('');
            const [priority, setPriority] = useState('None');
            const [content, setContent] = useState('');
            const [color, setColor] = useState('');

            function add() {
                if (!task.trim()) return;
                onAdd(col, {
                    id: uid(), task: task.trim(), priority, content, color, createdAt: new Date()
                        .toISOString(), expiryDays: null
                });
                onClose();
            }
            const colData = cols.find(c => c.id === col) || cols[0];
            const mobile = isMobile();
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = ''; };
            }, []);
            return (
                <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose() }}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-hdr"><div style={{
                            width: 8, height: 8, borderRadius: '50%',
                            background: colData?.color, flexShrink: 0
                        }} /><div className="modal-title">New Card
                            </div><button className="ibtn" onClick={onClose} style={{
                                width: 28, height: 28,
                                marginLeft: 'auto', border: 'none'
                            }}>✕</button></div>
                        <div className="modal-body">
                            <div className="fgroup"><label className="flabel">Task title</label><input
                                className="finput" value={task} onChange={e => setTask(e.target.value)}
                                placeholder="What needs to be done?" autoFocus onKeyDown={e => e.key ===
                                    'Enter' && add()} /></div>
                            <div style={{
                                display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10,
                                marginBottom: 14
                            }}>
                                <div><label className="flabel">Status</label><select className="fselect" value={
                                    col} onChange={e => setCol(e.target.value)}>{cols.map(c => <option
                                        key={c.id} value={c.id}>{c.label}</option>)}</select></div>
                                <div><label className="flabel">Priority</label><select className="fselect" value={
                                    priority} onChange={e => setPriority(e.target.value)}>{PRIORITY_LIST
                                        .map(p => <option key={p}>{p}</option>)}</select></div>
                            </div>
                            <div className="fgroup"><label className="flabel">Card Color</label><CardColorPicker
                                color={color} onChange={setColor} /></div>
                            {!mobile && <div className="fgroup"><label className="flabel">Notes (optional)</label>
                                <MdEditor value={content} onChange={setContent} /></div>}
                        </div>
                        <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button
                            className="btn primary" onClick={add} disabled={!task.trim()}>Add Card</button></div>
                    </div>
                </div>
            );
        }

        /* ── ADD COL MODAL ── */
        function AddColModal({ onClose, onAdd }) {
            const [label, setLabel] = useState('');
            const [color, setColor] = useState(COL_PALETTE[4]);

            function add() {
                if (!label.trim()) return;
                onAdd({ id: uid(), label: label.trim(), color, locked: false });
                onClose();
            }
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = ''; };
            }, []);
            return (
                <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose() }}>
                    <div className="modal" style={{ maxWidth: 360 }} onClick={e => e.stopPropagation()}>
                        <div className="modal-hdr"><div className="modal-title">New Status Column</div><button
                            className="ibtn" onClick={onClose} style={{
                                width: 28, height: 28,
                                marginLeft: 'auto', border: 'none'
                            }}>✕</button></div>
                        <div className="modal-body">
                            <div className="fgroup"><label className="flabel">Name</label><input className="finput"
                                value={label} onChange={e => setLabel(e.target.value)}
                                placeholder="e.g. Review…" autoFocus onKeyDown={e => e.key === 'Enter' &&
                                    add()} /></div>
                            <div className="fgroup"><label className="flabel">Color</label><div style={{
                                display: 'flex',
                                gap: 7, flexWrap: 'wrap'
                            }}>{COL_PALETTE.map(c => <div key={c} className={
                                `swatch${color === c ? ' sel' : ''}`} style={{ background: c }}
                                onClick={() => setColor(c)} />)}</div></div>
                        </div>
                        <div className="modal-foot"><button className="btn" onClick={onClose}>Cancel</button><button
                            className="btn primary" onClick={add} disabled={!label.trim()}>Create</button></div>

                </div>
            );

        /* ── CARD COMPONENT ── */
        function Card({ card, onOpen, onDragStart, onDragOver, onDropOnCard, now, timer }) {
            const [dragSide, setDragSide] = useState(null);
            const blocker = parseBlocker(card.content);
            const days = Math.floor(((now || Date.now()) - new Date(card.createdAt).getTime()) / 864e5);
            const ac = ageClass(card.createdAt, now);
            const ageText = fmtAge(card.createdAt, now);
            const ageCardClass = days > 6 ? 'aged-old' : days > 2 ? 'aged-stale' : '';
            const timerExpired = timer && timer.remaining <= 0;
            const timerRunning = timer && timer.running && timer.remaining > 0;
            const timerPaused = timer && !timer.running && timer.remaining > 0;
            return (
                <div className={`card ${ageCardClass}${dragSide === 'top' ? ' drag-over-top' : dragSide === 'bottom' ? ' drag-over-bottom' : ''}`}
                    draggable onDragStart={e => {
                        e.dataTransfer.effectAllowed = 'move';
                        onDragStart(card.id);
                    }}
                    onDragOver={e => {
                        e.preventDefault();
                        e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); const side = e
                            .clientY < r.top + r.height / 2 ? 'top' : 'bottom';
                        setDragSide(side);
                        onDragOver(card.id, side === 'top' ? 'before' : 'after');
                    }}
                    onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragSide(null); }}
                    onDrop={e => {
                        e.preventDefault();
                        e.stopPropagation(); const s = dragSide;
                        setDragSide(null);
                        onDropOnCard(card.id, s === 'top' ? 'before' : 'after');
                    }}
                    onDragEnd={() => setDragSide(null)} onClick={() => onOpen(card)}
                    style={{ borderLeft: card.color ? `3px solid ${card.color}` : undefined }}>
                    <div className="card-title">{card.task}</div>
                    <div className="card-meta">
                        {card.priority && card.priority !== 'None' && <span className={`priority p${card.priority[1]}`}>
                            {card.priority}</span>}
                        {card.expiryDays && card.doneAt && (() => {
                            const rem = card.expiryDays - daysDiff(card
                                .doneAt); return <span className={`expiry-badge${rem <= 1 ? ' warn' : ''}`}>🗑 {rem >
                                    0 ? rem + 'd' : 'today'}</span>;
                        })()}
                        {(timerRunning || timerPaused || timerExpired) && <span
                            className={`timer-badge ${timerExpired ? 'expired' : timerRunning ? 'running' : 'paused'}`}>⏱ {fmtSecs(
                                Math.max(0, timer.remaining))}</span>}
                        {card.content && !blocker && <span style={{ fontSize: 10, color: 'var(--text3)' }}>📝</span>}
                        <span className={`card-age ${ac}`}>🕐 {ageText}</span>
                    </div>
                    {blocker && <div className="card-blocker"><div className="blocker-lbl">🚫 BLOCKER</div><div
                        style={{ lineHeight: 1.35 }}>{blocker.slice(0, 120)}{blocker.length > 120 ? '…' :
                            ''}</div></div>}
                </div>
            );
        }

        /* ── COLUMN ── */
        function Column({ colData, cards, allCols, onCardDrop, onCardReorder, onColDragStart, onColDrop, onColDragOver,
            onOpen, onAddCard, onDeleteCol, onToggleLock, onRenameCol, dragCardId, isColDragging, isColDropTarget, now,
            timers }) {
            const [renaming, setRenaming] = useState(false);
            const [renameVal, setRenameVal] = useState(colData.label);
            const blockerCount = cards.filter(c => parseBlocker(c.content)).length;
            useEffect(() => setRenameVal(colData.label), [colData.label]);

            function onColBodyDragOver(e) { e.preventDefault(); if (dragCardId) { } else onColDragOver(colData.id); }

            function onColBodyDrop(e) {
                e.preventDefault(); if (dragCardId) onCardDrop(colData.id);
                else onColDrop(colData.id);
            }

            return (
                <div className={`col${isColDragging ? ' col-dragging' : ''}${isColDropTarget ? ' col-drop-target' : ''}`}
                    style={{ '--col-color': colData.color, borderTopColor: colData.color }}
                    onDragOver={onColBodyDragOver} onDrop={onColBodyDrop}>
                    <div className="col-hdr">
                        <div className={`col-grip${colData.locked ? ' locked' : ''}`} draggable={!colData.locked}
                            onDragStart={e => {
                                if (colData.locked) { e.preventDefault(); return; }
                                e.dataTransfer.effectAllowed = 'move';
                                onColDragStart(colData.id);
                            }}>
                            {colData.locked ?
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    strokeWidth="2.5"><rect x="3" y="11" width="18" height="11" rx="2" /><path
                                        d="M7 11V7a5 5 0 0 1 10 0v4" /></svg> :
                                <svg width="12" height="14" viewBox="0 0 10 14" fill="currentColor"><rect x="1" y="1"
                                    width="3" height="1.5" rx=".5" /><rect x="6" y="1" width="3" height="1.5"
                                        rx=".5" /><rect x="1" y="4" width="3" height="1.5" rx=".5" /><rect x="6" y="4"
                                            width="3" height="1.5" rx=".5" /><rect x="1" y="7" width="3" height="1.5"
                                                rx=".5" /><rect x="6" y="7" width="3" height="1.5" rx=".5" /><rect x="1" y="10"
                                                    width="3" height="1.5" rx=".5" /><rect x="6" y="10" width="3" height="1.5"
                                                        rx=".5" /></svg>}
                        </div>
                        <div className="col-dot" style={{ background: colData.color }} />
                        <div className="col-title-wrap">
                            {renaming ?
                                <input className="col-title-inp" value={renameVal} autoFocus onChange={e =>
                                    setRenameVal(e.target.value)} onKeyDown={e => {
                                        if (e.key === 'Enter') {
                                            onRenameCol(colData.id, renameVal);
                                            setRenaming(false);
                                        } if (e.key === 'Escape')
                                            setRenaming(false);
                                    }} onBlur={() => {
                                        if (renameVal.trim())
                                            onRenameCol(colData.id, renameVal);
                                        setRenaming(false);
                                    }} /> :
                                <div className="col-title" onDoubleClick={() => setRenaming(true)}>{colData
                                    .label}</div>}
                        </div>
                        <span className="col-count" style={{ color: colData.color }}>{cards.length}</span>
                        {blockerCount > 0 && <span className="col-blocker-badge">🚫{blockerCount}</span>}
                        <div className="col-hdr-actions">
                            <button className={`chbtn${colData.locked ? ' lock-on' : ''}`} title={colData.locked ?
                                'Unlock' : 'Lock'} onClick={() => onToggleLock(colData.id)}>
                                {colData.locked ?
                                    <svg width="10" height="11" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18"
                                            height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg> :
                                    <svg width="10" height="11" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" strokeWidth="2.5"><rect x="3" y="11" width="18"
                                            height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 9.9-1" /></svg>}
                            </button>
                            <button className="chbtn" title="Rename" onClick={() => setRenaming(true)}>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    strokeWidth="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path
                                        d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>
                            </button>
                            <button className="chbtn del-col" title="Delete column" onClick={() => onDeleteCol(colData
                                .id)}>
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    strokeWidth="2.5"><polyline points="3 6 5 6 21 6" /><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /><path
                                        d="M10 11v6M14 11v6" /><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" /></svg>
                            </button>
                        </div>
                    </div>
                    <div className="col-body">
                        {cards.length === 0 && <div className="col-empty"><svg width="22" height="22" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" strokeWidth="1.5" opacity=".4"><rect x="2" y="3"
                                width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></svg><span>Drop cards
                                    here</span></div>}
                        {cards.map(c => <Card key={c.id} card={c} now={now} timer={timers[c.id] || null}
                            onOpen={onOpen}
                            onDragStart={id => { onCardDrop._setDrag(id, colData.id); }}
                            onDragOver={(tid, pos) => { }}
                            onDropOnCard={(tid, pos) => {
                                onCardReorder(colData.id, dragCardId || c.id, tid,
                                    pos);
                            }} />)}
                        <button className="col-add-btn" title="Add card" onClick={() => onAddCard(colData.id)}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12"
                                    x2="19" y2="12" /></svg>
                        </button>
                    </div>
                </div>
            );
        }

        /* ── FLOATING PANEL ── */
        function FloatingPanel({ title, icon, onClose, children, initW = 560, initH = 420, initX = null, initY = null,
            storageKey, extraHeaderContent }) {
            const mobile = useIsMobile();
            const defX = initX !== null ? initX : Math.max(20, window.innerWidth - initW - 20);
            const defY = initY !== null ? initY : Math.max(60, window.innerHeight - initH - 80);
            const { sz, setSz, startResize } = useResize(initW, initH, defX, defY);
            const drag = useRef(null);
            const ref = useRef();

            useEffect(() => {
                if (!storageKey) return; try {
                    const saved = JSON.parse(localStorage.getItem(
                        storageKey + '_pos') || 'null'); if (saved) setSz(saved);
                } catch { }
            }, []);
            useEffect(() => {
                if (!storageKey) return; try {
                    localStorage.setItem(storageKey + '_pos', JSON.stringify(
                        sz));
                } catch { }
            }, [sz]);

            function onHdrMouseDown(e) {
                if (e.button !== 0) return;
                if (e.target.closest('button') || e.target.closest('input')) return;
                const el = ref.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                drag.current = { ox: e.clientX - r.left, oy: e.clientY - r.top };
                const onMove = ev => {
                    if (!drag.current) return;
                    setSz(s => ({ ...s, x: ev.clientX - drag.current.ox, y: ev.clientY - drag.current.oy }));
                };
                const onUp = () => {
                    drag.current = null;
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                e.preventDefault();
            }

            if (mobile) return (
                <div ref={ref} className="fp">
                    <div className="fp-hdr">

        /* ── BASE64 CONVERTER ── */
        function Base64Converter({ onClose }) {
            const [input, setInput] = useState('');
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [detectedType, setDetectedType] = useState(null);
            const [fileName, setFileName] = useState('');

            function detectType(str) {
                const s = str.trim();
                if (!s) return null;
                if (s.startsWith('data:')) {
                    const m = s.match(/^data:([^;]+);/);
                    if (m) {
                        const type = m[1];
                        if (type.startsWith('image/')) return 'image';
                        if (type === 'application/pdf') return 'pdf';
                        return 'other';
                    }
                    return 'other';
                }
                try {
                    const decoded = atob(s.replace(/\s/g, ''));
                    if (decoded.length > 4) {
                        const hex = decoded.slice(0, 8).split('').map(c => c.charCodeAt(0).toString(16).padStart(2,
                            '0')).join('');
                        if (hex.startsWith('ffd8ff')) return 'image';
                        if (hex.startsWith('89504e47')) return 'image';
                        if (hex.startsWith('47494638')) return 'image';
                        if (hex.startsWith('52494646')) return 'image';
                        if (hex.startsWith('25504446')) return 'pdf';
                        if (hex.startsWith('424d')) return 'image';
                        if (hex.startsWith('3c737667')) return 'image';
                    }
                } catch { }
                return 'other';
            }

            function convert() {
                const s = input.trim();
                if (!s) {
                    setError('Please paste Base64 or data URL');
                    setResult(null);
                    setDetectedType(null); return;
                }
                try {
                    let dataUrl = s;
                    let type = detectType(s);
                    if (!s.startsWith('data:')) {
                        const t = detectType(s);
                        if (t === 'image') {
                            dataUrl = 'data:image/png;base64,' + s.replace(/\s/g, '');
                        } else if (t === 'pdf') {
                            dataUrl = 'data:application/pdf;base64,' + s.replace(/\s/g, '');
                        } else {
                            try {
                                const decoded = atob(s.replace(/\s/g, ''));
                                if (decoded.startsWith('%PDF')) {
                                    dataUrl = 'data:application/pdf;base64,' + s.replace(/\s/g, '');
                                    type = 'pdf';
                                } else {
                                    dataUrl = 'data:image/png;base64,' + s.replace(/\s/g, '');
                                    type = 'image';
                                }
                            } catch {
                                dataUrl = 'data:application/octet-stream;base64,' + s.replace(/\s/g, '');
                                type = 'other';
                            }
                        }
                    }
                    setDetectedType(type);
                    setResult(dataUrl);
                    setError(null);
                    const ext = type === 'image' ? 'png' : type === 'pdf' ? 'pdf' : 'bin';
                    setFileName(`converted.${ext}`);
                } catch (err) {
                    setError('Invalid Base64: ' + err.message);
                    setResult(null);
                    setDetectedType(null);
                }
            }

            function download() {
                if (!result) return;
                const a = document.createElement('a');
                a.href = result;
                a.download = fileName;
                a.click();
            }

            function copyResult() {
                if (!result) return;
                try { navigator.clipboard.writeText(result); } catch { }
            }

            const isImage = detectedType === 'image';
            const isPdf = detectedType === 'pdf';

            return (
                <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose() }}>
                    <div className="modal" style={{ maxWidth: 700 }} onClick={e => e.stopPropagation()}>
                        <div className="modal-hdr">
                            <span style={{ fontSize: 16 }}>🔄</span>
                            <div className="modal-title">Base64 Converter</div>

        async function encodeKroki(src) {
            const utf8 = new TextEncoder().encode(src);
            try {
                const cs = new CompressionStream('deflate');
                const writer = cs.writable.getWriter();
                writer.write(utf8);
                writer.close();
                const chunks = [];
                const reader = cs.readable.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                }
                const totalLen = chunks.reduce((a, c) => a + c.length, 0);
                const compressed = new Uint8Array(totalLen);
                let offset = 0;
                chunks.forEach(c => { compressed.set(c, offset); offset += c.length; });
                let binary = '';
                compressed.forEach(b => binary += String.fromCharCode(b));
                const b64 = btoa(binary);
                return b64.replace(/\+/g, '-').replace(/\//g, '_');
            } catch (e) {
                console.error('Kroki encode error:', e);
                let binary = '';
                utf8.forEach(b => binary += String.fromCharCode(b));
                return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_');
            }
        }

        function ZplPanel({ onClose }) {
            const [mode, setMode] = useState('zpl');
            const [src, setSrc] = useState(() => loadLS('daily_zpl_src',
                `^XA
^FO50,50^ADN,36,20^FDHello World^FS
^FO50,120^ADN,24,12^FDZPL Label Preview^FS
^FO50,180^BY2^BCN,80,Y,N,N^FD123456789^FS
^XZ`));
            const [b64Input, setB64Input] = useState(() => loadLS('daily_zpl_b64', ''));
            const [imgUrl, setImgUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [dpmm, setDpmm] = useState('8');
            const [width, setWidth] = useState('4');
            const [height, setHeight] = useState('6');
            const [labelIdx, setLabelIdx] = useState(0);
            const [labelCount, setLabelCount] = useState(1);
            const [autoRender, setAutoRender] = useState(true);
            const [scale, setScale] = useState(1);
            const [outputFmt, setOutputFmt] = useState('png');
            const [b64Out, setB64Out] = useState('');
            const debounceRef = useRef();

            useEffect(() => saveLS('daily_zpl_src', src), [src]);
            useEffect(() => saveLS('daily_zpl_b64', b64Input), [b64Input]);
            useEffect(() => () => { if (imgUrl && imgUrl.startsWith('blob:')) URL.revokeObjectURL(imgUrl); }, []);

            function decodeB64ToZpl(b64) {
                try {
                    const clean = b64.trim().replace(/\s/g, '');
                    const decoded = atob(clean);
                    return decoded;
                } catch (e) {
                    throw new Error('Invalid Base64: ' + e.message);
                }
            }

            function getZpl() {
                if (mode === 'zpl') return src;
                if (mode === 'base64') {
                    const decoded = decodeB64ToZpl(b64Input);
                    return decoded;
                }
                return src;
            }

            async function renderZpl(zplSrc) {
                const labelaryUrl = `https://api.labelary.com/v1/printers/${dpmm}dpmm/labels/${width}x${height}/${labelIdx}/`;
                const PROXIES = [
                    () => fetch(`https://corsproxy.io/?${encodeURIComponent(labelaryUrl)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': outputFmt === 'pdf' ? 'application/pdf' : 'image/png' },
                        body: zplSrc,
                    }),
                    () => fetch(`https://cors-anywhere.herokuapp.com/${labelaryUrl}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': outputFmt === 'pdf' ? 'application/pdf' : 'image/png', 'X-Requested-With': 'XMLHttpRequest' },
                        body: zplSrc,
                    }),
                    () => fetch(labelaryUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': outputFmt === 'pdf' ? 'application/pdf' : 'image/png' },
                        body: zplSrc,
                    }),
                ];
                let lastErr = '';
                for (const proxyFn of PROXIES) {
                    try {
                        const res = await Promise.race([
                            proxyFn(),
                            new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), 10000)),
                        ]);
                        if (!res.ok) { lastErr = `HTTP ${res.status}: ` + (await res.text().catch(() => '')).slice(0, 150); continue; }
                        const cnt = res.headers.get('X-Label-Count');
                        if (cnt) setLabelCount(parseInt(cnt) || 1);
                        const blob = await res.blob();
                        if (!blob.type.includes('image') && !blob.type.includes('pdf') && blob.size < 100) {
                            lastErr = 'Bad response: ' + (await blob.text().catch(() => '')).slice(0, 100); continue;
                        }
                        if (imgUrl && imgUrl.startsWith('blob:')) URL.revokeObjectURL(imgUrl);
                        setImgUrl(URL.createObjectURL(blob));
                        return true;

        function normalizeJson(raw) {
            if (!raw || !raw.trim()) return { ok: false, error: 'Empty input', result: '' };

            let s = raw;
            const steps = [];

            s = s.trim();

            try {
                if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) {
                    const inner = s.slice(1, -1);
                    try { const p = JSON.parse(inner); steps.push('Unwrapped outer quotes'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
                    s = inner; steps.push('Stripped outer quotes');
                }
            } catch { }

            try {
                const decoded = s.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
                if (decoded !== s) { steps.push('Decoded \\uXXXX unicode escapes'); s = decoded; }
            } catch { }

            try {
                let prev = '';
                let iters = 0;
                while (prev !== s && iters < 10) {
                    prev = s;
                    s = s.replace(/\\\\\\"/g, '"');
                    s = s.replace(/\\\\\\\\/g, '\\\\');
                    iters++;
                }
                if (prev !== s || iters > 1) steps.push('Unescaped double-escaped quotes (\\\\\\")');
            } catch { }

            try {
                const escapedQuoteCount = (s.match(/\\"/g) || []).length;
                const regularQuoteCount = (s.match(/(?<!\\)"/g) || []).length;
                if (escapedQuoteCount > 4 && escapedQuoteCount > regularQuoteCount * 2) {
                    const r = s.replace(/\\"/g, '"');
                    try {
                        const p = JSON.parse(r);
                        steps.push('Unescaped serialized JSON string (\\")');
                        return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p };
                    } catch { }
                    s = r; steps.push('Unescaped \\" for further processing');
                }
            } catch { }

            try {
                const r = s.replace(/(?<!https?:)(?<!http:)\/\/\/+/g, '/');
                if (r !== s) { steps.push('Normalized excess forward slashes (//)'); s = r; }
            } catch { }
            try {
                const r = s.replace(/\\{3,}/g, '\\');
                if (r !== s) { steps.push('Collapsed excess backslashes (\\\\\\)'); s = r; }
            } catch { }

            try {
                const r = s.replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\r/g, '\r');
                if (r !== s) { steps.push('Replaced \\n \\t \\r sequences'); s = r; }
            } catch { }

            try {
                const r = s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
                if (r !== s) { steps.push('Stripped control characters'); s = r; }
            } catch { }

            try {
                const parsed = JSON.parse(s);
                return { ok: true, result: JSON.stringify(parsed, null, 2), steps, parsed };
            } catch { }

            try {
                const trimmed = s.trim();
                if ((trimmed.startsWith('"') && trimmed.endsWith('"'))) {
                    const inner = JSON.parse(trimmed);
                    if (typeof inner === 'string') {
                        const parsed = JSON.parse(inner);
                        steps.push('Unwrapped double-stringified JSON');
                        return { ok: true, result: JSON.stringify(parsed, null, 2), steps, parsed };
                    }
                }
            } catch { }

            try {
                const r = s.replace(/,(\s*[}\]])/g, '$1');
                try { const p = JSON.parse(r); steps.push('Removed trailing commas'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
                s = r;
            } catch { }

            try {
                const r = s.replace(/'([^'\\]*(\\.[^'\\]*)*)'/g, (m, inner) => '"' + inner.replace(/"/g, '\\"') + '"');
                try { const p = JSON.parse(r); steps.push('Converted single quotes to double quotes'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
            } catch { }

            try {
                const r = s.replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)(\s*:)/g, '$1"$2"$3');
                try { const p = JSON.parse(r); steps.push('Quoted unquoted keys'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
                s = r;
            } catch { }

            try {
                const r = s.replace(/\/\/[^\n]*/g, '').replace(/\/\*[\s\S]*?\*\//g, '');
                try { const p = JSON.parse(r); steps.push('Removed JS comments'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
                s = r;
            } catch { }

            try {
                const r = s.replace(/"([^"]+)"\s*=\s*/g, '"$1": ');
                try { const p = JSON.parse(r); steps.push('Fixed = to :'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
            } catch { }

            try {
                const firstObj = s.indexOf('{');
                const firstArr = s.indexOf('[');
                let start = -1; let closing = '';
                if (firstObj !== -1 && (firstArr === -1 || firstObj < firstArr)) { start = firstObj; closing = '}'; }
                else if (firstArr !== -1) { start = firstArr; closing = ']'; }
                if (start !== -1) {
                    let depth = 0; let found = -1;
                    const open = closing === '}' ? '{' : '[';
                    for (let i = start; i < s.length; i++) {
                        if (s[i] === open) depth++;
                        else if (s[i] === closing) { depth--; if (depth === 0) { found = i; break; } }
                    }
                    if (found !== -1) {
                        const extracted = s.slice(start, found + 1);
                        try { const p = JSON.parse(extracted); steps.push('Extracted JSON from surrounding text'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
                        try {
                            const ex2 = extracted.replace(/,(\s*[}\]])/g, '$1').replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)(\s*:)/g, '$1"$2"$3');
                            const p = JSON.parse(ex2);
                            steps.push('Extracted + normalized JSON');
                            return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p };
                        } catch { }
                    }
                }
            } catch { }

            try {
                const r = s.replace(/:(\s*)"((?:[^"\\]|\\.)*)"/g, (m, sp, val) => {
                    const fixed = val.replace(/(?<!\\)"/g, '\\"');
                    return ':' + sp + '"' + fixed + '"';
                });
                try { const p = JSON.parse(r); steps.push('Fixed unescaped quotes in values'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
            } catch { }

            try {
                const r = s.replace(/\\\//g, '/');
                try { const p = JSON.parse(r); steps.push('Normalized escaped slashes'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
            } catch { }

            try {
                let r = s
                    .replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false')
                    .replace(/\bNone\b/g, 'null').replace(/\bundefined\b/g, 'null')
                    .replace(/\bNaN\b/g, 'null').replace(/\bInfinity\b/g, 'null');
                try { const p = JSON.parse(r); steps.push('Fixed Python/JS literals'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch { }
                r = r
                    .replace(/,(\s*[}\]])/g, '$1')
                    .replace(/([{,]\s*)([a-zA-Z_$][a-zA-Z0-9_$]*)(\s*:)/g, '$1"$2"$3')
                    .replace(/\/\/[^\n]*/g, '').replace(/\/\*[\s\S]*?\*\//g, '');
                try { const p = JSON.parse(r); steps.push('Applied all normalizations'); return { ok: true, result: JSON.stringify(p, null, 2), steps, parsed: p }; } catch (e) {
                    return { ok: false, error: e.message, result: s, steps };
                }
            } catch (e) {
                return { ok: false, error: e.message, result: s, steps };
            }
        }

        function saveSnapshots(snaps) {
            try {
                const cutoff = Date.now() - 30 * 864e5;
                const filtered = snaps.filter(s => s.ts > cutoff);
                const slotMap = {};
                const deduped = [];
                filtered.sort((a, b) => a.ts - b.ts);
                for (const s of filtered) {
                    const key = s.date + '_' + new Date(s.ts).getHours();
                    slotMap[key] = s;
                }
                Object.values(slotMap).forEach(s => deduped.push(s));
                const lastByDay = {};
                for (const s of deduped) {
                    lastByDay[s.date] = s;
                }
                for (const s of deduped) {
                    if (lastByDay[s.date] === s || slotMap[s.date + '_' + new Date(s.ts).getHours()] === s) {
                    }
                }
                const final = Object.values(slotMap);
                Object.values(lastByDay).forEach(last => {
                    if (!final.includes(last)) final.push(last);
                });
                final.sort((a, b) => b.ts - a.ts);
                localStorage.setItem('daily_snapshots', JSON.stringify(final));
                return final;
            } catch {
                try {
                    localStorage.setItem('daily_snapshots', JSON.stringify(snaps.slice(0, 100)));
                } catch { }
                return snaps;
            }

                hour: d.getHours(),
                trigger: trigger || 'manual',
                cols: JSON.parse(JSON.stringify(cols)),
                cards: JSON.parse(JSON.stringify(cards)),
            };
            const all = loadSnapshots();
            const filtered = all.filter(s => !(s.date === snap.date && s.hour === snap.hour));
            filtered.push(snap);
            saveSnapshots(filtered);
            return snap;
        }
        function exportSnapshots() {
            const snaps = loadSnapshots();
            if (!snaps.length) return false;
            const a = document.createElement('a');
            const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), snapshots: snaps }, null, 2)], { type: 'application/json' });
            a.href = URL.createObjectURL(blob);
            a.download = 'daily-snapshots-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            return true;
        }
        function importSnapshots(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if (!d.snapshots || !Array.isArray(d.snapshots)) throw new Error('Invalid format');
                        const existing = loadSnapshots();
                        const merged = [...existing, ...d.snapshots];
                        const ids = new Set();
                        const deduped = merged.filter(s => { if (ids.has(s.id)) return false; ids.add(s.id); return true; });
                        deduped.sort((a, b) => b.ts - a.ts);
                        saveSnapshots(deduped);
                        resolve(deduped.length);
                    } catch (e) { reject(e); }
                };
                r.onerror = reject;
                r.readAsText(file);
            });
        }
        function getStorageUsage() {
            try {
                const snaps = loadSnapshots();
                const str = JSON.stringify(snaps);
                return { count: snaps.length, bytes: str.length, kb: Math.round(str.length / 1024), mb: Math.round(str.length / 1048576 * 10) / 10 };
            } catch { return { count: 0, bytes: 0, kb: 0, mb: 0 } };
        }

        function MonthGrid({ year, month, onPrev, onNext, onDateClick, selectedDate, hasDots, getDotColor, compact }) {
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const dayNames = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;
            const todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

            const cells = [];
            for (let i = 0; i < firstDay; i++)cells.push(null);
            for (let d = 1; d <= daysInMonth; d++)cells.push(d);

            return (
                <div style={{ flexShrink: 0 }}>
                    {!compact && (
                        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, padding: '8px 0 10px' }}>
                            <button onClick={onPrev} style={{ width: 28, height: 28, borderRadius: 7, border: '1px solid var(--border)', background: 'var(--bg3)', color: 'var(--text2)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, padding: 0 }}>‹</button>
                            <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)', minWidth: 150, textAlign: 'center' }}>
                                {monthNames[month]} {year}
                            </span>
                            <button onClick={onNext} style={{ width: 28, height: 28, borderRadius: 7, border: '1px solid var(--border)', background: 'var(--bg3)', color: 'var(--text2)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, padding: 0 }}>›</button>
                        </div>
                    )}
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2, marginBottom: 3 }}>
                        {dayNames.map(d => (
                            <div key={d} style={{ textAlign: 'center', fontSize: 10, fontWeight: 700, color: 'var(--text3)', padding: '3px 0', letterSpacing: .5 }}>
                                {d}
                            </div>
                        ))}
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 2 }}>
                        {cells.map((day, i) => {
                            if (day === null) return <div key={'e' + i} />;
                            const ds = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                            const isToday = ds === todayStr;
                            const isSelected = ds === selectedDate;
                            const hasDot = hasDots ? hasDots(ds) : false;
                            const dotColor = getDotColor ? getDotColor(ds) : null;
                            const isFuture = new Date(ds + 'T23:59') > new Date();

                                <button key={ds} onClick={() => onDateClick(ds)}

                                        alignItems: 'center', justifyContent: 'center', gap: 2, position: 'relative',
                                        border: isSelected ? '2px solid var(--blue)' : '1px solid transparent',
                                        background: isSelected ? 'var(--blue-dim)' : isToday ? 'var(--bg4)' : 'transparent',
                                        color: isSelected ? 'var(--blue)' : isToday ? 'var(--text)' : 'var(--text2)',
                                        fontSize: 12, fontWeight: isToday || isSelected ? 700 : 500,
                                        cursor: 'pointer', transition: 'all .1s', outline: 'none',
                                        opacity: isFuture ? 0.6 : 1,
                                    }}
                                    onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = 'var(--bg4)'; }}
                                    onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = isToday ? 'var(--bg4)' : 'transparent'; }}>
