                        {tab === 'timemachine' && (
                            <div style={{ padding: '0 12px 12px' }}>
                                <div style={{ padding: '8px 10px', background: 'var(--bg3)', borderRadius: 8, border: '1px solid var(--border)' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text3)', marginBottom: 4 }}>
                                        <span>Storage: {usage.kb} KB</span>
                                        <span>{usage.count} snapshots</span>
                                    </div>
                                    <div style={{ height: 4, background: 'var(--bg4)', borderRadius: 2, overflow: 'hidden' }}>
                                        <div style={{
                                            height: '100%',
                                            width: Math.min(100, (usage.kb / 5120) * 100) + '%',
                                            background: usage.kb > 4000 ? 'var(--red)' : usage.kb > 2500 ? 'var(--amber)' : 'var(--green)',
                                            borderRadius: 2
                                        }} />
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Day detail — bottom */}
                    <div className="cal-m-day">
                        <div className="cal-m-dayhdr">
                            <span style={{ fontSize: 20 }}>📅</span>
                            <div style={{ flex: 1, minWidth: 0 }}>
                                <div className="cal-m-daytitle">{fmtDate(selectedDate)}</div>
                                <div className="cal-m-daysub">
                                    {tab === 'events'
                                        ? `${dayEvents.length} event${dayEvents.length !== 1 ? 's' : ''}`
                                        : `${daySnaps.length} snapshot${daySnaps.length !== 1 ? 's' : ''}`}
                                    {selectedDate === todayStr() && (
                                        <span className="cal-today-badge">TODAY</span>
                                    )}
                                </div>
                            </div>
                            {tab === 'events' && (
                                <button className="btn primary" style={{ fontSize: 11, padding: '6px 14px', flexShrink: 0 }}
                                    onClick={onCreateEvent}>
                                    + Add
                                </button>
                            )}
                        </div>

                        <div className="cal-m-list">
                            {/* EVENTS */}
                            {tab === 'events' && (
                                <>
                                    {dayEvents.length === 0 && (
                                        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text3)' }}>
                                            <div style={{ fontSize: 44, marginBottom: 12, opacity: .3 }}>📭</div>
                                            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6, color: 'var(--text2)' }}>
                                                No events on this day
                                            </div>
                                            <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 16, lineHeight: 1.6 }}>
                                                Tap below to add an event — you'll get a browser notification when it's time.
                                            </div>
                                            <button className="btn primary" style={{ fontSize: 13, padding: '8px 20px' }}
                                                onClick={onCreateEvent}>
                                                + Add Event
                                            </button>
                                        </div>
                                    )}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                        {dayEvents.map(evt => {
                                            const isToday2 = selectedDate === todayStr();
                                            const evtTs = new Date(selectedDate + 'T' + (evt.time || '00:00')).getTime();
                                            const isPast = isToday2 && evtTs < Date.now();
                                            const isNow = isToday2 && evtTs <= Date.now() && evtTs + 3600000 > Date.now();
                                            return (
                                                <div key={evt.id}
                                                    onClick={() => onEditEvent(evt)}
                                                    style={{
                                                        background: 'var(--bg3)', border: '1px solid var(--border)',
                                                        borderRadius: 12, padding: '12px 14px', cursor: 'pointer',
                                                        borderLeft: `4px solid ${evt.color || 'var(--blue)'}`,
                                                        opacity: isPast ? 0.6 : 1,
                                                        boxShadow: isNow ? `0 0 0 2px ${evt.color || 'var(--blue)'}44` : 'none',
                                                    }}>
                                                    <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, flexWrap: 'wrap' }}>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 3 }}>
                                                                <span style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)' }}>
                                                                    {evt.title}
                                                                </span>
                                                                {isNow && (
                                                                    <span style={{
                                                                        fontSize: 9, padding: '1px 7px', borderRadius: 10,
                                                                        background: evt.color + '33', color: evt.color || 'var(--blue)',
                                                                        fontWeight: 700, border: `1px solid ${evt.color || 'var(--blue)'}55`,
                                                                    }}>
                                                                        NOW
                                                                    </span>
                                                                )}
                                                                {isPast && (
                                                                    <span style={{
                                                                        fontSize: 9, padding: '1px 7px', borderRadius: 10,
                                                                        background: 'var(--bg4)', color: 'var(--text3)', fontWeight: 600
                                                                    }}>
                                                                        Past
                                                                    </span>
                                                                )}
                                                                {evt.repeat && evt.repeat !== 'none' && (
                                                                    <span style={{ fontSize: 10, color: 'var(--text3)' }}>🔁 {evt.repeat}</span>
                                                                )}
                                                            </div>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                                                                {evt.time && (
                                                                    <span style={{
                                                                        fontSize: 12, color: 'var(--text2)', fontWeight: 500,
                                                                        display: 'flex', alignItems: 'center', gap: 4
                                                                    }}>
                                                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
                                                                        {fmtTime(evt.time)}{evt.endTime && ' → ' + fmtTime(evt.endTime)}
                                                                    </span>
                                                                )}
                                                                {evt.notifyBefore > 0 && (
                                                                    <span style={{ fontSize: 11, color: 'var(--text3)', display: 'flex', alignItems: 'center', gap: 3 }}>
                                                                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
                                                                        {evt.notifyBefore < 60 ? evt.notifyBefore + 'min' : evt.notifyBefore / 60 + 'hr'} before
                                                                    </span>
                                                                )}
                                                            </div>
                                                            {evt.notes && (
                                                                <div style={{
                                                                    marginTop: 7, fontSize: 12, color: 'var(--text3)',
                                                                    lineHeight: 1.5, borderTop: '1px solid var(--border)', paddingTop: 7
                                                                }}>
                                                                    {evt.notes}
                                                                </div>
                                                            )}
                                                        </div>
                                                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4, flexShrink: 0 }}>
                                                            <div style={{ width: 10, height: 10, borderRadius: 3, background: evt.color || 'var(--blue)' }} />
                                                            <span style={{ fontSize: 10, color: 'var(--text3)' }}>Edit →</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}

                            {/* TIME MACHINE */}
                            {tab === 'timemachine' && (
                                <>
                                    {daySnaps.length === 0 && (
                                        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text3)' }}>
                                            <div style={{ fontSize: 44, marginBottom: 12, opacity: .3 }}>📭</div>
                                            <div style={{ fontSize: 15, fontWeight: 600, marginBottom: 6, color: 'var(--text2)' }}>
                                                No snapshots for this date
                                            </div>
                                            <div style={{ fontSize: 12, lineHeight: 1.6, maxWidth: 300, margin: '0 auto' }}>
                                                Snapshots are saved automatically when you change cards.<br />
                                                Select a date with a <span style={{ color: 'var(--green)', fontWeight: 700 }}>● dot</span> to view history.
                                            </div>
                                            <button className="btn" style={{ marginTop: 16 }} onClick={goToday}>Go to Today</button>
                                        </div>
                                    )}
                                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                                        {daySnaps.map((snap, idx) => {
                                            const t = new Date(snap.ts);
                                            const timeStr = t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                            const cardCount = Object.keys(snap.cards || {}).reduce((a, k) => a + (snap.cards[k] || []).length, 0);
                                            const prevSnap = daySnaps[idx - 1];
                                            const diff = prevSnap ? getSnapshotDiff(prevSnap, snap) : null;
                                            const isLatest = idx === daySnaps.length - 1;
                                            const isEarliest = idx === 0;
                                            const triggerLabel = {
                                                'manual': 'Manual', 'card_added': 'Card added', 'card_deleted': 'Card deleted',
                                                'card_moved': 'Card moved', 'card_edited': 'Card edited',
                                                'col_added': 'Col added', 'col_deleted': 'Col deleted',
                                                'col_renamed': 'Col renamed', 'auto': 'Auto',
                                            };
                                            return (
                                                <div key={snap.id}
                                                    onClick={() => onViewSnap(snap)}
                                                    style={{
                                                        background: 'var(--bg3)', border: '1px solid var(--border)',
                                                        borderRadius: 10, padding: '10px 12px', cursor: 'pointer'
                                                    }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
                                                        <div style={{
                                                            background: isEarliest ? 'var(--green-dim)' : isLatest ? 'var(--blue-dim)' : 'var(--bg4)',
                                                            color: isEarliest ? 'var(--green)' : isLatest ? 'var(--blue)' : 'var(--text2)',
                                                            border: `1px solid ${isEarliest ? 'rgba(62,207,142,.3)' : isLatest ? 'rgba(79,142,247,.3)' : 'var(--border)'}`,
                                                            borderRadius: 8, padding: '3px 10px', fontSize: 12, fontWeight: 700,
                                                            fontFamily: "'DM Mono',monospace", flexShrink: 0
                                                        }}>
                                                            {timeStr}
                                                        </div>
                                                        <div style={{ flex: 1, minWidth: 0 }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexWrap: 'wrap' }}>
                                                                <span style={{ fontSize: 12, color: 'var(--text2)' }}>
                                                                    {(snap.cols || []).length} cols · {cardCount} cards
                                                                </span>
                                                                <span style={{
                                                                    fontSize: 9, padding: '1px 6px', borderRadius: 8,
                                                                    background: 'var(--bg4)', color: 'var(--text3)',
                                                                    textTransform: 'uppercase', letterSpacing: .3
                                                                }}>
                                                                    {triggerLabel[snap.trigger] || snap.trigger}
                                                                </span>
                                                                {isLatest && <span style={{ fontSize: 9, padding: '1px 6px', borderRadius: 8, background: 'var(--blue-dim)', color: 'var(--blue)', fontWeight: 700 }}>Latest</span>}
                                                                {isEarliest && daySnaps.length > 1 && <span style={{ fontSize: 9, padding: '1px 6px', borderRadius: 8, background: 'var(--green-dim)', color: 'var(--green)', fontWeight: 700 }}>Earliest</span>}
                                                            </div>
                                                            {diff && (diff.added > 0 || diff.removed > 0 || diff.moved > 0) && (
                                                                <div style={{ display: 'flex', gap: 8, marginTop: 3 }}>
                                                                    {diff.added > 0 && <span style={{ fontSize: 10, color: 'var(--green)' }}>+{diff.added}</span>}
                                                                    {diff.removed > 0 && <span style={{ fontSize: 10, color: 'var(--red)' }}>−{diff.removed}</span>}
                                                                    {diff.moved > 0 && <span style={{ fontSize: 10, color: 'var(--amber)' }}>→{diff.moved}</span>}
                                                                </div>
                                                            )}
                                                        </div>
                                                        <span style={{ fontSize: 11, color: 'var(--blue)', fontWeight: 600, flexShrink: 0 }}>View →</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        /* ── CALENDAR PANEL — Time Machine + Events (responsive) ── */
        function CalendarPanel({ onClose, addToast }) {
            const isMobile = useIsMobile(640);
            const nowD = new Date();
            const [tab, setTab] = useState('events');
            const [calYear, setCalYear] = useState(nowD.getFullYear());
            const [calMonth, setCalMonth] = useState(nowD.getMonth());
            const [selectedDate, setSelectedDate] = useState(() => {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            });
            const [viewingSnap, setViewingSnap] = useState(null);
            const [snapshots, setSnapshots] = useState(() => loadSnapshots());
            const [events, setEvents] = useState(() => loadEvents());
            const [editingEvt, setEditingEvt] = useState(null);
            const [showEvtModal, setShowEvtModal] = useState(false);

            function todayStr() {
                const d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }
            function fmtDate(ds) {
                const d = new Date(ds + 'T00:00');
                return d.toLocaleDateString([], { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }
            function fmtTime(t) {
                if (!t) return '';
                const [h, m] = t.split(':');
                const hr = parseInt(h);
                return (hr % 12 || 12) + ':' + m + (hr < 12 ? 'am' : 'pm');
            }

            function prevMonth() { if (calMonth === 0) { setCalMonth(11); setCalYear(y => y - 1); } else setCalMonth(m => m - 1); }
            function nextMonth() { if (calMonth === 11) { setCalMonth(0); setCalYear(y => y + 1); } else setCalMonth(m => m + 1); }
            function goToday() { const ds = todayStr(); setCalYear(new Date().getFullYear()); setCalMonth(new Date().getMonth()); setSelectedDate(ds); }

            // expose for mobile upcoming click
            useEffect(() => {
                window.__calSetYM = (y, m) => { setCalYear(y); setCalMonth(m); };
                return () => { delete window.__calSetYM; };
            }, []);

            const snapshotDateSet = useMemo(() => new Set(snapshots.map(s => s.date)), [snapshots]);
            function hasSnapDot(ds) { return snapshotDateSet.has(ds); }
            function hasEventDot(ds) { return events.some(e => isEventOnDate(e, ds)); }
            function getEventDotColor(ds) {
                const evts = events.filter(e => isEventOnDate(e, ds));
                return evts[0]?.color || 'var(--blue)';
            }
            function hasDots(ds) {
                if (tab === 'timemachine') return hasSnapDot(ds) || hasEventDot(ds);
                return hasEventDot(ds) || hasSnapDot(ds);
            }
            function getDotColor(ds) {
                if (tab === 'timemachine') return hasSnapDot(ds) ? 'var(--green)' : getEventDotColor(ds);
                return hasEventDot(ds) ? getEventDotColor(ds) : 'var(--green)';
            }

            const daySnaps = useMemo(() => snapshots.filter(s => s.date === selectedDate).sort((a, b) => a.ts - b.ts), [snapshots, selectedDate]);
            const dayEvents = useMemo(() => {
                return events.filter(e => isEventOnDate(e, selectedDate)).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            }, [events, selectedDate]);

            const usage = useMemo(() => getStorageUsage(), [snapshots]);
            const oldest = useMemo(() => snapshots.length ? snapshots[snapshots.length - 1] : null, [snapshots]);
            const snapshotDates = useMemo(() => [...snapshotDateSet].sort((a, b) => b.localeCompare(a)), [snapshotDateSet]);

            function handleExport() { exportSnapshots(); addToast('History exported ✓', 'success'); }
            async function handleImport() {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
                inp.onchange = async e => {
                    const f = e.target.files[0]; if (!f) return;
                    try { const count = await importSnapshots(f); setSnapshots(loadSnapshots()); addToast(`Imported ${count} snapshots ✓`, 'success'); }
                    catch (err) { addToast('Import failed: ' + err.message, 'error'); }
                }; inp.click();
            }
            function handleClearOld() {
                if (!confirm('Delete snapshots older than 30 days?')) return;
                const cutoff = Date.now() - 30 * 864e5;
                saveSnapshots(snapshots.filter(s => s.ts > cutoff));
                setSnapshots(loadSnapshots()); addToast('Cleared', 'success');
            }

            function saveEvent(evt) {
                const existing = loadEvents();
                const idx = existing.findIndex(e => e.id === evt.id);
                if (idx !== -1) existing[idx] = evt;
                else existing.push(evt);
                saveEvents(existing);
                setEvents(loadEvents());
                setShowEvtModal(false);
                setEditingEvt(null);
                addToast(idx !== -1 ? 'Event updated ✓' : 'Event created ✓', 'success');
                if (window.Notification && Notification.permission === 'default') {
                    Notification.requestPermission();
                }
            }
            function deleteEvent(id) {
                const updated = loadEvents().filter(e => e.id !== id);
                saveEvents(updated); setEvents(updated);
                setShowEvtModal(false); setEditingEvt(null);
                addToast('Event deleted');
            }

            const upcoming = useMemo(() => {
                const now = Date.now();
                const all = loadEvents();
                const result = [];
                for (let i = 0; i < 14; i++) {
                    const d = new Date(now + i * 864e5);
                    const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                    all.forEach(evt => {
                        if (!isEventOnDate(evt, ds)) return;
                        const evtTs = new Date(ds + 'T' + (evt.time || '00:00')).getTime();
                        if (i === 0 && evtTs < now) return;
                        result.push({ ...evt, onDate: ds, evtTs });
                    });
                }
                return result.sort((a, b) => a.evtTs - b.evtTs).slice(0, 20);
            }, [events]);

            if (viewingSnap) {
                return <SnapshotBoard snap={viewingSnap} onClose={() => setViewingSnap(null)} />;
            }

            return (
                <>
                    <FloatingPanel title="Calendar" icon="📅" onClose={onClose}
                        initW={900} initH={620} storageKey="cal">

                        {isMobile ? (
                            <CalendarMobile
                                tab={tab} setTab={setTab}
                                calYear={calYear} calMonth={calMonth}
                                prevMonth={prevMonth} nextMonth={nextMonth} goToday={goToday}
                                selectedDate={selectedDate} setSelectedDate={setSelectedDate}
                                hasDots={hasDots} getDotColor={getDotColor}
                                dayEvents={dayEvents} daySnaps={daySnaps}
                                onCreateEvent={() => { setEditingEvt({ date: selectedDate }); setShowEvtModal(true); }}
                                onEditEvent={evt => { setEditingEvt(evt); setShowEvtModal(true); }}
                                onViewSnap={snap => setViewingSnap(snap)}
                                addToast={addToast}
                                fmtDate={fmtDate} fmtTime={fmtTime} todayStr={todayStr}
                                usage={usage} snapshotDates={snapshotDates}
                                handleExport={handleExport} handleImport={handleImport} handleClearOld={handleClearOld}
                                upcoming={upcoming}
                            />
                        ) : (
                            <>
                                {/* Tab bar */}
                                <div style={{
                                    display: 'flex', borderBottom: '1px solid var(--border)',
                                    background: 'var(--bg3)', flexShrink: 0
                                }}>
                                    {[['events', '📅 Events'], ['timemachine', '📸 Time Machine']].map(([id, lbl]) => (
                                        <button key={id} onClick={() => setTab(id)}
                                            style={{
                                                padding: '9px 18px', fontSize: 12, fontWeight: 600, border: 'none',
                                                cursor: 'pointer', background: 'transparent',
                                                color: tab === id ? 'var(--blue)' : 'var(--text3)',
                                                borderBottom: tab === id ? '2px solid var(--blue)' : '2px solid transparent',
                                                transition: 'all .12s', whiteSpace: 'nowrap'
                                            }}>
                                            {lbl}
                                        </button>
                                    ))}
                                </div>

                                <div style={{ flex: 1, display: 'flex', minHeight: 0, overflow: 'hidden' }}>
                                    {/* LEFT */}
                                    <div style={{
                                        flex: '0 0 300px', borderRight: '1px solid var(--border)',
                                        display: 'flex', flexDirection: 'column', minHeight: 0, overflowY: 'auto',
                                        background: 'var(--bg2)'
                                    }}>
                                        <div style={{ padding: '10px 12px 0' }}>
                                            <MonthGrid
                                                year={calYear} month={calMonth}
                                                onPrev={prevMonth} onNext={nextMonth}
                                                onDateClick={ds => setSelectedDate(ds)}
                                                selectedDate={selectedDate}
                                                hasDots={hasDots}
                                                getDotColor={getDotColor}
                                            />
                                        </div>

                                        <div style={{ padding: '8px 12px', display: 'flex', gap: 5 }}>
                                            <button className="btn" style={{ fontSize: 11, padding: '4px 10px', flex: 1 }}
                                                onClick={goToday}>Today</button>
                                            {tab === 'events' && (
                                                <button className="btn primary" style={{ fontSize: 11, padding: '4px 12px', flex: 2 }}
                                                    onClick={() => { setEditingEvt({ date: selectedDate }); setShowEvtModal(true); }}>
                                                    + Add Event
                                                </button>
                                            )}
                                        </div>

                                        {tab === 'events' && upcoming.length > 0 && (
                                            <div style={{ padding: '0 12px 10px' }}>
                                                <div style={{
                                                    fontSize: 9, color: 'var(--text3)', textTransform: 'uppercase',
                                                    letterSpacing: .5, marginBottom: 5, fontWeight: 700
                                                }}>
                                                    Upcoming ({upcoming.length})
                                                </div>
                                                <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
                                                    {upcoming.slice(0, 8).map((evt, i) => {
                                                        const isToday2 = evt.onDate === todayStr();
                                                        const d = new Date(evt.onDate + 'T00:00');
                                                        const label = isToday2 ? 'Today' : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
                                                        return (
                                                            <button key={evt.id + evt.onDate + i}
                                                                onClick={() => {
                                                                    setSelectedDate(evt.onDate);
                                                                    const dd = new Date(evt.onDate + 'T00:00');
                                                                    setCalYear(dd.getFullYear()); setCalMonth(dd.getMonth());
                                                                }}
                                                                style={{
                                                                    display: 'flex', alignItems: 'center', gap: 6, padding: '4px 7px',
                                                                    borderRadius: 7, border: '1px solid var(--border)', background: 'var(--bg3)',
                                                                    cursor: 'pointer', textAlign: 'left', width: '100%', transition: '.1s'
                                                                }}
                                                                onMouseEnter={e => e.currentTarget.style.borderColor = 'var(--blue)'}
                                                                onMouseLeave={e => e.currentTarget.style.borderColor = 'var(--border)'}>
                                                                <div style={{ width: 8, height: 8, borderRadius: 2, background: evt.color || 'var(--blue)', flexShrink: 0 }} />
                                                                <div style={{ flex: 1, minWidth: 0 }}>
                                                                    <div style={{
                                                                        fontSize: 10, fontWeight: 600, color: 'var(--text)',
                                                                        overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'
                                                                    }}>
                                                                        {evt.title}
                                                                    </div>
                                                                    <div style={{ fontSize: 9, color: 'var(--text3)' }}>
                                                                        {label} {evt.time && '· ' + fmtTime(evt.time)}
                                                                        {evt.repeat && evt.repeat !== 'none' && <span style={{ marginLeft: 4 }}>🔁</span>}
                                                                    </div>
                                                                </div>
                                                            </button>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}

                                        {tab === 'timemachine' && (
                                            <div style={{ padding: '0 12px 10px' }}>
                                                <div style={{ padding: '8px', background: 'var(--bg3)', borderRadius: 8, border: '1px solid var(--border)' }}>
                                                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10, color: 'var(--text3)', marginBottom: 3 }}>
                                                        <span>Storage: {usage.kb} KB</span>
                                                        <span>{usage.count} snaps</span>
                                                    </div>
                                                    <div style={{ height: 4, background: 'var(--bg4)', borderRadius: 2, overflow: 'hidden' }}>
                                                        <div style={{
                                                            height: '100%',

        function getSnapshotDiff(prev, current) {
            const prevIds = new Set();
            const currIds = new Set();
            const prevMap = {};
            const currMap = {};
            Object.entries(prev.cards || {}).forEach(([col, arr]) => {
                (arr || []).forEach(c => { prevIds.add(c.id); prevMap[c.id] = col; });
            });
            Object.entries(current.cards || {}).forEach(([col, arr]) => {
                (arr || []).forEach(c => { currIds.add(c.id); currMap[c.id] = col; });
            });
            let added = 0, removed = 0, moved = 0;
            currIds.forEach(id => { if (!prevIds.has(id)) added++; });
            prevIds.forEach(id => { if (!currIds.has(id)) removed++; });
            currIds.forEach(id => {
                if (prevIds.has(id) && prevMap[id] !== currMap[id]) moved++;
            });
            return { added, removed, moved };
        }

        function loadEvents() {
            try { const d = localStorage.getItem('daily_events'); if (!d) return []; return JSON.parse(d); }
            catch { return []; }
        }
        function saveEvents(evts) {
            try { localStorage.setItem('daily_events', JSON.stringify(evts)); }
            catch { }
        }
        function getEventsForDate(dateStr) {
            return loadEvents().filter(e => e.date === dateStr || isEventOnDate(e, dateStr));
        }
        function isEventOnDate(evt, dateStr) {
            if (evt.date === dateStr) return true;
            if (!evt.repeat || evt.repeat === 'none') return false;
            const evtDate = new Date(evt.date + 'T00:00');
            const checkDate = new Date(dateStr + 'T00:00');
            if (checkDate < evtDate) return false;
            if (evt.repeat === 'daily') return true;
            if (evt.repeat === 'weekly') return evtDate.getDay() === checkDate.getDay();
            if (evt.repeat === 'monthly') return evtDate.getDate() === checkDate.getDate();
            return false;
        }
        function getUpcomingEvents(limitMins = 1440) {
            const now = Date.now();
            const limit = now + limitMins * 60 * 1000;
            const events = loadEvents();
            const upcoming = [];
            for (let dayOffset = 0; dayOffset < 7; dayOffset++) {
                const d = new Date(now + dayOffset * 864e5);
                const ds = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                events.forEach(evt => {
                    if (!isEventOnDate(evt, ds)) return;
                    const evtTs = new Date(ds + 'T' + (evt.time || '00:00')).getTime();
                    const notifyTs = evtTs - (evt.notifyBefore || 0) * 60 * 1000;
                    if (notifyTs >= now && notifyTs <= limit) {
                        upcoming.push({ ...evt, fireAt: notifyTs, eventAt: evtTs, onDate: ds });
                    }
                });
            }
            return upcoming.sort((a, b) => a.fireAt - b.fireAt);
        }

        /* ── APP ── */
        function App() {
            const WS_SERVER_URL = 'https://daily-2.onrender.com';

            const saved = loadData();
            const def = defaultData();
            const [cols, setCols] = useState(saved?.cols || def.cols);
            const [cards, setCards] = useState(saved?.cards || def.cards);
            const [now, setNow] = useState(Date.now());
            const [spinning, setSpinning] = useState(false);
            const [windowW, setWindowW] = useState(window.innerWidth);
            const [scratch, setScratch] = useState(() => loadLS('daily_scratch', ''));
            useEffect(() => saveLS('daily_scratch', scratch), [scratch]);

            const SESSION_ID = useRef(Math.random().toString(36).slice(2, 10));
            const wsClient = useRef(null);
            const wsConnected = useRef(false);
            const [peerStatus, setPeerStatus] = useState('disconnected');
            const [peerCount, setPeerCount] = useState(0);
            const [showSyncModal, setShowSyncModal] = useState(false);
            const [roomId, setRoomId] = useState('');
            const [activeRoom, setActiveRoom] = useState('');
            const [myPeerId, setMyPeerId] = useState('');
            const [conflicts, setConflicts] = useState([]);
            const pendingRemote = useRef(null);
            const isSyncing = useRef(false);
            const broadcastTimer = useRef(null);
            const colsRef = useRef(cols);
            const cardsRef = useRef(cards);
            const scratchRef = useRef(scratch);
            const activeRoomRef = useRef('');
            const lastSyncedCards = useRef({});
            const [showBase64, setShowBase64] = useState(false);
            const [showZpl, setShowZpl] = useState(false);
            const [showJson, setShowJson] = useState(false);
            const [showCalendar, setShowCalendar] = useState(false);

            useEffect(() => { colsRef.current = cols; }, [cols]);
            useEffect(() => { cardsRef.current = cards; }, [cards]);
            useEffect(() => { scratchRef.current = scratch; }, [scratch]);
            useEffect(() => { activeRoomRef.current = activeRoom; }, [activeRoom]);

            function tryParse(s, fb) { try { return JSON.parse(s); } catch { return fb; } }

            function mergeRemoteState(remoteCols, remoteCards, remoteScratch) {
                const localCols = colsRef.current;
                const localCards = cardsRef.current;
                const newScratch = remoteScratch !== undefined ? remoteScratch : scratchRef.current;

                const newCols = [...localCols];
                const localColIds = new Set(localCols.map(c => c.id));
                (remoteCols || []).forEach(c => { if (!localColIds.has(c.id)) newCols.push(c); });

                const localMap = {};
                Object.entries(localCards).forEach(([colId, list]) =>
                    (list || []).forEach(c => { localMap[c.id] = { card: c, col: colId }; })
                );
                const remoteMap = {};
                Object.entries(remoteCards || {}).forEach(([colId, list]) =>
                    (list || []).forEach(c => { remoteMap[c.id] = { card: c, col: colId }; })
                );

                const winners = {};
                new Set([...Object.keys(localMap), ...Object.keys(remoteMap)]).forEach(id => {
                    const L = localMap[id], R = remoteMap[id];
                    if (!L) { winners[id] = R; return; }
                    if (!R) { winners[id] = L; return; }
                    const lTs = new Date(L.card.updatedAt || L.card.createdAt || 0).getTime();
                    const rTs = new Date(R.card.updatedAt || R.card.createdAt || 0).getTime();
                    winners[id] = rTs > lTs ? R : L;
                });

                const newCards = {};
                newCols.forEach(c => { newCards[c.id] = []; });
                const placed = new Set();

                Object.entries(remoteCards || {}).forEach(([, list]) =>
                    (list || []).forEach(rc => {
                        const w = winners[rc.id];
                        if (!w || placed.has(rc.id)) return;
                        if (!newCards[w.col]) newCards[w.col] = [];
                        newCards[w.col].push({ ...w.card });
                        placed.add(rc.id);
                    })
                );
                Object.entries(localCards).forEach(([, list]) =>
                    (list || []).forEach(lc => {
                        const w = winners[lc.id];
                        if (!w || placed.has(lc.id)) return;
                        if (!newCards[w.col]) newCards[w.col] = [];
                        newCards[w.col].push({ ...w.card });
                        placed.add(lc.id);
                    })
                );

                return { cols: newCols, cards: newCards, scratch: newScratch, conflicts: [] };
            }

            function applyRemoteWithConflicts(data) {
                if (!data || (!data.cols && !data.cards && data.scratch === undefined)) return;
                isSyncing.current = true;

                const result = mergeRemoteState(
                    data.cols || colsRef.current,
                    data.cards || cardsRef.current,
                    data.scratch
                );

                setCols(result.cols);
                setCards(result.cards);
                if (result.scratch !== undefined) setScratch(result.scratch);
                setPeerStatus('connected');

                setTimeout(() => { isSyncing.current = false; }, 150);
            }

            function handleIncoming(data) {
                if (!data || (!data.cols && !data.cards && data.scratch === undefined)) return;
                if (data._sid === SESSION_ID.current) return;
                applyRemoteWithConflicts(data);
            }

            function resolveConflict(idx, choice) {
                const c = conflicts[idx];
                if (!c) return;
                setCards(prev => {
                    const col = Object.keys(prev).find(k => (prev[k] || []).some(x => x.id === c.cardId));
                    if (!col) return prev;
                    let chosen = c.local;
                    if (choice === 'remote') chosen = c.remote;
                    else if (choice === 'merge') {
                        chosen = {
                            ...c.local,

                        pwaPrompt.prompt(); const { outcome } = await pwaPrompt
                            .userChoice; if (outcome === 'accepted') {
                                setPwaPrompt(null);
                                addToast('App installed! 🎉', 'success');
                            }
                    } catch {
                        addToast('Install failed — try browser menu', 'error');
                    }
                } else {
                    const ua = navigator.userAgent
                        .toLowerCase(); if (ua.includes('chrome')) addToast('Chrome: ⋮ Menu → Install App',
                            'success');
                    else if (ua.includes('edge')) addToast('Edge: ⋯ Menu → Apps → Install', 'success');
                    else if (ua.includes('firefox')) addToast('Firefox: Use Chrome/Edge for PWA install', '');
                    else addToast('Use browser menu → Add to Home Screen', 'success');
                }
            }

            const q = search.trim().toLowerCase();
            const filteredCards = useMemo(() => {
                if (!q) return cards; const out = {}; Object.keys(cards).forEach(
                    k => {
                        out[k] = (cards[k] || []).filter(c => c.task.toLowerCase().includes(q) || (c.content || '')
                            .toLowerCase().includes(q));
                    }); return out;
            }, [cards, q]);
            const totalAll = cols.reduce((a, c) => a + (cards[c.id] || []).length, 0);
            const totalBlockers = cols.reduce((a, c) => a + (cards[c.id] || []).filter(x => parseBlocker(x.content))
                .length, 0);
            const totalDone = cols.reduce((a, c) => a + (cards[c.id] || []).filter(x => x.doneAt).length, 0);
            const activeTimers = Object.values(timers).filter(t => t.running && t.remaining > 0).length;

            const overflowItems = [
                {
                    icon: '🔍', label: 'Search', action: () => {
                        setSearchOpen(o => !o); if (!searchOpen)
                            setTimeout(() => searchRef.current?.focus(), 80);
                    }
                },
                { icon: '📝', label: 'Scratch Pad', action: () => setShowEditor(o => !o) },
                { icon: '✏️', label: 'Drawing Board', action: () => setShowDraw(true) },
                { icon: '🤖', label: 'AI Assistants', action: () => setShowAi(o => !o) },
                null,
                { icon: '🔄', label: 'Base64 Converter', action: () => setShowBase64(true) },
                { icon: '📐', label: 'Diagrams', action: () => setShowKroki(true) },
                { icon: '✨', label: 'JSON Prettifier', action: () => setShowJson(true) },
                { icon: '🏷️', label: 'ZPL', action: () => setShowZpl(true) },

                null,
                { icon: '📅', label: 'Calendar', action: () => setShowCalendar(true) },
                { icon: '🔄', label: 'Refresh Ages', action: () => refreshAge() },
                {
                    icon: light ? '🌙' : '☀️', label: light ? 'Dark Mode' : 'Light Mode', action: () => setLight(l =>
                        !l)
                },
                { icon: '⌨️', label: 'Shortcuts', action: () => setShowShortcuts(true) },
                null,
                { icon: '⬇️', label: 'Import JSON', action: () => importJSON() },
                { icon: '⬆️', label: 'Export JSON', action: () => exportJSON() },
                null,
                {
                    icon: '📱', label: 'Install App', action: () => installPwa(), badge: {
                        text: 'Install',
                        bg: 'var(--blue-dim)', color: 'var(--blue)'
                    }
                },
            ];

            const renderDesktopHeader = () => (
                <>
                    <div className="stats-desktop" style={{ display: 'flex', gap: 5, flexShrink: 0 }}>
                        <div className="stat-pill">{totalAll} tasks</div>
                        {totalBlockers > 0 && <div className="stat-pill red">🚫 {totalBlockers}</div>}
                        {totalDone > 0 && <div className="stat-pill green">✓ {totalDone}</div>}
                        {activeTimers > 0 && <div className="stat-pill" style={{
                            color: 'var(--blue)',
                            borderColor: 'var(--blue-dim)', background: 'var(--blue-dim)'
                        }}>⏱ {activeTimers}</div>}
                    </div>
                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 3, alignItems: 'center' }}>
                        <div className="search-wrap">
                            {searchOpen && (<div style={{
                                position: 'relative', display: 'flex',
                                alignItems: 'center'
                            }}><span style={{
                                position: 'absolute', left: 9,
                                top: '50%', transform: 'translateY(-50%)', color: 'var(--text3)',
                                pointerEvents: 'none'
                            }}><i className="fa-solid fa-magnifying-glass"></i></span><input
                                    ref={searchRef} className="search-inp" value={search} onChange={e =>
                                        setSearch(e.target.value)} placeholder="Search…" onKeyDown={e => {
                                            if (
                                                e.key === 'Escape') {
                                                setSearch('');
                                                setSearchOpen(false);
                                            }
                                        }} /></div>)}
                            <button className={`ibtn${searchOpen ? ' active' : ''}`} data-tip="Search" onClick={() => {
                                setSearchOpen(o => !o); if (!searchOpen) setTimeout(() => searchRef
                                    .current?.focus(), 80);
                            }}><i className="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                        <button className={`ibtn${showEditor ? ' active' : ''}`} data-tip="Scratch Pad (E)" onClick={() =>
                            setShowEditor(o => !o)}><i className="fa-solid fa-pen-to-square"></i></button>
                        <button className="ibtn" data-tip="Drawing Board (D)" onClick={() => setShowDraw(true)} style={{
                            color: 'var(--blue)', borderColor: 'var(--blue-dim)',
                            background: 'var(--blue-dim)'
                        }}><i className="fa-solid fa-paintbrush"></i></button>
                        <button className={`ibtn${showAi ? ' active' : ''}`} data-tip="AI Assistants" onClick={() =>
                            setShowAi(o => !o)}><i className="fa-solid fa-wand-magic-sparkles"></i></button>
                        <button className={`ibtn${showKroki ? ' active' : ''}`} data-tip="Diagrams" onClick={() => setShowKroki(o => !o)}>
                            <i className="fa-solid fa-diagram-project"></i>
                        </button>

                        <button
                            className={`ibtn${showZpl ? ' active' : ''}`}
                            data-tip="ZPL Label Preview"
                            onClick={() => setShowZpl(o => !o)}
                        >
                            <i className="fa-solid fa-barcode"></i>
                        </button>

                        <button
                            className={`ibtn${showJson ? ' active' : ''}`}
                            data-tip="JSON Prettifier"
                            onClick={() => setShowJson(o => !o)}
                        >
                            <i className="fa-solid fa-code"></i>
                        </button>

                        <button
                            className={`ibtn${showCalendar ? ' active' : ''}`}
                            data-tip="Calendar"
                            onClick={() => setShowCalendar(o => !o)}
                        >
                            <i className="fa-regular fa-calendar-days"></i>
                        </button>

                        <button className="ibtn" data-tip="Base64 Converter" onClick={() => setShowBase64(true)} style={{ color: 'var(--text)', borderColor: 'var(--border2)' }}>
                            <i className="fa-solid fa-file-code"></i>
                        </button>
                        <button className={`ibtn${(peerStatus === 'connected' || peerStatus === 'hosting') ? ' active' : ''}`}
                            data-tip="Sync" onClick={() => setShowSyncModal(true)} style={{ position: 'relative' }}><i className="fa-solid fa-network-wired"></i>{(peerStatus ===
                                'connected' || peerStatus === 'hosting') && <div className={`sync-dot ${peerStatus === 'connected' ? 'connected' : 'connecting'}`}
                                    style={{ position: 'absolute', bottom: -2, right: -2, width: 8, height: 8 }} />}</button>
                        <button className="ibtn" data-tip="Refresh ages" onClick={refreshAge}><i className={`fa-solid fa-arrows-rotate ${spinning ? 'spin' : ''}`}></i></button>
                        <button className="ibtn" data-tip={light ? 'Dark mode' : 'Light mode'} onClick={() => setLight(
                            l => !l)}>{light
                                ? <i className="fa-solid fa-moon"></i>
                                : <i className="fa-solid fa-sun"></i>}</button>
                        <button className="ibtn" data-tip="Shortcuts" onClick={() => setShowShortcuts(true)}><i className="fa-solid fa-keyboard"></i></button>
                        <button className="ibtn" data-tip="Import JSON" onClick={importJSON}><i className="fa-solid fa-file-import"></i></button>
                        <button className="ibtn" data-tip="Export JSON" onClick={exportJSON}><i className="fa-solid fa-file-export"></i></button>
                        <button className="ibtn" data-tip="Install App" onClick={installPwa} style={{
                            color: 'var(--blue)',
                            borderColor: 'var(--blue-dim)', background: 'var(--blue-dim)'
                        }}><i className="fa-solid fa-download"></i></button>
                    </div>
                </>
            );

            const renderMobileTabletHeader = () => (
                <>
                    <div style={{ display: 'flex', gap: 4, flexShrink: 0 }}>
                        <div className="stat-pill" style={{ fontSize: 10, padding: '2px 6px' }}>{totalAll}</div>
                        {totalBlockers > 0 && <div className="stat-pill red" style={{ fontSize: 10, padding: '2px 6px' }}>
                            🚫{totalBlockers}</div>}
                        {activeTimers > 0 && <div className="stat-pill" style={{
                            fontSize: 10, padding: '2px 6px',
                            color: 'var(--blue)', borderColor: 'var(--blue-dim)',
                            background: 'var(--blue-dim)'
                        }}>⏱{activeTimers}</div>}
                    </div>
                    <div style={{ marginLeft: 'auto', display: 'flex', gap: 3, alignItems: 'center' }}>
                        {searchOpen && (<div style={{ position: 'relative', display: 'flex', alignItems: 'center' }}>
                            <span style={{
                                position: 'absolute', left: 8, top: '50%', transform: 'translateY(-50%)',
                                color: 'var(--text3)', pointerEvents: 'none'
                            }}><svg width="12" height="12"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle
                                        cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg></span>
                            <input ref={searchRef} className="search-inp" value={search} onChange={e =>
                                setSearch(e.target.value)} placeholder="Search…" onKeyDown={e => {
                                    if (e
                                        .key === 'Escape') {
                                        setSearch('');
                                        setSearchOpen(false);
                                    }
                                }} style={{ paddingLeft: 28 }} /></div>)}
                        <button className={`ibtn${searchOpen ? ' active' : ''}`} onClick={() => {
                            setSearchOpen(o =>
                                !o); if (!searchOpen) setTimeout(() => searchRef.current?.focus(), 80);
                        }}><svg
                            width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            strokeWidth="2.5"><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg></button>
                        <button className={`ibtn${(peerStatus === 'connected' || peerStatus === 'hosting') ? ' active' : ''}`}
                            onClick={() => setShowSyncModal(true)} style={{ position: 'relative' }}><svg width="14"
                                height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle
                                    cx="5" cy="6" r="2.5" /><circle cx="19" cy="6" r="2.5" /><circle cx="12" cy="18"
                                        r="2.5" /><path d="M7 7.5L10.5 16M17 7.5L13.5 16M7.5 6h9" /></svg>{(peerStatus ===
                                            'connected' || peerStatus === 'hosting') && <div className={`sync-dot ${peerStatus === 'connected' ? 'connected' : 'connecting'}`}
                                                style={{ position: 'absolute', bottom: -2, right: -2, width: 8, height: 8 }} />}</button>
                        <div style={{ position: 'relative' }}><button className={`ibtn${showOverflow ? ' active' : ''}`}
                            onClick={() => setShowOverflow(o => !o)}><svg width="14" height="14" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="5" r="1.5"
                                    fill="currentColor" /><circle cx="12" cy="12" r="1.5" fill="currentColor" /><circle
                                    cx="12" cy="19" r="1.5" fill="currentColor" /></svg></button>{showOverflow &&
                                        <OverflowMenu items={overflowItems} onClose={() => setShowOverflow(false)} />}</div>
                    </div>
                </>
            );

            if (showDraw) {
                return (
                    <>
                        <DrawPanel onClose={() => setShowDraw(false)} light={light} />
                        <Toast toasts={toasts} />
                        <AlarmOverlay alarms={alarms} onDismiss={dismissAlarms} />
                    </>
                );
            }

            return (
                <div className="app">
                    <div className="header">
                        <div className="logo">Daily<span>.</span></div>
                        {(mobile || tablet) ? renderMobileTabletHeader() : renderDesktopHeader()}
                    </div>
                    <div className="board-wrap">
                        <div className="board" onDragEnd={() => {
                            setDragCardId(null);
                            setDragCardFrom(null);
                            setDragColId(null);
                            setColDropTarget(null);
                        }}>
                            {cols.map(col => (
                                <Column key={col.id} colData={col} cards={filteredCards[col.id] || []} allCols={cols}
                                    now={now} timers={timers}
                                    dragCardId={dragCardId} isColDragging={dragColId === col.id} isColDropTarget={
                                        colDropTarget === col.id}
                                    onCardDrop={onCardDrop} onCardReorder={onCardReorder}
                                    onColDragStart={onColDragStart} onColDragOver={onColDragOver} onColDrop={onColDrop}
                                    onOpen={card => {
                                        setOpenCard(card);
                                        setOpenCardCol(col.id);
                                    }}
                                    onAddCard={setAddCardCol} onDeleteCol={onDeleteCol} onToggleLock={onToggleLock}
                                    onRenameCol={onRenameCol} />
                            ))}
                            <button className="add-col-btn" title="Add column" onClick={() => setShowAddCol(true)}>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    strokeWidth="2"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12"
                                        x2="19" y2="12" /></svg>
                            </button>
                        </div>
                    </div>
                    <button className="fab" onClick={() => setAddCardCol(cols[0]?.id)} title="New card (N)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            strokeWidth="2.5"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19"
                                y2="12" /></svg>
                    </button>

                    {openCard && openCardCol && (<CardModal card={openCard} col={openCardCol} cols={cols} now={now}
                        timers={timers} setTimers={setTimers} addToast={addToast} onClose={() => setOpenCard(
                            null)} onSave={onSaveCard} onDelete={onDeleteCard} onMove={onMoveCard} />)}
                    {addCardCol && <AddCardModal defaultCol={addCardCol} cols={cols} onClose={() => setAddCardCol(
                        null)} onAdd={onAddCard} />}
                    {showAddCol && <AddColModal onClose={() => setShowAddCol(false)} onAdd={onAddCol} />}
                    {showShortcuts && <ShortcutsPanel onClose={() => setShowShortcuts(false)} />}
                    {showEditor && <ScratchPad content={scratch} onChange={setScratch} onClose={() => setShowEditor(
                        false)} />}
                    {showAi && <AiPanel onClose={() => setShowAi(false)} />}
                    {showKroki && <KrokiPanel onClose={() => setShowKroki(false)} />}
                    {showZpl && <ZplPanel onClose={() => setShowZpl(false)} />}
                    {showJson && <JsonPanel onClose={() => setShowJson(false)} />}
                    {showCalendar && <CalendarPanel onClose={() => setShowCalendar(false)} addToast={addToast} />}

                    {showBase64 && <Base64Converter onClose={() => setShowBase64(false)} />}
                    {showSyncModal && <SyncModal
                        onClose={() => setShowSyncModal(false)} peerStatus={peerStatus} peerCount={peerCount}
                        roomId={roomId} setRoomId={setRoomId} createRoom={createRoom} joinRoom={joinRoom}
                        disconnectRoom={disconnectRoom} myPeerId={myPeerId} activeRoom={activeRoom}
                        broadcastWebSocket={broadcastWebSocket} />}
                    {conflicts.length > 0 && <ConflictModal conflicts={conflicts} onResolve={resolveConflict}
                        onResolveAll={resolveAllConflicts} />}
                    {confetti && <Confetti key={confettiKey.current} />}
                    <Toast toasts={toasts} />
                    <AlarmOverlay alarms={alarms} onDismiss={dismissAlarms} />
                    <EventAlarmOverlay alarms={eventAlarms} onDismiss={dismissEventAlarms} onSnooze={snoozeEventAlarms} />

                    {pwaPrompt && !mobile && (
                        <div className="pwa-banner">
                            <div><div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>📱 Install Daily.</div>
                                <div style={{ fontSize: 11, color: 'var(--text3)' }}>Use as a standalone app</div></div>
                            <button className="pwa-install" onClick={installPwa}>Install</button>
                            <button className="pwa-dismiss" onClick={() => setPwaPrompt(null)}>✕</button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
