        /* ══════════════════════════════════════════════════════════
   GUIDED TOUR — first-run walkthrough
   ══════════════════════════════════════════════════════════ */
        function findTourTarget(selectors) {
            for (const selector of (selectors || '').split(',').map(value => value.trim()).filter(Boolean)) {
                const target = [...document.querySelectorAll(selector)].find(element => {
                    const rect = element.getBoundingClientRect();
                    const style = getComputedStyle(element);
                    return rect.width > 0 && rect.height > 0 && style.visibility !== 'hidden'
                        && style.display !== 'none';
                });
                if (target) return target;
            }
            return null;
        }

        function Tour({ steps, onFinish, onSkip, onRevealMenu }) {
            const [idx, setIdx] = useState(0);
            const [rect, setRect] = useState(null);
            const [ready, setReady] = useState(false);
            const [tipHeight, setTipHeight] = useState(400);
            const tipRef = useRef(null);
            const step = steps[idx];
            const isLast = idx === steps.length - 1;
            const panelRef = useRef(null);
            useGuideFocus(panelRef);

            useEffect(() => {
                if (!ready || !tipRef.current) return;
                const observer = new ResizeObserver(() => setTipHeight(tipRef.current?.offsetHeight || 400));
                observer.observe(tipRef.current);
                return () => observer.disconnect();
            }, [ready, idx]);

            /* measure + track the target */
            useEffect(() => {
                if (!step) return;
                setReady(false);
                const primary = findTourTarget(step.target?.split(',')[0]);
                onRevealMenu(!!step.menuTarget && !primary);
                let lastTarget = null;

                function measure() {
                    const visiblePrimary = findTourTarget(step.target?.split(',')[0]);
                    onRevealMenu(!!step.menuTarget && !visiblePrimary);
                    const target = findTourTarget(step.target);
                    if (!target) { setRect(null); setReady(true); return; }
                    if (target !== lastTarget) {
                        lastTarget = target;
                        target.scrollIntoView({ behavior: 'auto', block: 'nearest', inline: 'nearest' });
                        const menu = target.closest('.overflow-menu');
                        if (menu) menu.scrollTop += target.getBoundingClientRect().top - menu.getBoundingClientRect().top - 8;
                    }
                    const r = target.getBoundingClientRect();
                    setRect(current => current && current.x === r.left && current.y === r.top
                        && current.w === r.width && current.h === r.height ? current
                        : { x: r.left, y: r.top, w: r.width, h: r.height });
                    setReady(true);
                }

                const header = document.querySelector('.header');
                const observer = new MutationObserver(measure);
                if (header) observer.observe(header, { childList: true, subtree: true });
                const resizeObserver = new ResizeObserver(measure);
                if (header) resizeObserver.observe(header);
                const timer = setTimeout(measure, 0);
                window.addEventListener('resize', measure);
                window.addEventListener('scroll', measure, true);
                return () => {
                    clearTimeout(timer);
                    observer.disconnect();
                    resizeObserver.disconnect();
                    window.removeEventListener('resize', measure);
                    window.removeEventListener('scroll', measure, true);
                };
            }, [idx, step, onRevealMenu]);

            /* keyboard nav */
            useEffect(() => {
                function onKey(e) {
                    if (e.target.closest('button') && e.key === 'Enter') return;
                    if (e.key === 'Escape') { e.preventDefault(); onSkip(); }
                    else if (e.key === 'ArrowRight' && !isLast) { e.preventDefault(); setIdx(i => i + 1); }
                    else if (e.key === 'ArrowLeft' && idx > 0) { e.preventDefault(); setIdx(i => i - 1); }
                    else if (e.key === 'Enter') { e.preventDefault(); isLast ? onFinish() : setIdx(i => i + 1); }
                }
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [idx, isLast, onFinish, onSkip]);

            if (!step) return null;

            const pad = 8;
            const spotlight = rect ? {
                x: rect.x - pad, y: rect.y - pad,
                w: rect.w + pad * 2, h: rect.h + pad * 2,
            } : null;

            function tooltipStyle() {
                if (!spotlight) {
                    const width = Math.min(440, window.innerWidth - 32);
                    return {
                        left: (window.innerWidth - width) / 2,
                        top: Math.max(12, (window.innerHeight - tipHeight) / 2),
                        width,
                    };
                }
                const margin = 16;
                const vw = window.innerWidth, vh = window.innerHeight;
                const tipW = Math.min(380, vw - 32);
                let tipH = tipHeight;
                let p = step.placement || 'auto';
                if (p === 'auto') {
                    if (spotlight.y + spotlight.h + tipH + margin < vh) p = 'bottom';
                    else if (spotlight.y - tipH - margin > 0) p = 'top';
                    else if (spotlight.x + spotlight.w + tipW + margin < vw) p = 'right';
                    else p = 'left';
                }
                let maxHeight = vh - 24;
                if (p === 'top') maxHeight = Math.max(100, Math.min(maxHeight, spotlight.y - margin - 12));
                if (p === 'bottom') maxHeight = Math.max(100, Math.min(maxHeight, vh - spotlight.y - spotlight.h - margin - 12));
                tipH = Math.min(tipH, maxHeight);
                let left, top;
                if (p === 'bottom') { left = spotlight.x + spotlight.w / 2 - tipW / 2; top = spotlight.y + spotlight.h + margin; }
                else if (p === 'top') { left = spotlight.x + spotlight.w / 2 - tipW / 2; top = spotlight.y - tipH - margin; }
                else if (p === 'right') { left = spotlight.x + spotlight.w + margin; top = spotlight.y + spotlight.h / 2 - tipH / 2; }
                else { left = spotlight.x - tipW - margin; top = spotlight.y + spotlight.h / 2 - tipH / 2; }

                left = Math.max(12, Math.min(left, vw - tipW - 12));
                top = Math.max(12, Math.min(top, vh - tipH - 12));
                return { left, top, width: tipW, maxHeight };
            }

            const tipStyle = tooltipStyle();
            const tipRect = { x: tipStyle.left, y: tipStyle.top, w: tipStyle.width, h: tipHeight };
            const clamp = (value, min, max) => Math.max(min, Math.min(value, max));
            const connector = spotlight ? (() => {
                const cx = spotlight.x + spotlight.w / 2, cy = spotlight.y + spotlight.h / 2;
                const tx = tipRect.x + tipRect.w / 2, ty = tipRect.y + tipRect.h / 2;
                const vertical = cy < tipRect.y || cy > tipRect.y + tipRect.h;
                return vertical ? {
                    x1: clamp(cx, tipRect.x + 16, tipRect.x + tipRect.w - 16),
                    y1: cy < ty ? tipRect.y : tipRect.y + tipRect.h,
                    x2: clamp(tx, spotlight.x, spotlight.x + spotlight.w),
                    y2: cy < ty ? spotlight.y + spotlight.h : spotlight.y,
                } : {
                    x1: cx < tx ? tipRect.x : tipRect.x + tipRect.w,
                    y1: clamp(cy, tipRect.y + 16, tipRect.y + tipRect.h - 16),
                    x2: cx < tx ? spotlight.x + spotlight.w : spotlight.x,
                    y2: clamp(ty, spotlight.y, spotlight.y + spotlight.h),
                };
            })() : null;

            return (
                <div ref={panelRef} tabIndex={-1} role="dialog" aria-modal="true" aria-label="Feature tour" style={{
                    position: 'fixed', inset: 0, zIndex: 5000,
                    fontFamily: "'DM Sans', sans-serif",
                }}>
                    {/* Spotlight / dim overlay */}
                    {spotlight ? (
                        <div data-tour-spotlight style={{
                            position: 'fixed',
                            left: spotlight.x, top: spotlight.y,
                            width: spotlight.w, height: spotlight.h,
                            borderRadius: 12,
                            boxShadow: '0 0 0 9999px rgba(0,0,0,.78), 0 0 0 3px var(--blue), 0 0 42px 8px rgba(79,142,247,.45)',
                            pointerEvents: 'none',
                        }} />
                    ) : (
                        <div style={{
                            position: 'fixed', inset: 0,
                            background: 'rgba(0,0,0,.78)',
                            transition: 'background .3s',
                        }} />
                    )}

                    {ready && connector && <svg data-tour-connector aria-hidden="true" width="100%" height="100%"
                        style={{ position: 'fixed', inset: 0, pointerEvents: 'none', overflow: 'visible' }}>
                        <defs><marker id="tour-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                            <path d="M0 0L10 5L0 10Z" fill="var(--blue)" />
                        </marker></defs>
                        <line {...connector} stroke="var(--blue)" strokeWidth="3" markerEnd="url(#tour-arrow)" />
                        <circle cx={connector.x2} cy={connector.y2} r="5" fill="var(--blue)" />
                    </svg>}
                    {/* Tooltip card */}
                    {ready && (
                        <div ref={tipRef} data-tour-tooltip style={{
                            position: 'fixed',
                            ...tipStyle,
                            background: 'var(--bg2)',
                            border: '1px solid var(--border2)',
                            borderRadius: 16,
                            padding: '20px 20px 16px',
                            boxShadow: '0 22px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(79,142,247,.14), 0 0 48px rgba(79,142,247,.1)',
                            animation: 'confirmIn .32s cubic-bezier(.2,.9,.3,1.1) both',
                            pointerEvents: 'auto',
                            maxHeight: tipStyle.maxHeight || 'calc(var(--viewport-height, 100vh) - 24px)',
                            overflowY: 'auto',
                        }}>
                            {/* Progress bar */}
                            <div style={{
                                display: 'flex', gap: 5, marginBottom: 14, alignItems: 'center',
                            }}>
                                {steps.map((_, i) => (
                                    <div key={i} style={{
                                        flex: i === idx ? '3 1 0' : '1 1 0', minWidth: 2, height: 6,
                                        borderRadius: 3,
                                        background: i === idx ? 'var(--blue)'
                                            : i < idx ? 'var(--blue-dim)' : 'var(--bg4)',
                                        transition: 'all .3s cubic-bezier(.2,.9,.3,1.1)',
                                        boxShadow: i === idx ? '0 0 8px rgba(79,142,247,.55)' : 'none',
                                    }} />
                                ))}
                                <span style={{
                                    marginLeft: 'auto', fontSize: 10, color: 'var(--text3)',
                                    fontFamily: "'DM Mono',monospace",
                                }}>
                                    {idx + 1} / {steps.length}
                                </span>
                            </div>

                            {step.icon && (
                                <div style={{
                                    fontSize: 32, marginBottom: 8,
                                    filter: 'drop-shadow(0 0 12px rgba(79,142,247,.35))',
                                }}><IconLabel text={step.icon} /></div>
                            )}

                            <div style={{
                                fontSize: 17, fontWeight: 700, color: 'var(--text)',
                                letterSpacing: '-.25px', marginBottom: 8, lineHeight: 1.25,
                            }}>
                                {step.title}
                            </div>

                            <div style={{
                                fontSize: 13.5, color: 'var(--text2)',
                                lineHeight: 1.65, marginBottom: 18,
                            }} aria-live="polite">
                                {step.body}
                                {step.shortcut && <div style={{ marginTop: 8 }}>
                                    Shortcut: <span className="kbd">{step.shortcut.toUpperCase()}</span>
                                </div>}
                            </div>

                            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                                <button onClick={onSkip}
                                    style={{
                                        fontSize: 12, color: 'var(--text3)', background: 'none',
                                        border: 'none', cursor: 'pointer', padding: '6px 8px',
                                        borderRadius: 6, transition: '.12s',
                                    }}
                                    onMouseEnter={e => e.currentTarget.style.color = 'var(--text)'}
                                    onMouseLeave={e => e.currentTarget.style.color = 'var(--text3)'}>
                                    Skip tour
                                </button>
                                <div style={{ flex: 1 }} />
                                {idx > 0 && (
                                    <button className="btn" onClick={() => setIdx(idx - 1)}
                                        style={{ padding: '7px 14px', fontSize: 12 }}>
                                        <Icon name="ArrowLeft" size="1em" /> Back
                                    </button>
                                )}
                                <button className="btn primary"
                                    onClick={() => { isLast ? onFinish() : setIdx(idx + 1); }}
                                    style={{ padding: '7px 20px', fontSize: 12, fontWeight: 600 }}>
                                    {isLast ? <IconLabel text={"Let's go! 🚀"} /> : <IconLabel text={"Next →"} />}
                                </button>
                            </div>

                            <div style={{
                                marginTop: 12, paddingTop: 10, borderTop: '1px solid var(--border)',
                                fontSize: 10, color: 'var(--text3)',
                                display: 'flex', justifyContent: 'space-between',
                            }}>
                                <span>Use <span className="kbd" style={{ fontSize: 9 }}><Icon name="ArrowLeft" size="1em" /></span> <span className="kbd" style={{ fontSize: 9 }}><Icon name="ArrowRight" size="1em" /></span> to navigate</span>
                                <span><span className="kbd" style={{ fontSize: 9 }}>Esc</span> to skip</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        /* ── CONFETTI ── */
        function Confetti() {
            const [pieces] = useState(() => {
                const cols = ['#4f8ef7', '#3ecf8e', '#f7c35a', '#a78bfa', '#f76f6f'];
                return Array.from({ length: 45 }, (_, i) => ({
                    id: i, left: Math.random() * 100, color: cols[i % 5],
                    size: 5 + Math.random() * 6, delay: Math.random() * .8, dur: 1.4 + Math.random()
                }));
            });
            return pieces.map(p => <div key={p.id} className="cp" style={{
                left: p.left + '%', width: p.size, height: p
                    .size, background: p.color, animationDelay: p.delay + 's', animationDuration: p.dur +
                        's'
            }} />);
        }

        function Toast({ toasts }) {
            return <div className="toasts">{toasts.map(t => <div key={t.id} className={
                `toast ${t.type || ''}`}><IconLabel text={t.msg} /></div>)}</div>;
        }

        /* ── NOTIFICATION PERMISSION SNACKBAR ── */
        function NotificationPrompt({ onClose, addToast }) {
            const [busy, setBusy] = useState(false);

            async function enable() {
                if (busy) return;
                setBusy(true);
                try {
                    try { localStorage.setItem('daily_notif_asked', '1'); } catch { }

                    if (typeof Notification === 'undefined') {
                        addToast('Notifications are not supported here', 'error');
                        setBusy(false); onClose(); return;
                    }

                    const perm = await Notification.requestPermission();

                    if (perm === 'granted') {
                        addToast('Notifications enabled 🔔', 'success');
                        setTimeout(() => {
                            showLocalNotification(
                                'Daily. notifications are on',
                                "You'll be reminded about timers, deadlines and events.",
                                'daily-welcome'
                            );
                        }, 450);
                    } else if (perm === 'denied') {
                        addToast('Blocked — enable in your browser settings', 'error');
                    } else {
                        addToast('No change — you can enable this anytime');
                    }
                } catch (e) {
                    addToast('Could not request permission', 'error');
                }
                setBusy(false);
                onClose();
            }

            function later() {
                try { localStorage.setItem('daily_notif_asked', '1'); } catch { }
                onClose();
            }

            return (
                <div className="notif-snack-wrap">
                    <div className="notif-snack" role="dialog" aria-live="polite">
                        <div className="notif-snack-icon">
                            <span className="pulse-ring" />
                            <Icon name="Bell" />
                        </div>

                        <div className="notif-snack-body">
                            <div className="notif-snack-title">Stay on top of your day</div>
                            <div className="notif-snack-text">
                                Enable notifications to get reminders for timers, deadlines and calendar
                                events <Icon name="Minus" size="1em" /> even when this tab is in the background.
                            </div>
                            <div className="notif-snack-actions">
                                <button className="notif-btn primary" onClick={enable} disabled={busy}>
                                    {busy ? 'Requesting…' : <IconLabel text={"🔔 Enable notifications"} />}
                                </button>
                                <button className="notif-btn" onClick={later} disabled={busy}>
                                    Not now
                                </button>
                            </div>
                        </div>

                        <button className="notif-snack-close" onClick={later}
                            title="Dismiss" aria-label="Dismiss"><Icon name="X" size="1em" /></button>
                    </div>
                </div>
            );
        }

        /* ── Confirm snackbar ── */
        /* ── THEMED CONFIRM DIALOG ── */
        const ConfirmContext = React.createContext(null);

        function ConfirmProvider({ children }) {
            const [dialog, setDialog] = useState(null);
            const resolverRef = useRef(null);

            const confirm = useCallback((opts) => {
                const cfg = typeof opts === 'string'
                    ? { title: opts, message: '', confirmText: 'Confirm', cancelText: 'Cancel', icon: '❓', variant: 'danger' }
                    : {
                        title: opts.title || 'Are you sure?',
                        message: opts.message || '',
                        confirmText: opts.confirmText || 'Confirm',
                        cancelText: opts.cancelText || 'Cancel',
                        icon: opts.icon || '❓',
                        variant: opts.variant || 'danger',
                    };
                return new Promise(resolve => {
                    if (resolverRef.current) resolverRef.current(false);
                    resolverRef.current = resolve;
                    setDialog(cfg);
                });
            }, []);

            const close = useCallback((ok) => {
                setDialog(null);
                const r = resolverRef.current;
                resolverRef.current = null;
                if (r) r(ok);
            }, []);

            useEffect(() => {
                if (!dialog) return;
                function onKey(e) {
                    if (e.key === 'Escape') { e.preventDefault(); close(false); }
                    else if (e.key === 'Enter') {
                        if (document.activeElement && document.activeElement.classList.contains('confirm-btn')) return;
                        e.preventDefault(); close(true);
                    }
                }
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            }, [dialog, close]);

            return (
                <ConfirmContext.Provider value={confirm}>
                    {children}
                    {dialog && (
                        <div className="confirm-overlay"
                            onMouseDown={e => { if (e.target === e.currentTarget) close(false); }}>
                            <div className={`confirm-box ${dialog.variant === 'danger' ? '' : 'safe'}`}
                                onMouseDown={e => e.stopPropagation()}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
                                    <div className="confirm-icon"><IconLabel text={dialog.icon} /></div>
                                    <div style={{ flex: 1, minWidth: 0 }}>
                                        <div className="confirm-title">{dialog.title}</div>
                                        {dialog.message && <div className="confirm-message">{dialog.message}</div>}
                                    </div>
                                </div>
                                <div className="confirm-actions">
                                    <button className="confirm-btn" onClick={() => close(false)}>
                                        {dialog.cancelText}
                                    </button>
                                    <button
                                        className={`confirm-btn ${dialog.variant === 'danger' ? 'danger' : 'primary'}`}
                                        onClick={() => close(true)}
                                        autoFocus>
                                        {dialog.confirmText}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </ConfirmContext.Provider>
            );
        }

        /* ── BASE64 CONVERTER ── */
        function Base64Converter({ onClose }) {
            const [input, setInput] = useState('');
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [detectedType, setDetectedType] = useState(null);
            const [fileName, setFileName] = useState('');

            function detectType(str) {
                const s = str.trim();
                if (!s) return null;
                if (s.startsWith('data:')) {
                    const m = s.match(/^data:([^;]+);/);
                    if (m) {
                        const type = m[1];
                        if (type.startsWith('image/')) return 'image';
                        if (type === 'application/pdf') return 'pdf';
                        return 'other';
                    }
                    return 'other';
                }
                try {
                    const decoded = atob(s.replace(/\s/g, ''));
                    if (decoded.length > 4) {
                        const hex = decoded.slice(0, 8).split('').map(c => c.charCodeAt(0).toString(16).padStart(2,
                            '0')).join('');
                        if (hex.startsWith('ffd8ff')) return 'image';
                        if (hex.startsWith('89504e47')) return 'image';
                        if (hex.startsWith('47494638')) return 'image';
                        if (hex.startsWith('52494646')) return 'image';
                        if (hex.startsWith('25504446')) return 'pdf';
                        if (hex.startsWith('424d')) return 'image';
                        if (hex.startsWith('3c737667')) return 'image';
                    }
                } catch { }
                return 'other';
            }

            function convert() {
                const s = input.trim();
                if (!s) {
                    setError('Please paste Base64 or data URL');
                    setResult(null);
                    setDetectedType(null); return;
                }
                try {
                    let dataUrl = s;
                    let type = detectType(s);
                    if (!s.startsWith('data:')) {
                        const t = detectType(s);
                        if (t === 'image') {
                            dataUrl = 'data:image/png;base64,' + s.replace(/\s/g, '');
                        } else if (t === 'pdf') {
                            dataUrl = 'data:application/pdf;base64,' + s.replace(/\s/g, '');
                        } else {
                            try {
                                const decoded = atob(s.replace(/\s/g, ''));
                                if (decoded.startsWith('%PDF')) {
                                    dataUrl = 'data:application/pdf;base64,' + s.replace(/\s/g, '');
                                    type = 'pdf';
                                } else {
                                    dataUrl = 'data:image/png;base64,' + s.replace(/\s/g, '');
                                    type = 'image';
                                }
                            } catch {
                                dataUrl = 'data:application/octet-stream;base64,' + s.replace(/\s/g, '');
                                type = 'other';
                            }
                        }
                    }
                    setDetectedType(type);
                    setResult(dataUrl);
                    setError(null);
                    const ext = type === 'image' ? 'png' : type === 'pdf' ? 'pdf' : 'bin';
                    setFileName(`converted.${ext}`);
                } catch (err) {
                    setError('Invalid Base64: ' + err.message);
                    setResult(null);
                    setDetectedType(null);
                }
            }

            function download() {
                if (!result) return;
                const a = document.createElement('a');
                a.href = result;
                a.download = fileName;
                a.click();
            }

            function copyResult() {
                if (!result) return;
                try { navigator.clipboard.writeText(result); } catch { }
            }

            const isImage = detectedType === 'image';
            const isPdf = detectedType === 'pdf';

            return (
                <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose() }}>
                    <div className="modal" style={{ maxWidth: 700 }} onClick={e => e.stopPropagation()}>
                        <div className="modal-hdr">
                            <span style={{ fontSize: 16 }}><Icon name="RefreshCw" size="1em" /></span>
                            <div className="modal-title">Base64 Converter</div>
                            <button className="ibtn" onClick={onClose} style={{
                                width: 28, height: 28,
                                marginLeft: 'auto', border: 'none'
                            }} aria-label="Close" title="Close"><Icon name="X" size="1em" /></button>
                        </div>
                        <div className="modal-body">
                            <div className="fgroup">
                                <label className="flabel">Paste Base64 or Data URL</label>
                                <textarea className="finput" style={{
                                    minHeight: 120, fontFamily: "'DM Mono',monospace",
                                    fontSize: 12, resize: 'vertical'
                                }} value={input} onChange={e =>
                                    setInput(e.target.value)} placeholder="Paste Base64 string or data:image/...;base64,..." />
                            </div>
                            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12 }}>
                                <button className="btn primary" onClick={convert}><Icon name="RefreshCw" size="1em" /> Convert</button>
                                {result && <button className="btn" onClick={download} style={{
                                    borderColor: 'var(--green)',
                                    color: 'var(--green)'
                                }}><Icon name="Download" size="1em" /> Download</button>}
                                {result && <button className="btn" onClick={copyResult} style={{
                                    borderColor: 'var(--blue)',
                                    color: 'var(--blue)'
                                }}><Icon name="Clipboard" size="1em" /> Copy URL</button>}
                                <button className="btn" style={{ color: 'var(--text3)' }} onClick={() => {
                                    setInput(
                                        '');
                                    setResult(null);
                                    setError(null);
                                    setDetectedType(null);
                                }}>Clear</button>
                            </div>
                            {error && <div style={{
                                color: 'var(--red)', fontSize: 13, padding: 8, background: 'var(--red-dim)',
                                borderRadius: 6, marginBottom: 10
                            }}><Icon name="CircleX" size="1em" /> {error}</div>}
                            {result && (
                                <div style={{ borderTop: '1px solid var(--border)', paddingTop: 12 }}>
                                    <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 6 }}>
                                        Detected: <span style={{ fontWeight: 600, color: 'var(--text)' }}>{isImage ?
                                            <IconLabel text={"🖼️ Image"} /> : isPdf ? <IconLabel text={"📄 PDF"} /> : <IconLabel text={"📄 Other"} />}</span>
                                        {isPdf && <span style={{ marginLeft: 8 }}><Icon name="Minus" size="1em" /> PDF will open in new tab</span>}
                                    </div>
                                    <div className="b64-preview" style={{
                                        background: isPdf ? 'var(--bg3)' :
                                            'transparent'
                                    }}>
                                        {isImage ? (
                                            <img src={result} alt="Preview" style={{
                                                maxWidth: '100%', maxHeight: 400,
                                                objectFit: 'contain', borderRadius: 6
                                            }} />
                                        ) : isPdf ? (
                                            <div className="b64-preview pdf-preview">
                                                <Icon name="FileText" size={64} />
                                                <span>PDF detected <Icon name="Minus" size="1em" /> click Download to save</span>
                                                <a href={result} target="_blank" rel="noopener" className="btn"
                                                    style={{ borderColor: 'var(--blue)', color: 'var(--blue)' }}>
                                                    <Icon name="ExternalLink" /> Open in new tab
                                                </a>
                                            </div>
                                        ) : (
                                            <div style={{ textAlign: 'center', padding: 20, color: 'var(--text3)' }}>
                                                <div style={{ fontSize: 32, marginBottom: 8 }}><Icon name="FileText" size="1em" /></div>
                                                <div>Binary data <Icon name="Minus" size="1em" /> use Download</div>
                                            </div>
                                        )}
                                    </div>
                                    <div style={{ marginTop: 8, fontSize: 10, color: 'var(--text3)', wordBreak: 'break-all' }}>
                                        <span style={{
                                            fontFamily: "'DM Mono',monospace", background: 'var(--bg3)',
                                            padding: '2px 6px', borderRadius: 4
                                        }}>data:{result.split(',')[0]?.slice(
                                            0, 40)}…</span>
                                    </div>
                                </div>
                            )}
                            <div style={{
                                fontSize: 10, color: 'var(--text3)', marginTop: 10, borderTop: '1px solid var(--border)',
                                paddingTop: 8
                            }}>
                                <Icon name="Lightbulb" size="1em" /> Supports: images (JPEG/PNG/GIF/WebP/SVG), PDF, and raw Base64
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        async function encodeKroki(src) {
            const utf8 = new TextEncoder().encode(src);
            try {
                const cs = new CompressionStream('deflate');
                const writer = cs.writable.getWriter();
                writer.write(utf8);
                writer.close();
                const chunks = [];
                const reader = cs.readable.getReader();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                }
                const totalLen = chunks.reduce((a, c) => a + c.length, 0);
                const compressed = new Uint8Array(totalLen);
                let offset = 0;
                chunks.forEach(c => { compressed.set(c, offset); offset += c.length; });
                let binary = '';
                compressed.forEach(b => binary += String.fromCharCode(b));
                const b64 = btoa(binary);
                return b64.replace(/\+/g, '-').replace(/\//g, '_');
            } catch (e) {
                console.error('Kroki encode error:', e);
                let binary = '';
                utf8.forEach(b => binary += String.fromCharCode(b));
                return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_');
            }
        }

            async function renderZpl(zplSrc) {
                const labelaryUrl = `https://api.labelary.com/v1/printers/${dpmm}dpmm/labels/${width}x${height}/${labelIdx}/`;
                const PROXIES = [
                    () => fetch(`https://corsproxy.io/?${encodeURIComponent(labelaryUrl)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': outputFmt === 'pdf' ? 'application/pdf' : 'image/png' },
                        body: zplSrc,

                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': outputFmt === 'pdf' ? 'application/pdf' : 'image/png', 'X-Requested-With': 'XMLHttpRequest' },
                        body: zplSrc,

                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': outputFmt === 'pdf' ? 'application/pdf' : 'image/png' },
                        body: zplSrc,
                    }),
                ];
                let lastErr = '';
                for (const proxyFn of PROXIES) {
                    try {
                        const res = await Promise.race([
                            proxyFn(),
                            new Promise((_, rej) => setTimeout(() => rej(new Error('Timeout')), 10000)),
                        ]);
                        if (!res.ok) { lastErr = `HTTP ${res.status}: ` + (await res.text().catch(() => '')).slice(0, 150); continue; }

                        const blob = await res.blob();

        function normalizeJson(raw) {
            if (!raw || !raw.trim()) return { ok: false, result: '', issues: [], steps: [] };
            const steps = [];
            const issues = [];
            const repair = window.JSONRepair?.jsonrepair;

            function parse(text, path) {
                try { return { value: JSON.parse(text) }; } catch { }
                if (!repair) return null;
                try {
                    const value = JSON.parse(repair(text));
                    steps.push('Repaired syntax at ' + path);
                    return { value };
                } catch { return null; }
            }

            function retain(text, path, reason) {
                issues.push({ path, raw: text, reason });
                return text;
            }

            function recover(text, path, depth = 0) {
                const trimmed = text.trim();
                if (depth > 100) return retain(text, path, 'Nesting limit reached; original text retained');
                const parsed = parse(trimmed, path);
                if (parsed) return parsed.value;
                const array = trimmed[0] === '[';
                if (!array && trimmed[0] !== '{') {
                    return retain(text, path, 'Value could not be parsed; retained as text');
                }
                const closing = array ? ']' : '}';
                const body = trimmed.slice(1, trimmed.endsWith(closing) ? -1 : undefined);
                const fragments = [];
                let start = 0, quote = '', escaped = false, comment = '';
                const stack = [];
                for (let index = 0; index < body.length; index++) {
                    const char = body[index], next = body[index + 1];
                    if (comment === 'line') {
                        if (char !== '\n') continue;
                        comment = '';
                    } else if (comment === 'block') {
                        if (char === '*' && next === '/') { comment = ''; index++; }
                        continue;
                    }
                    if (quote) {
                        if (escaped) { escaped = false; continue; }
                        if (char === '\\') { escaped = true; continue; }
                        if (char === quote) { quote = ''; continue; }
                        if (char !== '\n' || stack.length) continue;
                        quote = '';
                    }
                    if (char === '/' && (next === '/' || next === '*')) {
                        comment = next === '/' ? 'line' : 'block'; index++; continue;
                    }
                    if (char === '"' || char === "'") { quote = char; continue; }
                    if (char === '{' || char === '[') stack.push(char);
                    else if ((char === '}' || char === ']') && stack.length) stack.pop();
                    if (!stack.length && (char === ',' || char === '\n')) {
                        fragments.push(body.slice(start, index)); start = index + 1;
                    }
                }
                fragments.push(body.slice(start));
                const value = array ? [] : Object.create(null);
                fragments.forEach(fragment => {
                    if (!fragment.trim()) return;
                    if (array) {
                        value.push(recover(fragment, path + '[' + value.length + ']', depth + 1));
                        return;
                    }
                    const member = fragment.match(/^\s*("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|[^\s:={}\[\],]+)\s*[:=]([\s\S]*)$/);
                    if (!member) {
                        retain(fragment, path, 'Unrecognized member; original text retained separately');
                        return;
                    }
                    const keyResult = parse(member[1], path + ' (key)');
                    const key = keyResult && typeof keyResult.value === 'string' ? keyResult.value : member[1];
                    const memberPath = path + '[' + JSON.stringify(key) + ']';
                    if (Object.hasOwn(value, key)) {
                        retain(fragment, memberPath, 'Duplicate key; first value retained');
                        return;
                    }
                    value[key] = recover(member[2], memberPath, depth + 1);
                });
                return value;
            }

            let source = raw.trim();
            let strict;
            try { strict = { value: JSON.parse(source) }; } catch { }
            if (strict) {
                if (typeof strict.value !== 'string' || !/^\s*[\[{]/.test(strict.value)) {
                    return { ok: true, status: 'valid', original: raw, parsed: strict.value, result: JSON.stringify(strict.value, null, 2), steps, issues };
                }
                source = strict.value;
                steps.push('Unwrapped serialized JSON');
            } else if (/^[\[{]\s*\\(?:n|r|t|u0022|")/i.test(source)) {
                try {
                    source = JSON.parse('"' + source.replace(/"/g, '\\"') + '"');
                    steps.push('Decoded serialized JSON escapes');
                } catch { }
            }
            if (/^```(?:json)?\s/i.test(source) && /```$/.test(source)) {
                source = source.replace(/^```(?:json)?\s*/i, '').replace(/```$/, '');
                steps.push('Removed Markdown fence');
            }
            const whole = /^[\[{]/.test(source.trim()) ? parse(source, '$') : null;
            const documents = [];
            if (!whole) {
                let cursor = 0;
                while (cursor < source.length) {
                    const relativeStart = source.slice(cursor).search(/[\[{]/);
                    const start = relativeStart < 0 ? source.length : cursor + relativeStart;
                    const outside = source.slice(cursor, start);
                    if (outside.trim() && (start < source.length || documents.length)) retain(outside, '$', 'Text outside JSON; original text retained separately');
                    if (start === source.length) break;
                    const stack = [];
                    let quote = '', escaped = false, comment = '', end = start;
                    for (; end < source.length; end++) {
                        const char = source[end], next = source[end + 1];
                        if (comment === 'line') {
                            if (char === '\n') comment = '';
                            continue;
                        }
                        if (comment === 'block') {
                            if (char === '*' && next === '/') { comment = ''; end++; }
                            continue;
                        }
                        if (quote) {
                            if (escaped) escaped = false;
                            else if (char === '\\') escaped = true;
                            else if (char === quote || char === '\n') quote = '';
                            continue;
                        }
                        if (char === '/' && (next === '/' || next === '*')) {
                            comment = next === '/' ? 'line' : 'block'; end++; continue;
                        }
                        if (char === '"' || char === "'") quote = char;
                        else if (char === '{' || char === '[') stack.push(char);
                        else if (char === '}' || char === ']') {
                            stack.pop();
                            if (!stack.length) { end++; break; }
                        }
                    }
                    documents.push(source.slice(start, end));
                    cursor = end;
                }
            }
            const parsed = whole ? whole.value : documents.length
                ? (documents.length === 1 ? recover(documents[0], '$') : documents.map((text, index) => recover(text, '$[' + index + ']')))
                : retain(source, '$', 'No JSON structure recognized; original text retained');
            return {
                ok: true, status: issues.length ? 'partial' : 'repaired', original: raw, parsed,
                result: JSON.stringify(parsed, null, 2), steps, issues
            };
        }

        function validateJsonInput(raw) {
            const lint = window.JSONLint;
            if (!lint) return { available: false, diagnostics: [], reason: 'Validator not loaded; formatting and recovery remain available' };
            try {
                const validation = lint.validate(raw, { mode: 'strict', duplicateKeys: 'warn', protoKeys: 'safe', maxDepth: 512 });
                return {
                    available: true,
                    diagnostics: validation.diagnostics.map(diagnostic => ({
                        ...diagnostic,
                        location: lint.lineColumn(raw, diagnostic.start),
                        relatedLocation: diagnostic.related ? lint.lineColumn(raw, diagnostic.related.start) : undefined
                    }))
                };
            } catch {
                return { available: false, diagnostics: [], reason: 'Validation could not complete; formatting and recovery remain available' };
            }
        }

        function loadSnapshots() {
            try {
                const d = localStorage.getItem('daily_snapshots');
                if (!d) return [];
                return JSON.parse(d);
            } catch { return [] }
        }
        function saveSnapshots(snaps) {
            try {
                const cutoff = Date.now() - 30 * 864e5;
                const filtered = snaps.filter(s => s.ts > cutoff);
                const slotMap = {};
                const deduped = [];
                filtered.sort((a, b) => a.ts - b.ts);
                for (const s of filtered) {
                    const key = s.date + '_' + new Date(s.ts).getHours();
                    slotMap[key] = s;
                }
                Object.values(slotMap).forEach(s => deduped.push(s));
                const lastByDay = {};
                for (const s of deduped) {
                    lastByDay[s.date] = s;
                }
                for (const s of deduped) {
                    if (lastByDay[s.date] === s || slotMap[s.date + '_' + new Date(s.ts).getHours()] === s) {
                    }
                }
                const final = Object.values(slotMap);
                Object.values(lastByDay).forEach(last => {
                    if (!final.includes(last)) final.push(last);
                });
                final.sort((a, b) => b.ts - a.ts);
                localStorage.setItem('daily_snapshots', JSON.stringify(final));
                return final;
            } catch {
                try {
                    localStorage.setItem('daily_snapshots', JSON.stringify(snaps.slice(0, 100)));
                } catch { }
                return snaps;
            }
        }
        function getSnapshotsForDate(dateStr) {
            const all = loadSnapshots();
            return all.filter(s => s.date === dateStr).sort((a, b) => a.ts - b.ts);
        }
        function hasSnapshotsOn(dateStr) {
            const all = loadSnapshots();
            return all.some(s => s.date === dateStr);
        }
        function getAllSnapshotDates() {
            const all = loadSnapshots();
            return [...new Set(all.map(s => s.date))];
        }
        function createSnapshot(cols, cards, trigger) {
            const now = Date.now();
            const d = new Date(now);
            const dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            const snap = {
                id: 'snap_' + Math.random().toString(36).slice(2, 10),
                ts: now,
                date: dateStr,
                hour: d.getHours(),
                trigger: trigger || 'manual',
                cols: JSON.parse(JSON.stringify(cols)),
                cards: JSON.parse(JSON.stringify(cards)),
            };
            const all = loadSnapshots();
            const filtered = all.filter(s => !(s.date === snap.date && s.hour === snap.hour));
            filtered.push(snap);
            saveSnapshots(filtered);
            return snap;
        }
        function exportSnapshots() {
            const snaps = loadSnapshots();
            if (!snaps.length) return false;
            const a = document.createElement('a');
            const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), snapshots: snaps }, null, 2)], { type: 'application/json' });
            a.href = URL.createObjectURL(blob);
            a.download = 'daily-snapshots-' + new Date().toISOString().slice(0, 10) + '.json';
            a.click();
            return true;
        }
        function importSnapshots(file) {
            return new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = ev => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if (!d.snapshots || !Array.isArray(d.snapshots)) throw new Error('Invalid format');
                        const existing = loadSnapshots();
                        const merged = [...existing, ...d.snapshots];
                        const ids = new Set();
                        const deduped = merged.filter(s => { if (ids.has(s.id)) return false; ids.add(s.id); return true; });
                        deduped.sort((a, b) => b.ts - a.ts);
                        saveSnapshots(deduped);
                        resolve(deduped.length);
                    } catch (e) { reject(e); }
                };
                r.onerror = reject;
                r.readAsText(file);
            });
        }
        function getStorageUsage() {
            try {
                const snaps = loadSnapshots();
                const str = JSON.stringify(snaps);
                return { count: snaps.length, bytes: str.length, kb: Math.round(str.length / 1024), mb: Math.round(str.length / 1048576 * 10) / 10 };
            } catch { return { count: 0, bytes: 0, kb: 0, mb: 0 } };
        }

        function MonthGrid({ year, month, onPrev, onNext, onDateClick, selectedDate, hasDots, getDotColor, compact }) {
