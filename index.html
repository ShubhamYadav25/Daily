            '#f472b6', '#60a5fa', '#fbbf24'
        ];
        const TEXT_COLOR_PRESETS = ['#f76f6f', '#fb923c', '#f7c35a', '#3ecf8e', '#4f8ef7', '#a78bfa', '#f472b6', '#e8e9eb'];
        const FONT_FAMILIES = {
            sans: "'DM Sans',sans-serif", mono: "'DM Mono',monospace", serif: "Georgia,'Times New Roman',serif",
            cursive: "'Comic Sans MS',cursive"
        };
        const DEFAULT_COLS = [
            { id: 'TODO', label: 'Todo', color: '#4f8ef7', locked: false },
            { id: 'INPROG', label: 'In Progress', color: '#f7c35a', locked: false },
            { id: 'DISCUSS', label: 'Discussion', color: '#a78bfa', locked: false },
            { id: 'DONE', label: 'Done', color: '#3ecf8e', locked: false },
        ];
        const AI_SERVICES = [
            { name: 'ChatGPT', url: 'https://chat.openai.com', icon: '🤖', color: '#10a37f' },
            { name: 'Claude', url: 'https://claude.ai', icon: '🧠', color: '#cc785c' },
            { name: 'Gemini', url: 'https://gemini.google.com', icon: '✨', color: '#4285f4' },
            { name: 'Perplexity', url: 'https://www.perplexity.ai', icon: '🔍', color: '#5a4fcf' },
            { name: 'Grok', url: 'https://grok.x.ai', icon: '⚡', color: '#1d9bf0' },
            { name: 'Mistral', url: 'https://chat.mistral.ai', icon: '🌊', color: '#ff7000' },
            { name: 'Copilot', url: 'https://copilot.microsoft.com', icon: '🪟', color: '#0078d4' },
            { name: 'DeepSeek', url: 'https://chat.deepseek.com', icon: '🐳', color: '#4d6bfe' },
        ];

        /* ══════════════════════════════════════════════════════════
   OP-LOG SYNC ENGINE — never loses data
   ══════════════════════════════════════════════════════════ */
        const SYNC = (() => {
            let PEER = localStorage.getItem('daily_peer');
            if (!PEER) {
                PEER = 'p' + Math.random().toString(36).slice(2, 10);
                localStorage.setItem('daily_peer', PEER);
            }

            let log = [];                 // [{id,e,eid,f,v,ts,p}]
            let seen = new Set();         // op ids we've applied
            let state = {};               // state[e][eid][f] = {v,ts,p}
            let counter = 0;

            function load() {
                try {
                    const raw = localStorage.getItem('daily_oplog');
                    if (!raw) return;
                    const p = JSON.parse(raw);
                    log = p.log || [];
                    log.forEach(o => seen.add(o.id));
                    state = p.state || {};
                    counter = p.counter || 0;
                } catch (e) { console.warn('oplog load', e); }
            }

            function save() {
                try {
                    if (log.length > 6000) log = log.slice(-6000);
                    localStorage.setItem('daily_oplog', JSON.stringify({ log, state, counter }));
                } catch (e) { console.warn('oplog save', e); }
            }

            function makeOp(e, eid, f, v) {
                counter++;
                const ts = Date.now();
                return { id: PEER + ':' + counter.toString(36) + ':' + ts.toString(36), e, eid, f, v, ts, p: PEER };
            }

            // Apply one op. LWW per field. Returns true if anything changed.
            function applyOp(op) {
                if (seen.has(op.id)) return false;
                seen.add(op.id);
                log.push(op);

                const bucket = (state[op.e] = state[op.e] || {});
                const rec = (bucket[op.eid] = bucket[op.eid] || {});
                const cur = rec[op.f];

                const wins = !cur || op.ts > cur.ts || (op.ts === cur.ts && op.p > cur.p);
                if (wins) {
                    rec[op.f] = { v: op.v, ts: op.ts, p: op.p };

            function mutateMany(changes) {

                (remote || []).forEach(op => {

                    accepted.push(op);

                });
                if (accepted.length) save();

            // Derive {cols, cards} from state for rendering.
            function materialize() {
                const cols = [], cards = {};

                Object.entries(state.column || {}).forEach(([id, f]) => {
                    if (f.__del__?.v) return;
                    cols.push({
                        id,
                        label: f.label?.v ?? 'Untitled',
                        color: f.color?.v ?? '#4f8ef7',
                        locked: f.locked?.v ?? false,
                        _pos: f.pos?.v ?? 0,
                    });
                });
                cols.sort((a, b) => a._pos - b._pos);
                cols.forEach(c => delete c._pos);

                Object.entries(state.card || {}).forEach(([id, f]) => {
                    if (f.__del__?.v) return;
                    const colId = f.column?.v;
                    if (!colId) return;
                    (cards[colId] = cards[colId] || []).push({
                        id,
                        task: f.task?.v ?? '',
                        priority: f.priority?.v ?? 'None',
                        content: f.content?.v ?? '',
                        color: f.color?.v ?? '',

                });

                    if (f.__del__?.v) return;

            function bootstrapOps(cols, cards) {

                        ops.push({ e: 'card', eid: c.id, f: 'column', v: colId });
                        ops.push({ e: 'card', eid: c.id, f: 'priority', v: c.priority || 'None' });
                        ops.push({ e: 'card', eid: c.id, f: 'content', v: c.content || '' });
                        ops.push({ e: 'card', eid: c.id, f: 'color', v: c.color || '' });
                        ops.push({ e: 'card', eid: c.id, f: 'createdAt', v: c.createdAt || new Date().toISOString() });
                        ops.push({ e: 'card', eid: c.id, f: 'pos', v: i });

        const AlarmCtx = { ctx: null, playing: false };

        function playAlarmSound() {
            try {
                if (AlarmCtx.playing) return;
                AlarmCtx.playing = true;
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                AlarmCtx.ctx = ctx;
                const notes = [523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 523.25];
                let t = ctx.currentTime;
                notes.forEach((freq, i) => {
                    for (let r = 0; r < 3; r++) {
                        const osc = ctx.createOscillator(),
                            gain = ctx.createGain();
                        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0, t);
                        gain.gain.linearRampToValueAtTime(0.15, t + 0.03);
                        gain.gain.linearRampToValueAtTime(0, t + 0.18);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(t);
                        osc.stop(t + 0.2);
                        t += 0.2;
                    }
                    t += 0.1;
                });
                setTimeout(() => { AlarmCtx.playing = false; try { ctx.close(); } catch { } }, 5000);
            } catch { AlarmCtx.playing = false; }
        }

        function daysDiff(iso) { if (!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 864e5); }

        function fmtAge(iso, now) {
            if (!iso) return 'just now';
            const ms = (now || Date.now()) - new Date(iso).getTime();
            const m = Math.floor(ms / 6e4),
                h = Math.floor(ms / 36e5),
                d = Math.floor(ms / 864e5),
                w = Math.floor(d / 7),
                mo = Math.floor(d / 30);
            if (m < 1) return 'just now';
            if (m < 60) return m + 'm ago';
            if (h < 24) return h + 'h ago';
            if (d === 1) return '1d ago';
            if (d < 7) return d + 'd ago';
            if (w < 5) return w + 'w ago';
            return mo + 'mo ago';
        }

        /* ── IMAGE COMPRESS ── */
        async function compressImage(src) {
            return new Promise(res => {
                const img = new Image();
                const isFile = src instanceof File;
                const url = isFile ? URL.createObjectURL(src) : src;
                img.onload = () => {
                    const MAX = 1200,
                        scale = Math.min(1, MAX / Math.max(img.width, img.height));
                    const w = Math.round(img.width * scale),
                        h = Math.round(img.height * scale);
                    const c = document.createElement('canvas');
                    c.width = w;
                    c.height = h;
                    c.getContext('2d').drawImage(img, 0, 0, w, h);
                    let out = c.toDataURL('image/webp', 0.82);
                    if (out.length < 50 || out.startsWith('data:image/png')) out = c.toDataURL('image/jpeg', 0.82);
                    if (isFile) URL.revokeObjectURL(url);
                    res(out);
                };
                img.src = url;
            });
        }

        function escH(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') }

        /* ── KATEX MATH RENDERER ── */
        const KATEX_MACROS = {
            '\\RR': '\\mathbb{R}',
            '\\NN': '\\mathbb{N}',
            '\\ZZ': '\\mathbb{Z}',
            '\\QQ': '\\mathbb{Q}',
            '\\CC': '\\mathbb{C}',
            '\\dd': '\\mathrm{d}',
            '\\abs': '\\left|#1\\right|',
            '\\norm': '\\left\\|#1\\right\\|'
        };

        function renderMathHTML(expr, display) {
            const kx = window.katex;
            if (!kx) {
                return display
                    ? '<div class="math-error" title="KaTeX not loaded">' + escH(expr) + '</div>'
                    : '<code class="math-error">' + escH(expr) + '</code>';
            }
            try {
                return kx.renderToString(expr, {
                    displayMode: !!display,
                    throwOnError: false,
                    output: 'html',
                    strict: false,
                    trust: true,
                    macros: KATEX_MACROS
                });
            } catch (e) {
                return display
                    ? '<div class="math-error">' + escH(expr) + '</div>'
                    : '<code class="math-error">' + escH(expr) + '</code>';
            }
        }

        function extractMathBlocks(text) {
            const mathBlocks = [];
            const PH = '\uE000';
            const PH_END = '\uE001';

            const segments = [];
            let lastIndex = 0;
            const codeRegex = /```[\s\S]*?```|`[^`\n]+`/g;
            let match;
            while ((match = codeRegex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    segments.push({ isCode: false, content: text.slice(lastIndex, match.index) });
                }
                segments.push({ isCode: true, content: match[0] });
                lastIndex = match.index + match[0].length;
            }
            if (lastIndex < text.length) {
                segments.push({ isCode: false, content: text.slice(lastIndex) });
            }
            if (segments.length === 0) {
                segments.push({ isCode: false, content: text });
            }

            const processedText = segments.map(seg => {
                if (seg.isCode) return seg.content;
                let s = seg.content;
                // block math $$...$$
                s = s.replace(/\$\$([\s\S]+?)\$\$/g, (m, inner) => {
                    const i = mathBlocks.length;
                    mathBlocks.push({ display: true, expr: inner.trim() });
                    return PH + 'M' + i + PH_END;
                });
                // display \[...\]
                s = s.replace(/\\\[([\s\S]+?)\\\]/g, (m, inner) => {
                    const i = mathBlocks.length;
                    mathBlocks.push({ display: true, expr: inner.trim() });
                    return PH + 'M' + i + PH_END;
                });
                // inline $...$
                s = s.replace(/(?<!\\)\$(?!\s)([^\$\n]*?)(?<!\s)(?<!\\)\$/g, (m, inner) => {
                    const i = mathBlocks.length;
                    mathBlocks.push({ display: false, expr: inner.trim() });
                    return PH + 'M' + i + PH_END;
                });
                // inline \(...\)
                s = s.replace(/\\\(([\s\S]+?)\\\)/g, (m, inner) => {
                    const i = mathBlocks.length;
                    mathBlocks.push({ display: false, expr: inner.trim() });
                    return PH + 'M' + i + PH_END;
                });
                return s;
            }).join('');

            return { text: processedText, mathBlocks, PH, PH_END };
        }

        function restoreMath(html, mathBlocks, PH, PH_END) {
            if (!mathBlocks.length) return html;
            const phRegex = new RegExp(PH + 'M(\\d+)' + PH_END, 'g');

                const block = mathBlocks[+i];

        function inlineRender(s) {

                .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')

            while (i < lines.length && isListLine(lines[i]) && getIndent(lines[i]) === indent) {
                const m = lines[i].match(/^ *(?:[-*+]|\d+\.)\s(.*)$/);
                let itemContent = inlineRender(m ? m[1] : '');

                        const li = i;
                        items.push(
                            `<li class="task-item${done ? ' done' : ''}" data-toggle-line="${li}"><span class="cb">${iconHTML(done ? 'SquareCheck' : 'Square')}</span><span class="task-text">${inlineRender(lines[i].replace(/^\[[ x]\]\s/, ''))}</span></li>`
                        );
                        i++;
                    } out.push(`<ul class="task-list">${items.join('')}</ul>`);
                    continue;
                }
                if (isListLine(line)) {
                    const r = parseList(lines, i, getIndent(line));
                    out.push(r.html);
                    i = r.next; continue;
                }
                if (!line.trim()) {
                    out.push('<div class="md-spacer"></div>');
                    i++; continue;
                }
                const para = [line];
                while (i + 1 < lines.length && lines[i + 1].trim() && !/^(#{1,3}\s|[-*+]\s|\d+\.\s|> |\[[ x]\]|```|---|___|\*\*\*|!\[)/
                    .test(lines[i + 1]) && !(lines[i + 1].includes('|') && i + 2 <= lines.length && tableSep.test(lines[
                        i + 2] || ''))) {
                    i++;
                    para.push(lines[i]);
                }
                out.push(`<p>${para.map(inlineRender).join('<br/>')}</p>`);
                i++;
            }
            let result = out.join('');
            result = restoreMath(result, mathBlocks, PH, PH_END);
            return result;
        }

        function fitPanel(size) {
            const viewport = window.visualViewport;
            const width = viewport ? viewport.width : window.innerWidth;
            const height = viewport ? viewport.height : window.innerHeight;
            const top = Math.min(60, height / 4);
            const w = Math.min(size.w, Math.max(0, width - 16));
            const h = Math.min(size.h, Math.max(0, height - top - 8));
            return {
                w, h,
                x: Math.max(8, Math.min(size.x, width - w - 8)),
                y: Math.max(top, Math.min(size.y, height - h - 8))
            };
        }

        function useResize(initW, initH, initX, initY, minHeight = 180) {
            const [preferredSize, updateSz] = useState({ w: initW, h: initH, x: initX, y: initY });
            const [, updateViewport] = useState(0);
            useEffect(() => {
                const resize = () => updateViewport(version => version + 1);
                window.addEventListener('resize', resize);
                window.visualViewport?.addEventListener('resize', resize);
                return () => {
                    window.removeEventListener('resize', resize);
                    window.visualViewport?.removeEventListener('resize', resize);
                };
            }, []);
            const setSz = useCallback(value => updateSz(previous => {
                const next = typeof value === 'function' ? value(previous) : value;
                return Object.keys(next).every(key => next[key] === previous[key]) ? previous : next;
            }), []);
            const sz = fitPanel({ ...preferredSize, w: Math.max(300, preferredSize.w), h: Math.max(minHeight, preferredSize.h) });
            const drag = useRef(null);

            useEffect(() => () => drag.current?.cleanup(), []);

            function startResize(dir, e) {
                if (e.button !== 0 || e.isPrimary === false) return;
                e.preventDefault();
                e.stopPropagation();
                const start = { dir, startX: e.clientX, startY: e.clientY, pointerId: e.pointerId, ...sz };
                const limits = fitPanel({ x: 8, y: 60, w: window.innerWidth, h: window.innerHeight });
                const minW = Math.min(300, limits.w);
                const minH = Math.min(minHeight, limits.h);

                function onMove(ev) {
                    if (ev.pointerId !== start.pointerId) return;
                    const { dir: d, startX, startY, w, h, x, y } = start;
                    const dx = ev.clientX - startX,
                        dy = ev.clientY - startY;
                    let left = x, top = y, right = x + w, bottom = y + h;
                    if (d.includes('e')) right = Math.min(limits.x + limits.w, Math.max(x + minW, right + dx));
                    if (d.includes('s')) bottom = Math.min(limits.y + limits.h, Math.max(y + minH, bottom + dy));
                    if (d.includes('w')) left = Math.max(limits.x, Math.min(right - minW, x + dx));
                    if (d.includes('n')) top = Math.max(limits.y, Math.min(bottom - minH, y + dy));
                    setSz({ x: left, y: top, w: right - left, h: bottom - top });
                }

                function onUp() {
                    drag.current = null;
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    window.removeEventListener('pointercancel', onUp);
                    window.removeEventListener('blur', onUp);
                }
                drag.current = { cleanup: onUp };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
                window.addEventListener('pointercancel', onUp);
                window.addEventListener('blur', onUp);
            }
            return { sz, preferredSize, setSz, startResize };
        }

        /* ── MD EDITOR ── */
        function MdEditor({ value, onChange, fill = false }) {
            const ta = useRef();
            const mobile = useIsMobile();
            const [mode, setMode] = useState('write');
            const [edH, setEdH] = useState(isMobile() ? 160 : 220);
            const resizing = useRef(false);
            const resizeStart = useRef(null);
            const [showFontMenu, setShowFontMenu] = useState(false);
            const [showColorMenu, setShowColorMenu] = useState(false);
            const extraToolsRef = useRef();
            const menuRef = useRef();
            const [menuPosition, setMenuPosition] = useState({ left: 8, top: 8 });
            const historyRef = useRef({ stack: [value], idx: 0 });
            const historyTimer = useRef(null);

            useEffect(() => {
                function onDoc(e) {
                    if (extraToolsRef.current && !extraToolsRef.current.contains(e.target) && !menuRef.current?.contains(e.target)) {
                        setShowFontMenu(
                            false);
                        setShowColorMenu(false);
                    }
                }
                document.addEventListener('pointerdown', onDoc);
                return () => document.removeEventListener('pointerdown', onDoc);
            }, []);

            function positionMenu(event, width, height) {
                const rect = event.currentTarget.getBoundingClientRect();
                setMenuPosition({
                    left: Math.max(8, Math.min(rect.left, window.innerWidth - width - 8)),
                    top: Math.max(8, Math.min(rect.bottom + 6, window.innerHeight - height - 8))
                });
            }

            function renderMenu(menu) {
                return fill ? ReactDOM.createPortal(menu, document.body) : menu;
            }

            function pushHistory(v) {
                const h = historyRef.current;
                if (h.stack[h.idx] === v) return;
                h.stack = h.stack.slice(0, h.idx + 1).concat(v).slice(-100);
                h.idx = h.stack.length - 1;
            }

            function applyFmt(type) {
                const el = ta.current;
                if (!el) return;
                const s = el.selectionStart,
                    e = el.selectionEnd;
                const sel = value.slice(s, e),
                    pre = value.slice(0, s),
                    post = value.slice(e);
                let nv, ns, ne;
                const lineStart = value.lastIndexOf('\n', s - 1) + 1;
                switch (type) {
                    case 'bold':
                        nv = pre + '**' + sel + '**' + post;
                        ns = s + 2;
                        ne = e + 2;
                        break;
                    case 'italic':
                        nv = pre + '*' + sel + '*' + post;
                        ns = s + 1;
                        ne = e + 1;
                        break;
                    case 'strike':
                        nv = pre + '~~' + sel + '~~' + post;
                        ns = s + 2;
                        ne = e + 2;
                        break;
                    case 'code':
                        nv = pre + '`' + sel + '`' + post;
                        ns = s + 1;
                        ne = e + 1;
                        break;
                    case 'highlight':
                        nv = pre + '==' + sel + '==' + post;
                        ns = s + 2;
                        ne = e + 2;
                        break;
                    case 'table': {
                        const tbl = '\n| Header 1 | Header 2 | Header 3 |\n| --- | --- | --- |\n| Cell | Cell | Cell |\n';
                        nv = pre + tbl + post;
                        ns = ne = s + tbl.length; break;
                    }
                    case 'codeblock': {
                        const c = '```\n' + (sel || 'code') + '\n```';
                        nv = pre + c + post;
                        ns = s + 4;
                        ne = s + 4 + (sel || 'code').length; break;
                    }
                    case 'h1':
                        nv = value.slice(0, lineStart) + '# ' + value.slice(lineStart);
                        ns = s + 2;
                        ne = e + 2;
                        break;
                    case 'h2':
                        nv = value.slice(0, lineStart) + '## ' + value.slice(lineStart);
                        ns = s + 3;
                        ne = e + 3;
                        break;
                    case 'h3':
                        nv = value.slice(0, lineStart) + '### ' + value.slice(lineStart);
                        ns = s + 4;
                        ne = e + 4;
                        break;
                    case 'quote':
                        nv = value.slice(0, lineStart) + '> ' + value.slice(lineStart);
                        ns = s + 2;
                        ne = e + 2;
                        break;
                    case 'ul':
                        nv = value.slice(0, lineStart) + '- ' + value.slice(lineStart);
                        ns = s + 2;
                        ne = e + 2;
                        break;
                    case 'ol':
                        nv = value.slice(0, lineStart) + '1. ' + value.slice(lineStart);
                        ns = s + 3;
                        ne = e + 3;
                        break;
                    case 'check':
                        nv = value.slice(0, lineStart) + '[ ] ' + value.slice(lineStart);
                        ns = s + 4;
                        ne = e + 4;
                        break;
                    case 'hr':
                        nv = pre + '\n---\n' + post;
                        ns = ne = s + 5;
                        break;
                    case 'link': {
                        const p = sel || 'link text';
                        nv = pre + '[' + p + '](url)' + post;
                        ns = s + 1;
                        ne = s + 1 + p.length; break;
                    }
                    case 'blocker': {
                        const b = '## BLOCKER\n' + (sel || 'Describe blocker') + '\n';
                        nv = pre + b + post;
                        ns = s + 11;
                        ne = s + 11 + (sel || 'Describe blocker').length; break;
                    }
                    case 'json': {
                        const res = formatJSON(el); if (!res) return alert('No valid JSON found'); if (res.full)
                            onChange('```json\n' + res.result + '\n```');
                        else onChange(value.slice(0, res.start) + res.result + value.slice(res.end)); return;
                    }
                    case 'inline_math': {
                        const m = sel || 'E = mc^2';
                        nv = pre + '$' + m + '$' + post;
                        ns = s + 1;
                        ne = s + 1 + m.length;
                        break;
                    }
                    case 'block_math': {
                        const m = sel || '\\int_0^\\infty e^{-x^2} dx = \\frac{\\sqrt{\\pi}}{2}';
                        const wrapped = '\n$$\n' + m + '\n$$\n';
                        nv = pre + wrapped + post;
                        ns = s + 4;
                        ne = s + 4 + m.length;
                        break;
                    }
                    case 'image': {
                        const inp = document.createElement('input');
                        inp.type = 'file';
                        inp.accept = 'image/*';
                        inp.onchange = async ev => {
                            const f = ev.target.files[0]; if (!f) return; const data =
                                await compressImage(f); const tag = `\n![image](${data})\n`;
                            onChange(value.slice(0, s) + tag + value.slice(e));
                        };
                        inp.click(); return;
                    }
                    default: return;
                }
                pushHistory(nv);
                onChange(nv);
                setTimeout(() => {
                    if (el) {
                        el.selectionStart = ns;
                        el.selectionEnd = ne;
                        el.focus();
                    }
                }, 0);
            }

            function applyColor(hex) {
                const el = ta.current;
                if (!el) return;
                const s = el.selectionStart,
                    e = el.selectionEnd;
                const sel = value.slice(s, e) || 'colored text';
                const wrapped = `{color:${hex}}${sel}{/color}`;
                const nv = value.slice(0, s) + wrapped + value.slice(e);
                pushHistory(nv);
                onChange(nv);
                setTimeout(() => {
                    if (el) {
                        el.selectionStart = s;
                        el.selectionEnd = s + wrapped.length;
                        el.focus();
                    }
                }, 0);
            }

            function applyFont(name) {
                const el = ta.current;
                if (!el) return;
                const s = el.selectionStart,
                    e = el.selectionEnd;
                const sel = value.slice(s, e) || 'styled text';
                const wrapped = `{font:${name}}${sel}{/font}`;
                const nv = value.slice(0, s) + wrapped + value.slice(e);
                pushHistory(nv);
                onChange(nv);
                setTimeout(() => {
                    if (el) {
                        el.selectionStart = s;
                        el.selectionEnd = s + wrapped.length;
                        el.focus();
                    }
                }, 0);
            }

            function onKD(e) {
                const el = e.target;
                const s = el.selectionStart;
                const ctrl = e.ctrlKey || e.metaKey;
                if (ctrl && !e.shiftKey && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    const h = historyRef.current;
                    if (h.stack[h.idx] !== value) pushHistory(value);
                    if (h.idx > 0) {
                        h.idx--;
                        onChange(h.stack[h.idx]);
                    }
                    return;
                }
                if (ctrl && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
                    e.preventDefault();
                    const h = historyRef.current;
                    if (h.idx < h.stack.length - 1) {
                        h.idx++;
                        onChange(h.stack[h.idx]);
                    }
                    return;
                }
                if (ctrl && !e.shiftKey) {
                    const k = e.key.toLowerCase();
                    if (k === 'b') {
                        e.preventDefault();
                        applyFmt('bold'); return;
                    }
                    if (k === 'i') {
                        e.preventDefault();
                        applyFmt('italic'); return;
                    }
                    if (k === 'k') {
                        e.preventDefault();
                        applyFmt('link'); return;
                    }
                }
                if (ctrl && e.key.toLowerCase() === 'm') {
                    e.preventDefault();
                    applyFmt(e.shiftKey ? 'block_math' : 'inline_math');
                    return;
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const nv = value.slice(0, s) + '  ' + value.slice(el.selectionEnd);
                    pushHistory(nv);
                    onChange(nv);
                    setTimeout(() => { el.selectionStart = el.selectionEnd = s + 2; }, 0); return;
                }
                if (e.key === 'Enter') {
                    const lineStart = value.lastIndexOf('\n', s - 1) + 1;
                    const line = value.slice(lineStart, s);
                    const um = line.match(/^(\s*)([-*+])\s(.+)/),
                        om = line.match(/^(\s*)(\d+)\.\s(.+)/),
                        cm = line.match(/^(\s*)\[[ x]\]\s(.+)/);
                    if (um) {
                        e.preventDefault();
                        const ins = '\n' + um[1] + um[2] + ' ';
                        const nv = value.slice(0, s) + ins + value.slice(s);
                        pushHistory(nv);
                        onChange(nv);
                        setTimeout(() => { el.selectionStart = el.selectionEnd = s + ins.length; }, 0);
                    } else if (om) {
                        e.preventDefault();
                        const ins = '\n' + om[1] + (parseInt(om[2]) + 1) + '. ';
                        const nv = value.slice(0, s) + ins + value.slice(s);
                        pushHistory(nv);
                        onChange(nv);
                        setTimeout(() => { el.selectionStart = el.selectionEnd = s + ins.length; }, 0);
                    } else if (cm) {
                        e.preventDefault();
                        const ins = '\n' + cm[1] + '[ ] ';
                        const nv = value.slice(0, s) + ins + value.slice(s);
                        pushHistory(nv);
                        onChange(nv);
                        setTimeout(() => { el.selectionStart = el.selectionEnd = s + ins.length; }, 0);
                    }
                }
            }

            function onPaste(e) {
                const items = e.clipboardData?.items;
                if (!items) return;
                for (const item of items) {
                    if (item.type.startsWith('image/')) {
                        e.preventDefault();
                        const f = item.getAsFile();
                        if (!f) return;
                        compressImage(f).then(data => {
                            const el = ta.current; if (!el) return; const s = el
                                .selectionStart,
                                e2 = el.selectionEnd; const nv = value.slice(0, s) + `\n![image](${data})\n` + value
                                    .slice(e2);
                            pushHistory(nv);
                            onChange(nv);
                        });
                        break;
                    }
                }
            }

            function startVResize(e) {
                resizing.current = true;
                resizeStart.current = { y: e.clientY, h: edH };
                const onMove = ev => {
                    if (!resizing.current) return;
                    setEdH(Math.max(80, Math.min(600, resizeStart.current.h + (ev.clientY - resizeStart.current
                        .y))));
                };
                const onUp = () => {
                    resizing.current = false;
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                e.preventDefault();
            }

            const TOOLS_DESKTOP = [
                {
                    g: 'fmt', items: [{ id: 'bold', l: 'B', tip: 'Bold', st: { fontWeight: 700 } }, {
                        id: 'italic',
                        l: 'I', tip: 'Italic', st: { fontStyle: 'italic' }
                    }, {
                        id: 'strike', l: 'S̶',
                        tip: 'Strike'
                    }, { id: 'code', l: '`', tip: 'Code' }]
                },
                {
                    g: 'math', items: [
                        { id: 'inline_math', l: '∑', tip: 'Inline math ($...$)', math: true },
                        { id: 'block_math', l: '∫', tip: 'Block math ($$...$$)', math: true }
                    ]
                },
                {
                    g: 'hd', items: [{ id: 'h1', l: 'H1', tip: 'H1' }, { id: 'h2', l: 'H2', tip: 'H2' }, {
                        id: 'h3',
                        l: 'H3', tip: 'H3'
                    }]
                },

                {
                    g: 'blk', items: [{ id: 'ul', l: '•', tip: 'Bullet' }, { id: 'ol', l: '1.', tip: 'List' },
                    { id: 'check', l: '☐', tip: 'Task' }, { id: 'quote', l: '❝', tip: 'Quote' },
                    { id: 'codeblock', l: '</>', tip: 'Code block' }, { id: 'hr', l: '—', tip: 'HR' },
                    { id: 'link', l: '🔗', tip: 'Link' }, { id: 'table', l: '▦', tip: 'Table' }]
                },
                {
                    g: 'sp', items: [{ id: 'blocker', l: '🚫', tip: 'Blocker', sp: true }, {
                        id: 'highlight',
                        l: '🖍', tip: 'Highlight'
                    }, { id: 'json', l: '{}', tip: 'Format JSON', sj: true },
                    { id: 'image', l: '🖼', tip: 'Image' }]
                },
            ];
            const TOOLS_MOBILE = [
                {
                    g: 'fmt', items: [{ id: 'bold', l: 'B', tip: 'Bold', st: { fontWeight: 700 } }, {
                        id: 'italic',
                        l: 'I', tip: 'Italic', st: { fontStyle: 'italic' }
                    }, {
                        id: 'code', l: '`',
                        tip: 'Code'
                    }]
                },
                {
                    g: 'math', items: [
                        { id: 'inline_math', l: '∑', tip: 'Inline math ($...$)', math: true },
                        { id: 'block_math', l: '∫', tip: 'Block math ($$...$$)', math: true }
                    ]
                },
                {
                    g: 'blk', items: [{ id: 'ul', l: '•', tip: 'Bullet' }, { id: 'check', l: '☐', tip: 'Task' },
                    { id: 'highlight', l: '🖍', tip: 'Highlight' }, {
                        id: 'blocker', l: '🚫', tip: 'Blocker',
                        sp: true
                    }, { id: 'image', l: '🖼', tip: 'Image' }]
                },
            ];
            const TOOLS = mobile ? TOOLS_MOBILE : TOOLS_DESKTOP;

            return (
                <div className={fill ? 'scratch-editor' : undefined} style={{
                    display: 'flex', flexDirection: 'column', border: '1px solid var(--border)',
                    borderRadius: fill ? 0 : 10, overflow: 'hidden',
                    ...(fill ? { flex: 1, minHeight: 0, border: 'none' } : {})
                }}>
                    <div className="md-editor-toolbar" style={{
                        display: 'flex', alignItems: 'center', flexWrap: 'wrap', background: 'var(--bg4)',
                        borderBottom: '1px solid var(--border)', padding: '4px 6px', gap: 2, rowGap: 3,
                        flexShrink: 0
                    }}>
                        {TOOLS.map((g, gi) => (
                            <React.Fragment key={g.g}>
                                {gi > 0 && <div style={{
                                    width: 1, height: 14, background: 'var(--border2)',
                                    margin: '0 3px', flexShrink: 0
                                }} />}
                                {g.items.map(t => (
                                    <button key={t.id} title={t.tip}
                                        style={{
                                            padding: '3px 7px', borderRadius: 5, fontSize: 11,
                                            fontWeight: 700, fontFamily: "'DM Mono',monospace",
                                            cursor: 'pointer', lineHeight: 1.5, color: t.sp ?
                                                'var(--red)' : t.sj ? 'var(--amber)' :
                                                    'var(--text2)', background: t.sp ?
                                                        'var(--red-dim)' : t.sj ?
                                                            'var(--amber-dim)' : 'transparent',
                                            border: t.sp ? '1px solid rgba(247,111,111,.3)' : t.sj ?
                                                '1px solid rgba(247,195,90,.3)' : 'none', ...(t.st ||
                                                    {})
                                        }}
                                        onMouseDown={ev => ev.preventDefault()}
                                        onClick={() => applyFmt(t.id)} aria-label={t.tip}>
                                        <Icon name={EDITOR_ICONS[t.id]} />
                                    </button>
                                ))}
                            </React.Fragment>
                        ))}
                        <div ref={extraToolsRef} style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                            <div style={{
                                width: 1, height: 14, background: 'var(--border2)', margin: '0 3px',
                                flexShrink: 0
                            }} />
                            <div style={{ position: 'relative' }}>
                                <button title="Text color" style={{
                                    padding: '3px 7px', borderRadius: 5,
                                    fontSize: 13, cursor: 'pointer', color: 'var(--text2)',
                                    background: showColorMenu ? 'var(--bg3)' : 'transparent',
                                    border: 'none', lineHeight: 1.5
                                }}
                                    onMouseDown={ev => ev.preventDefault()} onClick={ev => {
                                        positionMenu(ev, 250, 48);
                                        setShowColorMenu(v => !v);
                                        setShowFontMenu(false);
                                    }} aria-label="Text color"><Icon name="Palette" size="1em" /></button>
                                {showColorMenu && renderMenu(
                                    <div ref={menuRef} style={{
                                        position: fill ? 'fixed' : 'absolute', top: fill ? menuPosition.top : 'calc(100% + 4px)', right: fill ? 'auto' : 0,
                                        left: fill ? menuPosition.left : 'auto', background: 'var(--bg2)',
                                        border: '1px solid var(--border2)', borderRadius: 8,
                                        padding: 7, display: 'flex', gap: 6, zIndex: 500,
                                        boxShadow: 'var(--shadow)'
                                    }}>
                                        {TEXT_COLOR_PRESETS.map(c => (
                                            <button key={c} type="button" title={c} aria-label={'Text color ' + c}
                                                onMouseDown={ev => ev.preventDefault()} onClick={() => {
                                                applyColor(c);
                                                setShowColorMenu(false);
                                            }}
                                                style={{
                                                    width: 24, height: 24, padding: 0, flexShrink: 0,
                                                    borderRadius: '50%', background: c,
                                                    cursor: 'pointer',
                                                    border: '1px solid var(--border2)'
                                                }} />
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div style={{ position: 'relative' }}>
                                <button title="Font" style={{
                                    padding: '3px 7px', borderRadius: 5,
                                    fontSize: 11, fontWeight: 700, cursor: 'pointer',
                                    color: 'var(--text2)', background: showFontMenu ?
                                        'var(--bg3)' : 'transparent', border: 'none',
                                    lineHeight: 1.5
                                }}
                                    onMouseDown={ev => ev.preventDefault()} onClick={ev => {
                                        positionMenu(ev, 140, 160);
                                        setShowFontMenu(v => !v);
                                        setShowColorMenu(false);
                                    }} aria-label="Font"><Icon name="Type" /></button>
                                {showFontMenu && renderMenu(
                                    <div ref={menuRef} style={{
                                        position: fill ? 'fixed' : 'absolute', top: fill ? menuPosition.top : 'calc(100% + 4px)',
                                        right: fill ? 'auto' : 0, left: fill ? menuPosition.left : 'auto', background: 'var(--bg2)',
                                        border: '1px solid var(--border2)',
                                        borderRadius: 8, padding: 5, display: 'flex',
                                        flexDirection: 'column', gap: 2, zIndex: 500,

                    <div className="md-editor-body" style={{

        }

        /* ── INTERACTIVE MD VIEW ── */
        function MdView({ value, onChange, imageSizes, onImageResize }) {
            const ref = useRef();
            useEffect(() => {
                const el = ref.current;
                if (!el) return;

                function onClick(e) {
                    const ti = e.target.closest('[data-toggle-line]'); if (ti) {
                        const li =
                            parseInt(ti.dataset.toggleLine); const lines = value.split('\n'); if (li >= lines
                                .length) return; const ln = lines[li]; if (/^\[ \]\s/.test(ln)) lines[li] = ln
                                    .replace('[ ]', '[x]');
                        else if (/^\[x\]\s/.test(ln)) lines[li] = ln.replace('[x]', '[ ]');
                        onChange(lines.join('\n'));
                    }
                }
                el.addEventListener('click', onClick);
                return () => el.removeEventListener('click', onClick);
            }, [value, onChange]);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                let resizing = null;

                function onDown(e) {
                    const handle = e.target.closest('.resize-handle'); if (!handle) return;
                    e.preventDefault();
                    e.stopPropagation(); const imgId = handle.dataset.imgId; const container = handle
                        .closest('.resizable-img-container'); if (!container) return; const startX = e
                            .clientX; const startW = container.offsetWidth; resizing = {
                                imgId, startX, startW,
                                container
                            };

                    function onMove(ev) {
                        if (!resizing) return; const dx = ev.clientX - resizing.startX;
                        const newW = Math.max(50, resizing.startW + dx);
                        resizing.container.style.width = newW + 'px';
                    }

                    function onUp() {
                        if (resizing) {
                            const finalW = resizing.container.offsetWidth;
                            onImageResize(resizing.imgId, finalW);
                        } resizing = null;
                        window.removeEventListener('mousemove', onMove);
                        window.removeEventListener('mouseup', onUp);
                    }
                    window.addEventListener('mousemove', onMove);
                    window.addEventListener('mouseup', onUp);
                }
                el.addEventListener('mousedown', onDown);
                return () => el.removeEventListener('mousedown', onDown);
            }, [onImageResize]);
            if (!value) return <div style={{
                textAlign: 'center', padding: '32px 0', color: 'var(--text3)',
                fontSize: 13
            }}><div style={{ fontSize: 28, marginBottom: 8 }}><Icon name="NotebookPen" size="1em" /></div><div>No notes yet</div></div>;
            return <div ref={ref} className="md-render" dangerouslySetInnerHTML={{
                __html: renderMd(value, true,
                    imageSizes)
            }} />;
        }

        /* ── CARD COLOR PICKER ── */
        function CardColorPicker({ color, onChange }) {
            return (
                <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
                    {CARD_COLORS.map(c => (<div key={c || 'none'} title={c || 'No color'} className={`color-dot${(color || '') === (c || '') ? 'sel' : ''} ${!c ? 'none-dot' : ''}`} style={{
                        background: c || 'transparent', width: 20,
                        height: 20
                    }} onClick={() => onChange(c)} />))}
                </div>
            );
        }

        /* ── TIMER WIDGET ── */
        function TimerWidgetInline({ timer, onSet, onClear, onStart, onStop }) {
            const [showSet, setShowSet] = useState(false);
            const [mins, setMins] = useState('25');
            if (showSet) return (<div style={{ display: 'flex', alignItems: 'center', gap: 4 }} onClick={e => e
                .stopPropagation()}><input value={mins} onChange={e => setMins(e.target.value.replace(/\D/g,
                    ''))} style={{
                        width: 44, background: 'var(--bg3)', border: '1px solid var(--blue)',
                        borderRadius: 5, padding: '3px 6px', fontSize: 12, color: 'var(--text)',
                        outline: 'none'
                    }} placeholder="min" autoFocus onKeyDown={e => {
                        if (e.key === 'Enter') {
                            onSet(parseInt(mins) || 25);
                            setShowSet(false);
                        } if (e.key === 'Escape') setShowSet(false);
                    }} /><button style={{
                        fontSize: 11,
                        padding: '3px 7px', borderRadius: 4, background: 'var(--blue)', color: '#fff',
                        border: 'none', cursor: 'pointer'
                    }} onClick={() => {
                        onSet(parseInt(mins) || 25);
                        setShowSet(false);
                    }} aria-label="Confirm" title="Confirm"><Icon name="Check" size="1em" /></button><button style={{
                        fontSize: 11, padding: '3px 5px',
                        color: 'var(--text3)', background: 'none', border: 'none', cursor: 'pointer'
                    }}
                        onClick={() => setShowSet(false)} aria-label="Close" title="Close"><Icon name="X" size="1em" /></button></div>);
            if (!timer) return (<button onClick={e => {
                e.stopPropagation();
                setShowSet(true);
            }} style={{
                fontSize: 11, padding: '3px 9px', borderRadius: 5,
                border: '1px solid var(--border)', background: 'var(--bg3)', color: 'var(--text3)',
                cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 3
            }} title="Set Timer" aria-label="Set Timer"><Icon name="Timer" size="1em" /></button>);
            const expired = timer.remaining <= 0;
            return (<div style={{ display: 'flex', alignItems: 'center', gap: 3 }} onClick={e => e
                .stopPropagation()}><span className={`timer-badge ${expired ? 'expired' : timer.running ? 'running' : 'paused'}`}><Icon name="Timer" size="1em" /> {fmtSecs(Math
                    .max(0, timer.remaining))}</span>{!expired && (timer.running ? <button style={{
                        fontSize: 10,
                        padding: '2px 5px', borderRadius: 3, border: '1px solid var(--border)',
                        background: 'var(--bg3)', color: 'var(--amber)', cursor: 'pointer'
                    }}
                        onClick={onStop} aria-label="Pause timer" title="Pause timer"><Icon name="Pause" size="1em" /></button> : <button style={{
                            fontSize: 10, padding: '2px 5px',
                            borderRadius: 3, border: '1px solid var(--blue)', background: 'var(--blue-dim)',
                            color: 'var(--blue)', cursor: 'pointer'
                        }} onClick={onStart} aria-label="Start timer" title="Start timer"><Icon name="Play" size="1em" /></button>)}<button style={{
                            fontSize: 10,
                            padding: '2px 4px', color: 'var(--text3)', background: 'none', border: 'none',
                            cursor: 'pointer'
                        }} onClick={onClear} title="Clear" aria-label="Clear"><Icon name="X" size="1em" /></button></div>);
        }

        /* ── CARD MODAL ── */
        function CardModal({ card, col, cols, onClose, onSave, onDelete, onMove, now, timers, setTimers, addToast, onLiveChange }) {
            const confirm = useConfirm();
            const [editing, setEditing] = useState(!card.content);
            const [task, setTask] = useState(card.task);
            const [priority, setPriority] = useState(card.priority || 'None');
            const [content, setContent] = useState(card.content || '');
            const [expiryDays, setExpiryDays] = useState(card.expiryDays ?? null);
            const [color, setColor] = useState(card.color || '');
            const [imageSizes, setImageSizes] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem(
                        'daily_imgsz_' + card.id) || '{}');
                } catch { return {}; }
            });
            const colData = cols.find(c => c.id === col) || cols[0];
            const age = fmtAge(card.createdAt, now);
            const timer = timers[card.id] || null;
            const mobile = useIsMobile();
            const modalRef = useRef();
            const dragRef = useRef(null);
            const [pos, setPos] = useState(null);

            useEffect(() => {
                if (editing && !onLiveChange) return;
                setTask(card.task);
                setPriority(card.priority || 'None');
                setContent(card.content || '');
                setColor(card.color || '');
                setExpiryDays(card.expiryDays ?? null);
            }, [card, editing, !!onLiveChange]);

            function editField(field, value, setter) {
                setter(value);
                if (onLiveChange) onLiveChange(card.id, { [field]: value });
            }

            function handleImageResize(imgId, w) {
                setImageSizes(s => {
                    const n = { ...s, [imgId]: { w } }; try {
                        localStorage.setItem('daily_imgsz_' + card.id, JSON.stringify(n));
                    } catch { } return n;
                });
            }

            function saveCard() {
                if (!onLiveChange) onSave({
                    ...card, task, priority, content, expiryDays, color, updatedAt: new Date()
                        .toISOString()
                });
                setEditing(false);
            }

            function setTimer(mins) {
                const endAt = Date.now() + mins * 60 * 1000;
                setTimers(t => {
                    const n = {
                        ...t, [card.id]: {
                            total: mins * 60, remaining: mins * 60, running: false,
                            endAt
                        }
                    };
                    saveTimers(n); return n;
                });
                ensureNotificationPermission();
            }

            function onHdrMouseDown(e) {
                if (mobile) return;
                if (e.button !== 0) return;
                if (e.target.closest('button') || e.target.closest('input')) return;
                const el = modalRef.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                if (!pos) setPos({ x: r.left, y: r.top, w: r.width, h: r.height });
                dragRef.current = { ox: e.clientX - r.left, oy: e.clientY - r.top, w: r.width, h: r.height };
                const onMove = ev => {
                    if (!dragRef.current) return;
                    setPos(p => ({
                        ...(p || dragRef.current), x: ev.clientX - dragRef.current.ox, y: ev.clientY -
                            dragRef.current.oy
                    }));
                };
                const onUp = () => {
                    dragRef.current = null;
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                e.preventDefault();
            }

            const eResizeRef = useRef(null);

            function onEResize(e) {
                if (mobile) return;
                e.preventDefault();
                e.stopPropagation();
                const el = modalRef.current;
                if (!el) return;
                const r = el.getBoundingClientRect();
                if (!pos) setPos({ x: r.left, y: r.top, w: r.width, h: r.height });
                const startX = e.clientX,
                    startW = r.width,
                    startX0 = r.left;
                const onMove = ev => {
                    const dw = ev.clientX - startX;
                    setPos(p => ({ ...(p || { x: startX0, y: r.top, h: r.height }), w: Math.max(380, startW + dw) }));
                };
                const onUp = () => {
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                };
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }

            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = ''; };
            }, []);

            const fittedPos = pos ? fitPanel(pos) : null;
            const modalStyle = fittedPos && !mobile ?
                {
                    position: 'fixed', left: fittedPos.x, top: fittedPos.y, width: fittedPos.w, margin: 0,
                    maxWidth: 'none'
                } :
                { position: 'relative', width: '100%', maxWidth: 740, margin: 'auto' };

            return (
                <div className="overlay" style={pos ? { alignItems: 'flex-start' } : {}} onMouseDown={e => {
                    if (e
                        .target === e.currentTarget) onClose()
                }}>
                    <div ref={modalRef} className="modal card-modal" style={{ ...modalStyle, overflow: 'visible' }} onClick={e =>
                        e.stopPropagation()}>
                        <div onMouseDown={onEResize} style={{
                            position: 'absolute', top: 12, right: -4, bottom: 12,
                            width: 8, cursor: 'e-resize', zIndex: 10, display: mobile ? 'none' : undefined
                        }} />
                        <div className="modal-hdr" style={{ cursor: pos ? 'move' : 'default' }} onMouseDown={
                            onHdrMouseDown}>
                            <div style={{
                                width: 8, height: 8, borderRadius: '50%', background: colData.color,
                                flexShrink: 0
                            }} />
                            {color && <div style={{
                                width: 8, height: 8, borderRadius: '50%', background: color,
                                flexShrink: 0
                            }} />}
                            {editing ? <input className="finput" style={{
                                fontSize: 14, fontWeight: 600, flex: 1,
                                background: 'transparent', border: 'none', padding: 0, minWidth: 0
                            }}
                                value={task} onChange={e => editField('task', e.target.value, setTask)}
                                placeholder="Task title…" autoFocus /> :
                                <div className="modal-title">{task}</div>}
                            <div className="card-modal-actions" style={{
                                display: 'flex', gap: 4, marginLeft: 'auto', alignItems: 'center',
                                flexShrink: 0
                            }}>
                                {!mobile && <span style={{
                                    fontSize: 10, color: 'var(--text3)',
                                    marginRight: 2
                                }}><Icon name="Clock" size="1em" /> {age}</span>}
                                <TimerWidgetInline timer={timer} onSet={setTimer} onClear={() => setTimers(t => {
                                    const n = { ...t };
                                    delete n[card.id];
                                    saveTimers(n); return n;
                                })} onStart={() => setTimers(t => {
                                    const cur =
                                        t[card.id]; if (!cur) return t; const endAt = Date.now() + cur
                                            .remaining * 1000; const n = {
                                                ...t, [card.id]: {
                                                    ...cur,
                                                    running: true, endAt
                                                }
                                            };
                                    saveTimers(n); return n;
                                })} onStop={() => setTimers(t => {
                                    const cur =
                                        t[card.id]; if (!cur) return t; const n = {
                                            ...t, [card.id]: {
                                                ...cur, running: false
                                            }
                                        };
                                    saveTimers(n); return n;
                                })} />
                                {!editing && priority !== 'None' && <span className={`priority p${priority[1]}`}>
                                    {priority}</span>}
                                {!editing && <button className="ibtn" title="Edit" onClick={() => setEditing(true)}
                                    style={{ width: 28, height: 28, border: 'none', fontSize: 13 }} aria-label="Edit"><Icon name="Pencil" size="1em" /></button>}
                                <button className="ibtn" title="Delete" onClick={async () => {
                                    const ok = await confirm({
                                        title: 'Delete this card?',
                                        message: `"${card.task}" and all of its notes will be permanently removed.`,
                                        confirmText: 'Delete',
                                        icon: '🗑️',
                                    });
                                    if (ok) onDelete(card.id);
                                }} style={{
                                    width: 28, height: 28, border: 'none',
                                    fontSize: 13, color: 'var(--red)'
                                }} aria-label="Delete"><Icon name="Trash2" size="1em" /></button>
                                {pos && <button className="ibtn" title="Reset position" onClick={() => setPos(null)}
                                    style={{ width: 28, height: 28, border: 'none', fontSize: 12 }} aria-label="Reset position"><Icon name="Focus" size="1em" /></button>}
                                <button className="ibtn" title="Close" onClick={onClose} style={{
                                    width: 28,
                                    height: 28, border: 'none', fontSize: 14
                                }} aria-label="Close"><Icon name="X" size="1em" /></button>
                            </div>
                        </div>
                        <div className="modal-body" style={{
                            overflowY: 'auto', maxHeight: pos ?
                                'calc(90vh - 100px)' : 'calc(90vh - 110px)'
                        }}>
                            {editing ? (
                                <>
                                    <div className="frow" style={mobile ? { gridTemplateColumns: '1fr 1fr' } :
                                        {}}>
                                        <div><label className="flabel">Priority</label><select className="fselect"
                                            value={priority} onChange={e => editField('priority', e.target.value, setPriority)}>
                                            {PRIORITY_LIST.map(p => <option key={p}>{p}</option>)}</select></div>
                                        <div><label className="flabel">Move to</label><select className="fselect"
                                            value={col} onChange={e => onMove(card.id, col, e.target.value)}>
                                            {cols.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                                        </select></div>
                                        {!mobile && <div><label className="flabel">Auto-delete</label><select
                                            className="fselect" value={expiryDays ?? ''} onChange={e =>
                                                editField('expiryDays', e.target.value ? Number(e.target
                                                    .value) : null, setExpiryDays)}><option value=''>Never</option><option
                                                        value='3'>3d</option><option value='7'>7d</option><option
                                                            value='14'>14d</option></select></div>}
                                    </div>
                                    {mobile && <div className="fgroup"><label className="flabel">Auto-delete</label>
                                        <select className="fselect" value={expiryDays ?? ''} onChange={e =>
                                            editField('expiryDays', e.target.value ? Number(e.target.value) :
                                                null, setExpiryDays)}><option value=''>Never</option><option value='3'>3d</option>
                                            <option value='7'>7d</option><option value='14'>14d</option></select>
                                    </div>}
                                    <div className="fgroup"><label className="flabel">Card Color</label><
                                        CardColorPicker color={color} onChange={value => editField('color', value, setColor)} /></div>
                                    <div className="fgroup"><label className="flabel">Notes</label><MdEditor
                                        value={content} onChange={value => editField('content', value, setContent)} /></div>
                                    {onLiveChange && <p style={{ fontSize: 11, color: 'var(--green)' }}>Live editing: changes are shared as you type. Close to finish.</p>}
                                </>
                            ) : (
                                <MdView value={content} onChange={v => {
                                    setContent(v);
                                    if (onLiveChange) onLiveChange(card.id, { content: v });
                                    else onSave({
                                        ...card, task, priority, content: v, expiryDays, color,
                                        updatedAt: new Date().toISOString()
                                    });
                                }} imageSizes={imageSizes}
                                    onImageResize={handleImageResize} />
                            )}
                        </div>
                        {editing && <div className="modal-foot"><button className="btn" onClick={() => {
                            setEditing(
                                false);
                            setTask(card.task);
                            setContent(card.content);
                            setPriority(card.priority);
                            setColor(card.color || '');
                        }}>{onLiveChange ? 'Finish editing' : 'Cancel'}</button>{!onLiveChange && <button className="btn primary"
                            onClick={saveCard}>Save</button>}</div>}
                    </div>
                </div>
            );
        }

        /* ── ADD CARD MODAL ── */
        function AddCardModal({ defaultCol, cols, onClose, onAdd }) {
            const [col, setCol] = useState(defaultCol);
            const [task, setTask] = useState('');
            const [priority, setPriority] = useState('None');
            const [content, setContent] = useState('');
            const [color, setColor] = useState('');

            function add() {
                if (!task.trim()) return;
                onAdd(col, {
                    id: uid(), task: task.trim(), priority, content, color, createdAt: new Date()
                        .toISOString(), expiryDays: null
                });
                onClose();
            }
            const colData = cols.find(c => c.id === col) || cols[0];
            useEffect(() => {
                document.body.style.overflow = 'hidden';
                return () => { document.body.style.overflow = ''; };
            }, []);
            return (
                <div className="overlay" onMouseDown={e => { if (e.target === e.currentTarget) onClose() }}>
                    <div className="modal" onClick={e => e.stopPropagation()}>
                        <div className="modal-hdr"><div style={{
                            width: 8, height: 8, borderRadius: '50%',
                            background: colData?.color, flexShrink: 0
                        }} /><div className="modal-title">New Card
                            </div><button className="ibtn" onClick={onClose} style={{
                                width: 28, height: 28,
                                marginLeft: 'auto', border: 'none'
                            }} aria-label="Close" title="Close"><Icon name="X" size="1em" /></button></div>
                        <div className="modal-body">
                            <div className="fgroup"><label className="flabel">Task title</label><input
                                className="finput" value={task} onChange={e => setTask(e.target.value)}
                                placeholder="What needs to be done?" autoFocus onKeyDown={e => e.key ===

        /* ── CARD COMPONENT ── */
        function Card({ card, onOpen, onDragStart, onDragOver, onDropOnCard, now, timer }) {
            const [dragSide, setDragSide] = useState(null);
            const blocker = parseBlocker(card.content);
            const days = Math.floor(((now || Date.now()) - new Date(card.createdAt).getTime()) / 864e5);
            const ac = ageClass(card.createdAt, now);
            const ageText = fmtAge(card.createdAt, now);
            const ageCardClass = days > 6 ? 'aged-old' : days > 2 ? 'aged-stale' : '';
            const timerExpired = timer && timer.remaining <= 0;
            const timerRunning = timer && timer.running && timer.remaining > 0;
            const timerPaused = timer && !timer.running && timer.remaining > 0;
            return (
                <div className={`card ${ageCardClass}${dragSide === 'top' ? ' drag-over-top' : dragSide === 'bottom' ? ' drag-over-bottom' : ''}`}
                    data-cursor-anchor={'card:' + card.id}
                    draggable onDragStart={e => {
                        e.dataTransfer.effectAllowed = 'move';
                        onDragStart(card.id);
                    }}
                    onDragOver={e => {
                        e.preventDefault();
                        e.stopPropagation(); const r = e.currentTarget.getBoundingClientRect(); const side = e
                            .clientY < r.top + r.height / 2 ? 'top' : 'bottom';
                        setDragSide(side);
                        onDragOver(card.id, side === 'top' ? 'before' : 'after');
                    }}
                    onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setDragSide(null); }}
                    onDrop={e => {
                        e.preventDefault();
                        e.stopPropagation(); const s = dragSide;
                        setDragSide(null);
                        onDropOnCard(card.id, s === 'top' ? 'before' : 'after');
                    }}
                    onDragEnd={() => setDragSide(null)} onClick={() => onOpen(card)}
                    style={{ borderLeft: card.color ? `3px solid ${card.color}` : undefined }}>
                    <div className="card-title">{card.task}</div>
                    <div className="card-meta">

                            {card.priority}</span>}
                        {card.expiryDays && card.doneAt && (() => {
                            const rem = card.expiryDays - daysDiff(card
                                .doneAt); return <span className={`expiry-badge${rem <= 1 ? ' warn' : ''}`}><Icon name="Trash2" size="1em" /> {rem >
                                    0 ? rem + 'd' : 'today'}</span>;
                        })()}
                        {(timerRunning || timerPaused || timerExpired) && <span
                            className={`timer-badge ${timerExpired ? 'expired' : timerRunning ? 'running' : 'paused'}`}><Icon name="Timer" size="1em" /> {fmtSecs(
                                Math.max(0, timer.remaining))}</span>}
                        {card.content && !blocker && <span style={{ fontSize: 10, color: 'var(--text3)' }}><Icon name="NotebookPen" size="1em" /></span>}

                    {blocker && <div className="card-blocker"><div className="blocker-lbl"><Icon name="CircleAlert" size="1em" /> BLOCKER</div><div
                        style={{ lineHeight: 1.35 }}>{blocker.slice(0, 120)}{blocker.length > 120 ? '…' :
