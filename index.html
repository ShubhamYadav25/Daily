<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Daily.</title>
    <meta name="description" content="Collaborate, organize, secure, and sync your work in real time." />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily" />
    <link rel="apple-touch-icon" sizes="512x512" href="./daily-icon.png" />
    <link rel="manifest" href="#" id="manifest-link" />
    <link rel="icon" type="image/png" sizes="512x512" href="./daily-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./daily-icon.png" />

    <script>
        /* ═══════════════════════════════════════════════════════════
           OFFLINE BOOTSTRAP
           Every third-party asset (React, ReactDOM, Babel, KaTeX,
           Lucide, Google Fonts + their font files) is fetched
           once and stored in Cache Storage, with CSS url()s rewritten
           to inline data: URIs. After the first successful online load
           the whole app runs with zero network access.

           Tesseract.js (OCR engine) is loaded as an OPTIONAL script —
           a failure there never blocks the app from booting.
           ═══════════════════════════════════════════════════════════ */
        (function () {
            'use strict';

            var CACHE_NAME = 'daily-offline-v2';
            var INLINE_MAX = 400 * 1024;   // skip inlining single files above this

            var STYLES = [
                { id: 'katex-css', url: 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css' },
                { id: 'gfonts-css', url: 'https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap' }
            ];

            var SCRIPTS = [
                { id: 'react', url: 'https://unpkg.com/react@18.3.1/umd/react.production.min.js' },
                { id: 'react-dom', url: 'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js' },
                { id: 'babel', url: 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js' },
                { id: 'lucide', url: 'https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js' },
                { id: 'jsdiff', url: 'https://cdn.jsdelivr.net/npm/diff@9.0.0/dist/diff.min.js' },
                { id: 'katex', url: 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js' }
            ];

            /* optional — app boots fine even if these fail */
            var OPTIONAL_SCRIPTS = [
                { id: 'tesseract', url: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js' },
                { id: 'jsonrepair', url: 'https://cdn.jsdelivr.net/npm/jsonrepair@3.13.1/lib/umd/jsonrepair.min.js' },
                { id: 'jsonlint', url: 'https://cdn.jsdelivr.net/npm/@jsonlint/core@0.1.1/src/index.js', module: true, global: 'JSONLint' }
            ];

            /* ---------- cache plumbing ---------- */
            var _cache = null;
            function getCache() {
                if (!_cache) {
                    _cache = (async function () {
                        try {
                            if (typeof caches === 'undefined') return null;
                            return await caches.open(CACHE_NAME);
                        } catch (e) { return null; }
                    })();
                }
                return _cache;
            }

            async function getResource(url) {
                var cache = await getCache();
                if (cache) {
                    try {
                        var hit = await cache.match(url);
                        if (hit) return hit;
                    } catch (e) { }
                }
                var res = await fetch(url, { mode: 'cors', credentials: 'omit', cache: 'force-cache' });
                if (!res || !res.ok) throw new Error('HTTP ' + (res && res.status) + ' — ' + url);
                if (cache) {
                    try { await cache.put(url, res.clone()); } catch (e) { }
                }
                return res;
            }

            function blobToDataURL(blob) {
                return new Promise(function (resolve, reject) {
                    var fr = new FileReader();
                    fr.onload = function () { resolve(fr.result); };
                    fr.onerror = reject;
                    fr.readAsDataURL(blob);
                });
            }

            /* ---------- CSS with inlined fonts ---------- */
            async function inlineCssUrls(cssText, baseUrl) {
                var re = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
                var targets = new Map(), m;
                while ((m = re.exec(cssText)) !== null) {
                    var raw = m[2].trim();
                    if (!raw || raw.indexOf('data:') === 0 || raw.charAt(0) === '#') continue;
                    var abs;
                    try { abs = new URL(raw, baseUrl).href; } catch (e) { continue; }
                    if (!targets.has(raw)) targets.set(raw, abs);
                }
                if (!targets.size) return cssText;

                var map = new Map();
                await Promise.all(Array.from(targets.entries()).map(async function (pair) {
                    try {
                        var res = await getResource(pair[1]);
                        var blob = await res.blob();
                        if (!blob.size || blob.size > INLINE_MAX) return;
                        map.set(pair[0], await blobToDataURL(blob));
                    } catch (e) { /* leave the remote URL in place */ }
                }));
                if (!map.size) return cssText;

                return cssText.replace(re, function (full, q, raw) {
                    var d = map.get(raw.trim());
                    return d ? 'url("' + d + '")' : full;
                });
            }

            async function loadStylesheet(spec) {
                var cache = await getCache();
                var key = spec.url + '::inlined';
                var text = null;

                if (cache) {
                    try {
                        var hit = await cache.match(key);
                        if (hit) text = await hit.text();
                    } catch (e) { }
                }
                if (text === null) {
                    var res = await getResource(spec.url);
                    text = await res.text();
                    try { text = await inlineCssUrls(text, spec.url); } catch (e) { }
                    if (cache) {
                        try {
                            await cache.put(key, new Response(text, {
                                headers: { 'Content-Type': 'text/css; charset=utf-8' }
                            }));
                        } catch (e) { }
                    }
                }
                var style = document.createElement('style');
                style.id = spec.id;
                style.textContent = text;
                document.head.appendChild(style);
            }

            /* ---------- scripts ---------- */
            async function loadScript(spec) {
                var res = await getResource(spec.url);
                var code = await res.text();
                if (spec.module) {
                    var moduleUrl = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
                    try { window[spec.global] = await import(moduleUrl); }
                    finally { URL.revokeObjectURL(moduleUrl); }
                    return;
                }
                await new Promise(function (resolve, reject) {
                    var blob = new Blob([code], { type: 'application/javascript' });
                    var url = URL.createObjectURL(blob);
                    var s = document.createElement('script');
                    s.src = url;
                    s.async = false;
                    s.onload = function () { URL.revokeObjectURL(url); resolve(); };
                    s.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Failed to run ' + spec.url)); };
                    document.head.appendChild(s);
                });
            }

            /* ---------- boot UI ---------- */
            function bootMsg(msg, sub) {
                var el = document.getElementById('boot-screen');
                if (!el) return;
                var m = el.querySelector('.boot-msg');
                var s = el.querySelector('.boot-sub');
                if (m && msg) m.textContent = msg;
                if (s && sub !== undefined) s.textContent = sub;
            }

            function bootError(err) {
                var el = document.getElementById('boot-screen');
                if (!el) return;
                el.classList.remove('hide');
                el.innerHTML =
                    '<div class="boot-msg">First run needs the internet</div>' +
                    '<div class="boot-sub" style="max-width:440px;line-height:1.7;font-size:13px;color:#9a9da6">' +
                    'Daily. downloads React, Babel, KaTeX, Lucide icons and fonts once, then stores them on this device. ' +
                    'After that single online load it runs <b style="color:#3ecf8e">100% offline</b>.' +
                    '<br><br>Connect to the internet and reload the page.' +
                    '<br><br><span style="font-family:monospace;font-size:11px;color:#5a5d66">' +
                    String((err && err.message) || err) + '</span></div>' +
                    '<button onclick="location.reload()" style="margin-top:10px;padding:10px 24px;border-radius:9px;border:none;background:#4f8ef7;color:#fff;font-weight:600;font-size:13px;cursor:pointer">Retry</button>';
            }

            async function boot() {
                try {
                    bootMsg('Loading Daily…', 'Reading local cache');
                    await Promise.allSettled(STYLES.map(loadStylesheet));

                    for (var i = 0; i < SCRIPTS.length; i++) {
                        bootMsg('Loading Daily…', 'Fetching ' + SCRIPTS[i].id);
                        await loadScript(SCRIPTS[i]);
                    }

                    /* optional extras — never block the boot */
                    try {
                        bootMsg('Loading Daily…', 'Fetching extras');
                        await Promise.allSettled(OPTIONAL_SCRIPTS.map(loadScript));
                    } catch (e) { /* ignore */ }

                    if (typeof Babel === 'undefined') throw new Error('Babel standalone did not load');

                    bootMsg('Starting…', 'Compiling application');
                    await new Promise(function (r) { setTimeout(r, 30); });

                    Babel.transformScriptTags();

                    setTimeout(function () {
                        var el = document.getElementById('boot-screen');
                        if (el) {
                            el.classList.add('hide');
                            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
                        }
                    }, 400);
                } catch (err) {
                    console.error('[Daily] offline bootstrap failed:', err);
                    bootError(err);
                }
            }

            /* best-effort offline shell (works where the platform permits) */
            (function swAttempt() {
                if (!('serviceWorker' in navigator)) return;
                try {
                    var sw = "self.addEventListener('install',e=>self.skipWaiting());"
                        + "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));"
                        + "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;"
                        + "e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{"
                        + "if(res&&res.ok){var c=res.clone();caches.open('daily-shell-v1').then(x=>x.put(e.request,c)).catch(()=>{});}"
                        + "return res;}).catch(()=>caches.match(e.request).then(x=>x||Response.error()))));});";
                    var url = URL.createObjectURL(new Blob([sw], { type: 'application/javascript' }));
                    navigator.serviceWorker.register(url).catch(function () { });
                } catch (_) { }
            })();

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }
        })();
    </script>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0e0f11;
            --bg2: #141518;
            --bg3: #1c1e22;
            --bg4: #242629;
            --border: #2a2c31;
            --border2: #363940;
            --text: #e8e9eb;
            --text2: #9a9da6;
            --text3: #5a5d66;
            --blue: #4f8ef7;
            --blue-dim: #1a2d52;
            --green: #3ecf8e;
            --green-dim: #0d3326;
            --amber: #f7c35a;
            --amber-dim: #3d2e0a;
            --red: #f76f6f;
            --red-dim: #3d1010;
            --purple: #a78bfa;
            --purple-dim: #251d45;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow: 0 2px 14px rgba(0, 0, 0, .45);
            --hdr: 50px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        html {
            height: 100%;
            overflow: hidden
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100%;
            overflow: hidden;
            overscroll-behavior: contain
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            line-height: 1
        }

        input,
        textarea,
        select {
            font-family: inherit;
            color: inherit;
            background: none
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border2);
            border-radius: 4px
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden
        }

        /* ── HEADER ── */
        .header {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 10px;
            height: calc(var(--hdr) + var(--safe-top));
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
            flex-shrink: 0;
            z-index: 20;
            position: relative;
            padding-top: var(--safe-top)
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -.5px;
            color: var(--text);
            flex-shrink: 0;
            margin-right: 4px;
            cursor: default
        }

        .logo span {
            color: var(--blue)
        }

        /* ══════════════════════════════════════════════
   NOTIFICATION PERMISSION SNACKBAR
   ══════════════════════════════════════════════ */
        .notif-snack-wrap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(18px + var(--safe-bottom));
            display: flex;
            justify-content: center;
            padding: 0 10px;
            z-index: 850;
            pointer-events: none;
        }

        .notif-snack {
            pointer-events: auto;
            position: relative;
            width: min(470px, 100%);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 15px 16px;
            border-radius: 16px;
            background: var(--bg2);
            border: 1px solid var(--border2);
            box-shadow:
                0 18px 50px rgba(0, 0, 0, .55),
                0 0 0 1px rgba(79, 142, 247, .10),
                0 0 44px rgba(79, 142, 247, .10);
            overflow: hidden;
            animation: snackIn .42s cubic-bezier(.21, .9, .35, 1.15) both;
        }

        .notif-snack::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(130% 110% at 0% 0%, rgba(79, 142, 247, .12), transparent 58%);
            pointer-events: none;
        }

        @keyframes snackIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .notif-snack-icon {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            color: var(--blue);
            background: linear-gradient(135deg, rgba(79, 142, 247, .22), rgba(167, 139, 250, .16));
            border: 1px solid rgba(79, 142, 247, .35);
        }

        .notif-snack-icon .pulse-ring {
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            border: 1.5px solid rgba(79, 142, 247, .55);
            animation: notifPulse 2.2s ease-out infinite;
            pointer-events: none;
        }

        @keyframes notifPulse {
            0% {
                transform: scale(1);
                opacity: .75;
            }

            100% {
                transform: scale(1.55);
                opacity: 0;
            }
        }

        .notif-snack-body {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .notif-snack-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.15px;
        }

        .notif-snack-text {
            font-size: 12px;
            color: var(--text3);
            line-height: 1.55;
            margin-top: 3px;
        }

        .notif-snack-actions {
            display: flex;
            gap: 6px;
            margin-top: 11px;
            flex-wrap: wrap;
        }

        .notif-btn {
            padding: 7px 14px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            transition: background .15s, color .15s, transform .15s, box-shadow .15s;
            line-height: 1.2;
        }

        .notif-btn:hover:not(:disabled) {
            background: var(--bg4);
            color: var(--text);
        }

        .notif-btn.primary {
            border-color: transparent;
            color: #fff;
            background: linear-gradient(135deg, #4f8ef7, #6ea2ff);
            box-shadow: 0 4px 14px rgba(79, 142, 247, .38);
        }

        .notif-btn.primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 7px 22px rgba(79, 142, 247, .52);
        }

        .notif-btn:disabled {
            opacity: .55;
            cursor: default;
        }

        .notif-snack-close {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: var(--text3);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .12s, color .12s;
            z-index: 2;
        }

        .notif-snack-close:hover {
            background: var(--bg4);
            color: var(--text);
        }

        @media (max-width: 640px) {
            .notif-snack-wrap {
                bottom: calc(12px + var(--safe-bottom));
                padding: 0 8px;
            }

            .notif-snack {
                padding: 14px;
                border-radius: 14px;
                gap: 10px;
            }

            .notif-snack-icon {
                width: 36px;
                height: 36px;
                font-size: 15px;
            }

            .notif-snack-actions .notif-btn {
                flex: 1;
                text-align: center;
            }
        }

        /* ══════════════════════════════════════════════
   THEMED CONFIRM DIALOG
   ══════════════════════════════════════════════ */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .72);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: fadein .16s ease;
        }

        .confirm-box {
            position: relative;
            width: min(400px, 100%);
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow: hidden;
            box-shadow:
                0 24px 60px rgba(0, 0, 0, .65),
                0 0 0 1px rgba(255, 255, 255, .03) inset;
            animation: confirmIn .24s cubic-bezier(.2, .9, .3, 1.1) both;
        }

        .confirm-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--red), #fb923c);
        }

        .confirm-box.safe::before {
            background: linear-gradient(90deg, var(--blue), var(--purple));
        }

        @keyframes confirmIn {
            from {
                opacity: 0;
                transform: scale(.92) translateY(14px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .confirm-icon {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--red);
            background: linear-gradient(135deg, rgba(247, 111, 111, .18), rgba(251, 146, 60, .12));
            border: 1px solid rgba(247, 111, 111, .3);
        }

        .confirm-box.safe .confirm-icon {
            color: var(--blue);
            background: linear-gradient(135deg, rgba(79, 142, 247, .2), rgba(167, 139, 250, .14));
            border-color: rgba(79, 142, 247, .35);
        }

        .confirm-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -.2px;
            line-height: 1.3;
        }

        .confirm-message {
            font-size: 13px;
            color: var(--text2);
            line-height: 1.6;
            margin-top: 4px;
        }

        .confirm-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .confirm-btn {
            min-width: 92px;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            transition: background .15s, color .15s, transform .15s, box-shadow .15s;
            line-height: 1.2;
        }

        .confirm-btn:hover {
            background: var(--bg4);
            color: var(--text);
            transform: translateY(-1px);
        }

        .confirm-btn.danger {
            border-color: transparent;
            color: #fff;
            background: linear-gradient(135deg, #f76f6f, #ef4444);
            box-shadow: 0 4px 16px rgba(247, 111, 111, .4);
        }

        .confirm-btn.danger:hover {
            box-shadow: 0 7px 22px rgba(247, 111, 111, .55);
        }

        .confirm-btn.primary {
            border-color: transparent;
            color: #fff;
            background: linear-gradient(135deg, #4f8ef7, #6ea2ff);
            box-shadow: 0 4px 16px rgba(79, 142, 247, .4);
        }

        .confirm-btn.primary:hover {
            box-shadow: 0 7px 22px rgba(79, 142, 247, .55);
        }

        @media (max-width: 640px) {
            .confirm-box {
                padding: 18px;
                border-radius: 16px;
            }

            .confirm-actions {
                flex-direction: column-reverse;
            }

            .confirm-btn {
                width: 100%;
            }
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            border: 1px solid var(--border);
            white-space: nowrap;
            flex-shrink: 0
        }


        /* ── MATH (KaTeX) ── */
        .md-render .katex-display {
            margin: 10px 0;
            padding: 6px 4px;
            overflow-x: auto;
            overflow-y: hidden;
            border-radius: 6px;
            background: var(--bg4);
            border: 1px solid var(--border)
        }

        .md-render .katex-display::-webkit-scrollbar {
            height: 4px
        }

        .md-render .katex {
            font-size: 1.05em;
            color: var(--text)
        }

        .md-render .katex-display>.katex {
            color: var(--text)
        }

        .md-render .katex-error,
        .md-render .math-error {
            color: var(--red) !important;
            background: var(--red-dim);
            padding: 1px 5px;
            border-radius: 4px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            border: 1px solid rgba(247, 111, 111, .3)
        }

        .stat-pill.red {
            color: var(--red);
            border-color: var(--red-dim);
            background: var(--red-dim)
        }

        .stat-pill.green {
            color: var(--green);
            border-color: var(--green-dim);
            background: var(--green-dim)
        }

        .ibtn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            color: var(--text2);
            transition: background .12s, color .12s, border-color .12s;
            flex-shrink: 0;
            position: relative;
            padding: 0
        }

        .ibtn:hover {
            background: var(--bg3);
            color: var(--text)
        }

        .ibtn.active {
            background: var(--blue-dim);
            border-color: var(--blue);
            color: var(--blue)
        }

        .ibtn.primary {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff
        }

        .ibtn.primary:hover {
            opacity: .88
        }

        [data-tip] {
            position: relative
        }

        [data-tip]:is(:hover, :focus-visible)::after {
            content: attr(data-tip);
            position: absolute;
            top: calc(100% + 7px);
            bottom: auto;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg4);
            border: 1px solid var(--border2);
            color: var(--text);
            font-size: 11px;
            font-weight: 500;
            padding: 4px 9px;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .4)
        }

        [data-tip]:is(:hover, :focus-visible)::before {
            content: '';
            position: absolute;
            top: calc(100% + 2px);
            bottom: auto;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-bottom-color: var(--border2);
            border-top-color: transparent;
            pointer-events: none;
            z-index: 9999
        }

        .search-wrap {
            position: relative;
            display: flex;
            align-items: center
        }

        .search-inp {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 10px 5px 32px;
            font-size: 13px;
            color: var(--text);
            outline: none;
            width: 150px;
            transition: border-color .15s
        }

        .search-inp:focus {
            border-color: var(--blue)
        }

        .header-actions {
            display: flex;
            gap: 3px;
            align-items: center;
            flex-shrink: 0
        }

        .sync-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text3);
            margin-left: 2px;
            transition: .2s
        }

        .sync-dot.connected {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .sync-dot.connecting {
            background: var(--amber);
            animation: pulse 1s infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .5
            }
        }

        .sync-modal {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 480px;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: calc(var(--viewport-height, 100vh) - 32px);
            overflow-y: auto;
        }

        .sync-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .sync-input {
            flex: 1;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text);
            outline: none
        }

        .qr-box {
            background: white;
            padding: 12px;
            border-radius: 12px;
            display: inline-block;
            margin: 0 auto
        }

        .peer-list {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 11px
        }

        .status-badge.on {
            background: var(--green-dim);
            color: var(--green)
        }

        .status-badge.off {
            background: var(--red-dim);
            color: var(--red)
        }

        .board-wrap {
            position: relative;
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        .board {
            display: flex;
            gap: 10px;
            padding: 12px;
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            min-height: 0;
            align-items: stretch
        }

        .board::-webkit-scrollbar {
            height: 6px
        }

        .collaboration-cursors {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 20;
        }

        .collaboration-cursor {
            position: absolute;
            top: 0;
            left: 0;
            transition: transform 40ms linear;
            pointer-events: none;
        }

        .collaboration-cursor span {
            display: block;
            margin-left: 16px;
            padding: 3px 7px;
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .col {
            display: flex;
            flex-direction: column;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            min-width: 230px;
            max-width: 290px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
            transition: opacity .15s, transform .15s, border-color .15s;
            border-top: 3px solid var(--border)
        }

        .col.col-dragging {
            opacity: .4;
            transform: scale(.97)
        }

        .col.col-drop-target {
            border-color: var(--blue);
            background: rgba(79, 142, 247, .04)
        }

        .col-hdr {
            padding: 9px 10px 7px;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border)
        }

        .col-grip {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            cursor: grab;
            color: var(--text3);
            transition: .12s;
            flex-shrink: 0;
            user-select: none
        }

        .col-grip:hover {
            color: var(--text2);
            background: var(--bg4)
        }

        .col-grip.locked {
            cursor: default;
            color: var(--amber)
        }

        .col-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .col-title-wrap {
            flex: 1;
            min-width: 0;
            overflow: hidden
        }

        .col-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--text2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .col-title-inp {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            color: var(--text);
            background: var(--bg3);
            border: 1px solid var(--blue);
            border-radius: 5px;
            padding: 1px 6px;
            outline: none;
            width: 100%
        }

        .col-count {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 10px;
            background: var(--bg4);
            flex-shrink: 0
        }

        .col-blocker-badge {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            color: var(--red);
            flex-shrink: 0
        }

        .col-hdr-actions {
            display: flex;
            gap: 1px;
            opacity: 0;
            transition: .12s;
            flex-shrink: 0
        }

        .col-hdr:hover .col-hdr-actions {
            opacity: 1
        }

        .chbtn {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text3);
            transition: .1s;
            border: none;
            background: none;
            cursor: pointer
        }

        .chbtn:hover {
            background: var(--bg4);
            color: var(--text2)
        }

        .chbtn.lock-on {
            color: var(--amber)
        }

        .chbtn.del-col:hover {
            color: var(--red);
            background: var(--red-dim)
        }

        .chbtn.clear-col:hover:not(:disabled) {
            color: var(--amber);
            background: var(--amber-dim);
        }

        .chbtn.clear-col:disabled {
            cursor: default;
        }

        .col-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .col-add-btn {
            width: 32px;
            height: 28px;
            border-radius: 7px;
            color: var(--text3);
            border: 1px dashed var(--border);
            background: transparent;
            transition: .15s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            cursor: pointer;
            align-self: center
        }

        .col-add-btn:hover {
            border-color: var(--text2);
            color: var(--text2);
            background: var(--bg3)
        }

        .col-empty {
            text-align: center;
            padding: 24px 12px;
            color: var(--text3);
            font-size: 12px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: .7
        }

        .add-col-btn {
            min-width: 50px;
            width: 50px;
            border: 1.5px dashed var(--border2);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text3);
            font-size: 18px;
            cursor: pointer;
            transition: .18s;
            background: transparent;
            flex-shrink: 0;
            padding: 16px 8px
        }

        .add-col-btn:hover {
            border-color: var(--text2);
            color: var(--text2);
            background: var(--bg2)
        }

        /* ── CARDS ── */
        .card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 9px 10px 8px;
            cursor: pointer;
            transition: transform .12s, box-shadow .12s, border-color .12s;
            position: relative;
            user-select: none
        }

        .card:hover {
            border-color: var(--border2);
            box-shadow: var(--shadow);
            transform: translateY(-1px)
        }

        .card:active {
            transform: scale(.98)
        }

        .card.dragging {
            opacity: .35;
            cursor: grabbing;
            transform: scale(.97)
        }

        .card.drag-over-top {
            border-top: 2px solid var(--blue) !important
        }

        .card.drag-over-bottom {
            border-bottom: 2px solid var(--blue) !important
        }

        .card.aged-stale {
            border-left: 2px solid var(--amber)
        }

        .card.aged-old {
            border-left: 2px solid var(--red)
        }

        .card-title {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            word-break: break-word;
            margin-bottom: 6px
        }

        .card-meta {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap
        }

        .priority {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 4px;
            letter-spacing: .3px
        }

        .p0 {
            background: var(--red-dim);
            color: var(--red)
        }

        .p1 {
            background: var(--amber-dim);
            color: var(--amber)
        }

        .p2 {
            background: var(--blue-dim);
            color: var(--blue)
        }

        .card-age {
            font-size: 10px;
            color: var(--text3);
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0
        }

        .card-age.age-fresh {
            color: var(--green)
        }

        .card-age.age-recent {
            color: var(--text3)
        }

        .card-age.age-stale {
            color: var(--amber)
        }

        .card-age.age-old {
            color: var(--red)
        }

        .expiry-badge {
            font-size: 10px;
            color: var(--text3);
            display: flex;
            align-items: center;
            gap: 2px
        }

        .expiry-badge.warn {
            color: var(--amber)
        }

        .card-blocker {
            margin-top: 7px;
            padding: 6px 8px;
            background: var(--red-dim);
            border: 1px solid rgba(247, 111, 111, .2);
            border-radius: 6px;
            font-size: 11px;
            color: var(--red);
            line-height: 1.4
        }

        .blocker-lbl {
            font-weight: 700;
            font-size: 10px;
            letter-spacing: .5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 3px
        }

        .timer-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 3px;
            font-family: 'DM Mono', monospace;
            font-weight: 600
        }

        .timer-badge.running {
            background: var(--blue-dim);
            color: var(--blue)
        }

        .timer-badge.paused {
            background: var(--amber-dim);
            color: var(--amber)
        }

        .timer-badge.expired {
            background: var(--red-dim);
            color: var(--red);
            animation: pulse 1s ease infinite
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .5
            }
        }

        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: .12s;
            flex-shrink: 0
        }

        .color-dot:hover,
        .color-dot.sel {
            border-color: var(--text);
            transform: scale(1.2)
        }

        .color-dot.none-dot {
            background: var(--bg4);
            border: 1px dashed var(--border2)
        }

        /* ── MODAL ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .72);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 16px;
            animation: fadein .14s ease;
            overflow-y: auto
        }

        @keyframes fadein {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 740px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            animation: slidein .17s ease;
            margin: auto
        }

        @keyframes slidein {
            from {
                transform: translateY(10px);
                opacity: 0
            }

            to {
                transform: translateY(0);
                opacity: 1
            }
        }

        .modal-hdr {
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0
        }

        .modal-title {
            font-size: 15px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch
        }

        .modal-foot {
            padding: 10px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-shrink: 0
        }

        .flabel {
            font-size: 11px;
            font-weight: 600;
            color: var(--text2);
            letter-spacing: .4px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block
        }

        .finput {
            width: 100%;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color .15s
        }

        .finput:focus {
            border-color: var(--blue)
        }

        .fselect {
            width: 100%;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 13px;
            color: var(--text);
            outline: none;
            cursor: pointer;
            appearance: none
        }

        .fselect:focus {
            border-color: var(--blue)
        }

        .frow {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px
        }

        .fgroup {
            margin-bottom: 14px
        }

        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            transition: .14s;
            cursor: pointer
        }

        .btn:hover {
            background: var(--bg4);
            color: var(--text)
        }

        .btn.primary {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff
        }

        .btn.primary:hover {
            opacity: .88
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        /* ── MARKDOWN ── */
        .md-render {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text)
        }

        .md-render h1 {
            font-size: 17px;
            font-weight: 600;
            margin: 4px 0 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px
        }

        .md-render h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 14px 0 6px
        }

        .md-render h3 {
            font-size: 13px;
            font-weight: 600;
            margin: 10px 0 4px;
            color: var(--text2)
        }

        .md-render p {
            margin: 4px 0 8px;
            color: var(--text2)
        }

        .md-render ul,
        .md-render ol {
            margin: 4px 0 8px 18px;
            color: var(--text2)
        }

        .md-render li {
            margin: 3px 0;
            line-height: 1.6
        }

        .md-render strong {
            color: var(--text);
            font-weight: 600
        }

        .md-render em {
            font-style: italic
        }

        .md-render del {
            color: var(--text3);
            text-decoration: line-through
        }

        .md-render code {
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1px 5px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--blue)
        }

        .md-render pre {
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0
        }

        .md-render pre code {
            background: none;
            border: none;
            padding: 0;
            font-size: 12px;
            color: var(--text2);
            display: block;
            line-height: 1.6
        }

        .md-render blockquote {
            border-left: 3px solid var(--purple);
            padding: 5px 5px 5px 12px;
            margin: 8px 0;
            color: var(--text3);
            font-style: italic;
            background: var(--purple-dim);
            border-radius: 0 6px 6px 0
        }

        .md-render hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0
        }

        .md-render .md-spacer {
            height: 4px
        }

        .md-render .blocker-block {
            background: var(--red-dim);
            border: 1px solid rgba(247, 111, 111, .25);
            border-radius: 8px;
            padding: 10px 14px;
            margin: 10px 0
        }

        .md-render .blocker-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .7px;
            text-transform: uppercase;
            color: var(--red);
            display: block;
            margin-bottom: 4px
        }

        .md-render .blocker-detail {
            color: var(--red);
            font-size: 13px;
            line-height: 1.5;
            opacity: .85
        }

        .md-render ul.task-list {
            list-style: none;
            margin-left: 4px
        }

        .md-render .task-item {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            padding: 2px 0;
            cursor: pointer
        }

        .md-render .task-item.done .task-text {
            color: var(--text3);
            text-decoration: line-through
        }

        .md-render .cb {
            font-size: 14px;
            flex-shrink: 0;
            user-select: none
        }

        .md-render a {
            color: var(--blue)
        }

        /* ── FLOATING PANEL ── */
        .sc-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 400
        }

        .sc-box {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            padding: 24px;
            width: 320px;
            max-height: 80vh;
            overflow-y: auto
        }

        .sc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text2)
        }

        .sc-row:last-child {
            border-bottom: none
        }

        .kbd {
            background: var(--bg4);
            border: 1px solid var(--border2);
            border-radius: 4px;
            padding: 1px 7px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            color: var(--text)
        }

        .overflow-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 10px;
            box-shadow: var(--shadow);
            z-index: 250;
            display: flex;
            flex-direction: column;
            padding: 5px;
            min-width: 180px;
            animation: slidein .12s ease
        }

        .overflow-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 7px;
            font-size: 13px;
            color: var(--text2);
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: .12s
        }

        .overflow-item:hover {
            background: var(--bg3);
            color: var(--text)
        }

        .overflow-sep {
            height: 1px;
            background: var(--border);
            margin: 4px 2px
        }

        .md-render mark {
            background: var(--amber-dim);
            color: var(--text);
            padding: 0 2px;
            border-radius: 3px
        }

        .md-render .md-table-wrap {
            overflow-x: auto;
            margin: 8px 0
        }

        .md-render table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px
        }

        .md-render th,
        .md-render td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left
        }

        .md-render th {
            background: var(--bg4);
            font-weight: 600;
            color: var(--text)
        }

        .md-render tr:nth-child(even) td {
            background: rgba(255, 255, 255, .02)
        }

        .fontsel {
            font-size: 11px;
            padding: 3px 5px;
            border-radius: 5px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            cursor: pointer;
            outline: none
        }

        .toasts {
            position: fixed;
            bottom: 80px;
            right: 14px;
            z-index: 600;
            display: flex;
            flex-direction: column;
            gap: 5px;
            pointer-events: none
        }

        .toast {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            animation: toastin .2s ease;
            background: var(--bg3);
            border: 1px solid var(--border2);
            color: var(--text);
            pointer-events: auto
        }

        .toast.success {
            background: var(--green-dim);
            border-color: rgba(62, 207, 142, .3);
            color: var(--green)
        }

        .toast.error {
            background: var(--red-dim);
            border-color: rgba(247, 111, 111, .3);
            color: var(--red)
        }

        @keyframes toastin {
            from {
                transform: translateX(14px);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        .cp {
            position: fixed;
            top: -10px;
            pointer-events: none;
            z-index: 700;
            border-radius: 2px;
            animation: fall linear forwards
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0
            }
        }

        .swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: .12s;
            flex-shrink: 0
        }

        .swatch:hover,
        .swatch.sel {
            border-color: var(--text);
            transform: scale(1.15)
        }

        .fab {
            position: fixed;
            bottom: calc(18px + var(--safe-bottom));
            right: 18px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--blue);
            color: #fff;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 18px rgba(79, 142, 247, .45);
            border: none;
            cursor: pointer;
            z-index: 50;
            transition: transform .15s, box-shadow .15s
        }

        .fab:hover {
            transform: scale(1.08)
        }

        .fab:active {
            transform: scale(.95)
        }

        .fp {
            position: fixed;
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .6);
            z-index: 300;
            display: flex;
            flex-direction: column;
            min-width: 320px;
            min-height: 200px
        }

        .fp-hdr {
            padding: 9px 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
            cursor: move;
            user-select: none
        }

        .fp-title {
            font-size: 12px;
            font-weight: 600;
            flex: 1;
            color: var(--text2)
        }

        .fp-resize {
            position: absolute;
            z-index: 10
        }

        .fp-resize.n {
            top: -4px;
            left: 12px;
            right: 12px;
            height: 8px;
            cursor: n-resize
        }

        .fp-resize.s {
            bottom: -4px;
            left: 12px;
            right: 12px;
            height: 8px;
            cursor: s-resize
        }

        .fp-resize.e {
            right: -4px;
            top: 12px;
            bottom: 12px;
            width: 8px;
            cursor: e-resize
        }

        .fp-resize.w {
            left: -4px;
            top: 12px;
            bottom: 12px;
            width: 8px;
            cursor: w-resize
        }

        .fp-resize.nw {
            top: -4px;
            left: -4px;
            width: 14px;
            height: 14px;
            cursor: nw-resize
        }

        .fp-resize.ne {
            top: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            cursor: ne-resize
        }

        .fp-resize.sw {
            bottom: -4px;
            left: -4px;
            width: 14px;
            height: 14px;
            cursor: sw-resize
        }

        .fp-resize.se {
            bottom: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            cursor: se-resize;
            background: var(--border2);
            border-radius: 0 0 var(--radius-lg) 0;
            opacity: .6
        }

        .ai-panel {
            position: fixed;
            top: var(--hdr);
            right: 0;
            width: 320px;
            max-width: 100vw;
            bottom: 0;
            background: var(--bg2);
            border-left: 1px solid var(--border2);
            z-index: 150;
            display: flex;
            flex-direction: column;
            animation: slideL .18s ease
        }

        @keyframes slideL {
            from {
                transform: translateX(100%)
            }

            to {
                transform: translateX(0)
            }
        }

        .ai-panel-hdr {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0
        }

        .ai-service-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 13px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: .14s;
            text-decoration: none
        }

        .ai-service-btn:hover {
            border-color: var(--blue);
            transform: translateY(-1px)
        }

        .ai-service-icon {
            width: 26px;
            height: 26px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0
        }

        @keyframes spin {
            from {
                transform: rotate(0)
            }

            to {
                transform: rotate(360deg)
            }
        }

        .spin {
            animation: spin .6s linear
        }

        body.light {
            --bg: #f3f3f5;
            --bg2: #fff;
            --bg3: #ededf0;
            --bg4: #e4e4e9;
            --border: #dcdce2;
            --border2: #c8c8d0;
            --text: #18181f;
            --text2: #555566;
            --text3: #9898aa;
            --blue-dim: #e5eeff;
            --green-dim: #e5f8f1;
            --amber-dim: #fef8e6;
            --red-dim: #feeaea;
            --purple-dim: #f1efff
        }

        .resizable-img-container {
            display: inline-block;
            position: relative;
            margin: 6px 0
        }

        .resizable-img-container img {
            display: block;
            border-radius: 6px;
            object-fit: contain
        }

        .resizable-img-container .resize-handle {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 14px;
            height: 14px;
            background: var(--blue);
            border: 2px solid var(--bg2);
            border-radius: 3px;
            cursor: se-resize;
            z-index: 10;
            opacity: 0;
            transition: opacity .15s
        }

        .resizable-img-container:hover .resize-handle {
            opacity: 1
        }

        .alarm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadein .2s ease;
            padding: 20px
        }

        .alarm-box {
            background: var(--bg2);
            border: 2px solid var(--red);
            border-radius: 16px;
            padding: 32px 40px;
            text-align: center;
            animation: slidein .2s ease;
            max-width: 340px;
            width: 100%
        }

        .alarm-box h2 {
            color: var(--red);
            font-size: 20px;
            margin-bottom: 8px
        }

        .alarm-box p {
            color: var(--text2);
            font-size: 14px;
            margin-bottom: 16px
        }

        .draw-panel-overlay {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            animation: fadein .15s ease
        }

        .draw-panel-hdr {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            height: var(--hdr);
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10
        }

        .draw-panel-hdr .logo {
            font-size: 15px
        }

        .draw-panel-body {
            flex: 1;
            overflow: hidden;
            position: relative
        }

        .draw-panel-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block
        }

        .draw-panel-badge {
            font-size: 11px;
            color: var(--text3);
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 5px
        }

        .b64-preview {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
            border-radius: 8px;
            background: var(--bg3);
            border: 1px solid var(--border);
            padding: 4px
        }

        .b64-preview.pdf-preview {
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
            color: var(--text3)
        }

        .b64-preview.pdf-preview svg {
            opacity: .4
        }

        .b64-output-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 6px
        }

        /* ══════════════════════════════════════════════
           CALENDAR — MOBILE TOP / BOTTOM LAYOUT
           ══════════════════════════════════════════════ */
        .cal-m {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            background: var(--bg2)
        }

        .cal-m-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 6
        }

        .cal-m-tabs button {
            flex: 1 1 0;
            padding: 12px 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text3);
            border-bottom: 2px solid transparent;
            cursor: pointer;
            white-space: nowrap
        }

        .cal-m-tabs button.on {
            color: var(--blue);
            border-bottom-color: var(--blue)
        }

        .cal-m-cal {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .cal-m-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px
        }

        .cal-m-navbtn {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            font-size: 19px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0
        }

        .cal-m-navbtn:active {
            background: var(--bg4)
        }

        .cal-m-navtitle {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            background: transparent;
            border: none;
            padding: 8px 4px
        }

        .cal-m-grid {
            padding: 0 8px 4px
        }

        .cal-m-actions {
            display: flex;
            gap: 6px;
            padding: 6px 10px 12px
        }

        .cal-m-actions .btn {
            flex: 1;
            padding: 9px 10px;
            font-size: 12px
        }

        .cal-m-day {
            flex-shrink: 0;
            scroll-margin-top: 44px
        }

        .cal-m-dayhdr {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: var(--bg3);
            border-bottom: 1px solid var(--border)
        }

        .cal-m-daytitle {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3
        }

        .cal-m-daysub {
            font-size: 11px;
            color: var(--text3);
            margin-top: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap
        }

        .cal-today-badge {
            font-size: 9px;
            padding: 1px 6px;
            border-radius: 8px;
            background: var(--blue-dim);
            color: var(--blue);
            font-weight: 700;
            letter-spacing: .3px
        }

        .cal-m-list {
            padding: 12px
        }

        .pwa-banner {
            position: fixed;
            bottom: calc(18px + var(--safe-bottom));
            left: 18px;
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .5);
            z-index: 100;
            animation: slidein .2s ease
        }

        .pwa-banner button.pwa-install {
            padding: 6px 14px;
            border-radius: 8px;
            background: var(--blue);
            color: #fff;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer
        }

        .pwa-banner button.pwa-dismiss {
            background: none;
            border: none;
            color: var(--text3);
            cursor: pointer;
            font-size: 14px;
            padding: 4px
        }

        /* ══════════════════════════════════════════════
           DIFF VIEWER
           ══════════════════════════════════════════════ */
        .diff-scroll {
            font-family: 'DM Mono', monospace;
            font-size: 12px;
            line-height: 1.65;
            background: var(--bg3);
        }

        .diff-row {
            display: flex;
            align-items: stretch;
            min-height: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, .025);
        }

        .diff-num {
            width: 46px;
            flex-shrink: 0;
            text-align: right;
            padding: 1px 8px 1px 4px;
            color: var(--text3);
            background: var(--bg4);
            border-right: 1px solid var(--border);
            user-select: none;
            font-size: 10px;
            line-height: 1.9;
            overflow: hidden;
        }

        .diff-cell {
            flex: 1;
            min-width: 0;
            padding: 1px 10px;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text2);
        }

        .diff-cell.add {
            background: rgba(62, 207, 142, .12);
            color: var(--text);
        }

        .diff-cell.del {
            background: rgba(247, 111, 111, .12);
            color: var(--text);
        }

        .diff-cell.empty {
            background-image: repeating-linear-gradient(45deg,
                    transparent, transparent 6px,
                    rgba(255, 255, 255, .022) 6px,
                    rgba(255, 255, 255, .022) 12px);
        }

        .diff-mid {
            width: 22px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 11px;
            user-select: none;
        }

        .diff-mid.add {
            color: var(--green);
            background: rgba(62, 207, 142, .18);
        }

        .diff-mid.del {
            color: var(--red);
            background: rgba(247, 111, 111, .18);
        }

        .diff-mark-add {
            background: rgba(62, 207, 142, .40);
            border-radius: 3px;
            padding: 0 1px;
        }

        .diff-mark-del {
            background: rgba(247, 111, 111, .40);
            border-radius: 3px;
            padding: 0 1px;
        }

        /* ── Diff navigation: minimap gutter ── */
        .diff-minimap {
            width: 14px;
            flex-shrink: 0;
            background: var(--bg4);
            border-left: 1px solid var(--border);
            position: relative;
            cursor: pointer;
            overflow: hidden;
            user-select: none;
        }

        .diff-minimap-mark {
            position: absolute;
            left: 2px;
            right: 2px;
            min-height: 2px;
            border-radius: 2px;
            pointer-events: none;
            transition: opacity .12s;
        }

        .diff-minimap-mark.add {
            background: var(--green);
        }

        .diff-minimap-mark.del {
            background: var(--red);
        }

        .diff-minimap-mark.mod {
            background: linear-gradient(to bottom,
                    var(--red) 0%, var(--red) 48%,
                    var(--green) 52%, var(--green) 100%);
        }

        .diff-row.diff-active {
            box-shadow: inset 4px 0 0 var(--amber);
            background: rgba(247, 195, 90, .06);
        }

        /* wider minimap on touch devices */
        @media (max-width: 640px) {
            .diff-minimap {
                width: 20px;
            }
        }

        body.light .diff-cell.add {
            background: rgba(62, 207, 142, .18);
        }

        body.light .diff-cell.del {
            background: rgba(247, 111, 111, .18);
        }

        body.light .diff-cell.empty {
            background-image: repeating-linear-gradient(45deg,
                    transparent, transparent 6px,
                    rgba(0, 0, 0, .035) 6px,
                    rgba(0, 0, 0, .035) 12px);
        }

        /* ══════════════════════════════════════════════
           OCR DROPZONE
           ══════════════════════════════════════════════ */
        .ocr-drop {
            border: 2px dashed var(--border2);
            border-radius: 12px;
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            background: var(--bg3);
        }

        .ocr-drop:hover,
        .ocr-drop.over {
            border-color: var(--blue);
            background: var(--blue-dim);
        }

        .ocr-img-wrap {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg4);
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 260px;
        }

        .ocr-img-wrap img {
            max-width: 100%;
            max-height: 260px;
            object-fit: contain;
            display: block;
        }

        .ocr-progress {
            height: 6px;
            background: var(--bg4);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .ocr-progress>div {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--purple));
            border-radius: 3px;
            transition: width .2s;
        }

        /* ── DESKTOP: > 900px ── */
        @media(min-width:901px) {
            .col {
                border-top: 1px solid var(--border)
            }

            .col-hdr-actions {
                opacity: 0
            }

            .col-hdr:hover .col-hdr-actions {
                opacity: 1
            }
        }

        /* ── TABLET: 641–900px ── */
        @media(min-width:641px) and (max-width:900px) {
            .col {
                min-width: 200px;
                max-width: 250px;
                border-top: 3px solid var(--border)
            }

            .col-hdr-actions {
                opacity: 1
            }

            .header {
                padding: 0 8px;
                gap: 4px
            }

            .search-inp {
                width: 120px
            }
        }

        /* ── MOBILE: ≤ 640px ── */
        @media(max-width:640px) {
            :root {
                --hdr: 48px
            }

            html,
            body {
                height: 100%;
                overflow: hidden
            }

            .app {
                height: 100vh;
                height: 100dvh;
                overflow: hidden
            }

            .header {
                padding: 0 8px;
                gap: 3px;
                padding-top: var(--safe-top)
            }

            .logo {
                font-size: 16px;
                margin-right: 2px
            }

            .stats-desktop {
                display: none !important
            }

            .search-inp {
                width: 110px;
                font-size: 12px
            }

            .ibtn {
                width: 30px;
                height: 30px;
                border-radius: 7px
            }

            .board-wrap {
                flex: 1;
                overflow: hidden;
                min-height: 0
            }

            .board {
                padding: 8px;

        function Icon({ name, size = 16, className = '', style }) {

        }

        const iconTextPattern = new RegExp('(' + Object.keys(ICON_SYMBOLS)
            .sort((left, right) => right.length - left.length)
            .map(symbol => symbol.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');

        function IconLabel({ text }) {
            if (typeof text !== 'string') return text;
            return text.split(iconTextPattern).map((part, index) => ICON_SYMBOLS[part]
                ? <Icon key={index} name={ICON_SYMBOLS[part]} size="1em" /> : part);
        }

            function iconHTML(name) {

                icon.setAttribute('class', 'ui-icon');

                icon.setAttribute('height', '16');

            }

        }

        /* ── PWA ── */
        (function () {

        })();

        /* ── CONSTANTS ── */
        const PRIORITY_LIST = ['P0', 'P1', 'P2', 'None'];
        const COL_PALETTE = ['#4f8ef7', '#f7c35a', '#a78bfa', '#3ecf8e', '#f76f6f', '#fb923c', '#34d399', '#e879f9', '#60a5fa',
